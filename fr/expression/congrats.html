    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 23.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, exFR, exEN, exFR, exEN, ...]
     note is "" when the phrase needs no explanation; those cards get
     two examples instead.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/congrats/";
      const AUD_EXT = "mp3?v=261011";

      const categories = [
        {
          en: "Well done!",
          fr: "Félicitations",
          desc: "The core set: for a success, an exam, a win, a job well done.",
          cards: [
            ["Félicitations !", "Congratulations!", "The all-purpose choice, for achievements and happy events alike, and the one you write on a card. Always plural. Félicitations pour + noun: félicitations pour ton examen.",
              "— J'ai eu mon permis ! — Félicitations !", "— I passed my driving test! — Congratulations!"],
            ["Toutes mes félicitations !", "My warmest congratulations!", "Fuller and warmer than félicitations alone; ideal for cards, emails and anyone you call vous.",
              "Toutes mes félicitations pour votre promotion, c'est amplement mérité.", "Warmest congratulations on your promotion, it's thoroughly deserved."],
            ["Bravo !", "Well done!", "For a performance or an effort you witnessed; also what audiences shout. Bravo pour… or bravo à toi. Félicitations covers life events; bravo doesn't.",
              "Bravo pour ton discours, tout le monde a adoré.", "Well done on your speech, everyone loved it."],
            ["Bien joué !", "Nicely done! / Nice one!", "Literally ‘well played’. Rewards a clever move or a smart result as much as hard work.",
              "— J'ai réussi à avoir vingt pour cent de réduction. — Bien joué !", "— I managed to get twenty percent off. — Nice one!"],
            ["Chapeau !", "Hats off!", "Admiration for something difficult, as if raising your hat. Stronger still: chapeau bas !",
              "Tu as couru le marathon en moins de quatre heures ? Chapeau !", "You ran the marathon in under four hours? Hats off!"],
          ],
        },
        {
          en: "Well deserved",
          fr: "Tu l'as mérité",
          desc: "Crediting the work behind the success, not just the result.",
          cards: [
            ["Tu l'as bien mérité.", "You really earned it.", "Says the success is no accident. Formal: vous l'avez bien mérité.",
              "— J'ai enfin eu ma promotion ! — Tu l'as bien mérité.", "— I finally got my promotion! — You really earned it."],
            ["C'est mérité !", "Well deserved!", "",
              "— Elle a gagné le premier prix. — C'est mérité, son projet était génial.", "— She won first prize. — Well deserved, her project was brilliant.",
              "Une victoire amplement méritée !", "A thoroughly deserved win!"],
            ["Tous tes efforts ont payé.", "All your hard work paid off.", "Payer here means ‘to pay off’. Shorter: ça a payé !",
              "Six mois de révisions… et tous tes efforts ont payé !", "Six months of revision… and all your hard work paid off!"],
            ["Je savais que tu y arriverais.", "I knew you'd do it.", "Y arriver = to manage it, to make it. Shows you believed in them all along.",
              "— Je suis prise à Sciences Po ! — Je savais que tu y arriverais !", "— I got into Sciences Po! — I knew you'd do it!"],
            ["Tu peux être fier(ère) de toi.", "You can be proud of yourself.", "Encourages them to own the success. Fière for a woman; formal: vous pouvez être fier de vous.",
              "Ton premier roman publié ? Tu peux être fière de toi.", "Your first novel published? You can be proud of yourself."],
          ],
        },
        {
          en: "Casual & slang",
          fr: "Familier",
          desc: "‘You smashed it!’ among friends. Keep these off the office card.",
          cards: [
            ["T'as assuré !", "You nailed it! / You came through!", "Assurer = to deliver, to rise to the occasion. Spoken contraction of tu as assuré.",
              "— Alors, l'entretien ? — Ils m'ont rappelé ! — T'as assuré !", "— So, the interview? — They called me back! — You nailed it!"],
            ["T'as géré !", "You totally handled it!", "Gérer (to manage) as slang for pulling something off in style. In the present, tu gères ! cheers someone on as they go.",
              "Organiser une fête pour cinquante personnes toute seule ? T'as géré !", "Throwing a party for fifty people on your own? You totally handled it!"],
            ["T'as déchiré !", "You crushed it!", "Very casual; déchirer is literally ‘to tear’. Of a thing: ça déchire = it rocks.",
              "Ton concert hier soir, t'as déchiré !", "Your gig last night, you crushed it!"],
            ["Trop fort !", "Amazing! / You're too good!", "Trop means ‘so, really’ in casual speech, not ‘too’. Of the person: t'es trop fort(e) !",
              "— J'ai fini le puzzle de mille pièces en une soirée. — Trop fort !", "— I finished the thousand-piece puzzle in one evening. — Amazing!"],
          ],
        },
        {
          en: "Happy life events",
          fr: "Félicitations pour…",
          desc: "Weddings, babies, degrees and new jobs: félicitations, never bravo.",
          cards: [
            ["Félicitations pour ton mariage !", "Congrats on your wedding!", "To the couple at the reception: félicitations aux mariés ! An engagement is les fiançailles.",
              "Félicitations pour votre mariage, c'était une journée magnifique.", "Congratulations on your wedding, it was a wonderful day."],
            ["Félicitations pour la naissance !", "Congrats on the new baby!", "The standard birth-card phrase, often with the baby's name. Spoken: félicitations pour le bébé !",
              "Félicitations pour la naissance de votre petite Léa !", "Congratulations on the birth of little Léa!"],
            ["Tous mes vœux de bonheur.", "Wishing you every happiness.", "The classic written line for weddings. Vœux is pronounced /vø/: the x is silent.",
              "Tous nos vœux de bonheur aux jeunes mariés !", "Every happiness to the newlyweds!"],
            ["Félicitations pour ton nouveau poste !", "Congrats on the new job!", "Poste = position; among friends, ton nouveau boulot.",
              "— Je commence chez Airbus lundi. — Félicitations pour ton nouveau poste !", "— I start at Airbus on Monday. — Congrats on the new job!"],
            ["Félicitations pour ton diplôme !", "Congrats on graduating!", "Diplôme = degree or diploma. For the French school-leaving exam: félicitations pour ton bac !",
              "Félicitations pour ton diplôme, ta famille doit être tellement fière !", "Congrats on graduating, your family must be so proud!"],
          ],
        },
        {
          en: "Warm & personal",
          fr: "Je suis fier de toi",
          desc: "The heartfelt reaction: sharing the joy, not just acknowledging it.",
          cards: [
            ["Je suis fier(ère) de toi.", "I'm proud of you.", "The warmest thing a parent, partner or close friend can say. Fier /fjɛʁ/: the r is pronounced. Fière when a woman is speaking.",
              "Tu n'as jamais abandonné. Je suis tellement fier de toi.", "You never gave up. I'm so proud of you."],
            ["Je suis trop content(e) pour toi !", "I'm so happy for you!", "Trop here is casual for ‘so’. Neutral: je suis vraiment content pour toi; formal: je suis ravi(e) pour vous.",
              "— Il m'a demandée en mariage ! — Je suis trop contente pour toi !", "— He proposed! — I'm so happy for you!"],
            ["Quelle bonne nouvelle !", "What great news!", "The natural first reaction when someone shares good news. Also c'est génial !",
              "— On attend un deuxième enfant. — Oh, quelle bonne nouvelle !", "— We're expecting a second child. — Oh, what great news!"],
            ["Ça se fête !", "That calls for a celebration!", "Literally ‘that gets celebrated’; usually followed by an offer of drinks. Also il faut fêter ça !",
              "Tu as signé ton CDI ? Ça se fête, je t'invite à boire un verre !", "You got the permanent contract? That calls for a celebration, drinks are on me!"],
          ],
        },
      ];
    </script>
