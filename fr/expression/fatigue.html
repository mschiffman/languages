    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 18.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/fatigue/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Being tired",
          fr: "Être fatigué",
          desc: "From a little sleepy to completely wiped out.",
          cards: [
            ["Je suis crevé(e).", "I'm shattered.", "The everyday casual way to say you're exhausted. Crevé also means punctured: un pneu crevé.",
              "Je suis crevée, je suis restée debout toute la journée.", "I'm shattered, I've been on my feet all day."],
            ["Je suis épuisé(e).", "I'm exhausted.", "Neutral and stronger than fatigué(e). Fine at work or with a doctor.",
              "Je suis épuisé, je dors mal depuis une semaine.", "I'm exhausted, I've been sleeping badly for a week."],
            ["Je suis mort(e) de fatigue.", "I'm dead tired.", "Mort de + noun exaggerates: mort de rire, mort de faim. Also, shorter: je suis mort(e).",
              "Après le déménagement, j'étais morte de fatigue.", "After the move I was dead tired."],
            ["Je suis à plat.", "I'm drained.", "Like a flat battery or tyre: no energy left. Also about mood: je suis un peu à plat en ce moment.",
              "Cette grippe m'a mis à plat.", "This flu has really knocked me out."],
            ["Je tombe de sommeil.", "I'm falling asleep on my feet.", "Literally ‘I'm falling from sleep’. Sleepy rather than worn out. Also je dors debout.",
              "Je tombe de sommeil, je vais me coucher.", "I can barely keep my eyes open, I'm going to bed."],
            ["Je n'en peux plus.", "I can't go on.", "Physically or emotionally at the end. Spoken: j'en peux plus.",
              "On marche depuis cinq heures, je n'en peux plus.", "We've been walking for five hours, I can't go on."],
            ["J'ai la tête qui tourne.", "My head's spinning.", "Dizzy, from tiredness, heat or hunger. Also j'ai des vertiges (I feel dizzy).",
              "J'ai la tête qui tourne, je dois m'asseoir.", "My head's spinning, I need to sit down."],
          ],
        },
        {
          en: "Needing a rest",
          fr: "Faire une pause",
          desc: "Asking for a break, a breather or a nap.",
          cards: [
            ["J'ai besoin d'une pause.", "I need a break.", "A short pause in work or effort. Ongoing: on fait une pause ? (shall we take a break?)",
              "J'ai besoin d'une pause, ça fait trois heures que je suis sur cet écran.", "I need a break, I've been staring at this screen for three hours."],
            ["Faut que je fasse une pause.", "I've got to take a break.", "Spoken form of il faut que je fasse une pause: more urgent than j'ai besoin d'une pause.",
              "Faut que je fasse une pause, j'arrive plus à me concentrer.", "I've got to take a break, I can't concentrate any more."],
            ["J'ai besoin de souffler.", "I need a breather.", "Souffler: to blow, to catch your breath. Also about a longer rest: prendre quelques jours pour souffler.",
              "Après ce projet, j'ai besoin de souffler un peu.", "After this project, I need a bit of a breather."],
            ["J'ai besoin de décompresser.", "I need to unwind.", "Decompress after stress. Very common after work or exams.",
              "Une semaine horrible ! J'ai besoin de décompresser ce week-end.", "What a horrible week! I need to unwind this weekend."],
            ["Je vais faire une sieste.", "I'm going to take a nap.", "Une sieste: a nap, often after lunch. Very short: une petite sieste.",
              "Je vais faire une petite sieste, réveille-moi à quatre heures.", "I'm going to take a little nap, wake me at four."],
            ["Je vais me coucher.", "I'm off to bed.", "Se coucher: to go to bed. Also, casual: je vais au lit, je vais dormir.",
              "Bon, je vais me coucher, je me lève tôt demain.", "Right, I'm off to bed, I'm up early tomorrow."],
          ],
        },
        {
          en: "At the end of your rope",
          fr: "Le ras-le-bol",
          desc: "When tiredness turns into being fed up.",
          cards: [
            ["Je craque.", "I'm cracking up.", "Craquer: to snap, to break down, or to give in to temptation: j'ai craqué pour cette robe. Context sorts it out.",
              "Les enfants hurlent depuis ce matin, je craque.", "The kids have been screaming since this morning, I'm losing it."],
            ["J'abandonne.", "I give up.", "Also je laisse tomber (I'm dropping it). Stronger with j'en peux plus in front.",
              "J'en peux plus, j'abandonne. Ce puzzle est impossible.", "I can't take any more, I give up. This puzzle's impossible."],
            ["C'est trop, là.", "This is too much.", "Là adds ‘right now, seriously’. Also c'en est trop (that's the last straw), more formal.",
              "Trois réunions et deux urgences avant midi… c'est trop, là.", "Three meetings and two emergencies before noon… this is too much."],
            ["J'en ai plein le dos.", "I've had it up to here.", "Literally ‘I've got a full back of it’: fed up with a burden. Casual.",
              "J'en ai plein le dos de ses retards.", "I've had it up to here with him always being late."],
            ["Je sature.", "I've hit my limit.", "Saturer: to be saturated, unable to take in any more. Common at work or when studying.",
              "Encore un tableau Excel ? Je sature.", "Another spreadsheet? I've hit my limit."],
          ],
        },
      ];
    </script>
