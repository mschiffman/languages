    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 28.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/refusal/";
      const AUD_EXT = "mp3?v=261009";

      const categories = [
        {
          en: "Politely turning something down",
          fr: "Refuser poliment",
          desc: "The everyday declines for food, drink, invitations and requests.",
          cards: [
            ["Sans façon.", "No thank you, really.", "Literally ‘without ceremony’. A sincere no that heads off the ‘go on, just a little’ insistence. Classic at the table, slightly old-fashioned.",
              "— Encore un peu de gâteau ? — Sans façon, merci, c'était délicieux.", "— A little more cake? — No, honestly, thank you — it was delicious."],
            ["Non merci.", "No thank you.", "The standard polite no to an offer. In France a bare merci in reply to an offer is usually heard as ‘no thanks’, but non merci leaves no doubt.",
              "— Un peu plus de vin ? — Non merci, je conduis.", "— A bit more wine? — No thanks, I'm driving."],
            ["Non, ça va, merci.", "No, I'm fine, thanks.", "The dinner-table workhorse. Here ça va means ‘I'm fine as I am’, not ‘how are you’: you decline because you don't need anything.",
              "— Tu veux des œufs brouillés ? — Non, merci, ça va.", "— Want some scrambled eggs? — No, thanks, I'm fine."],
            ["Je peux pas.", "I can't.", "Refuses on grounds of ability or logistics, so it rarely offends. Usually followed by an excuse. Spoken drops the ne: je peux pas, written je ne peux pas.",
              "— Tu viens ? — Je peux pas.", "— Are you coming? — I can't."],
            ["C'est impossible.", "It's impossible.", "Blames circumstances rather than your will, so it declines without sounding unwilling. Normally followed by the reason.",
              "— Tu peux venir samedi ? — C'est impossible, je travaille.", "— Can you come on Saturday? — I can't possibly, I'm working."],
            ["Je vais m'en passer.", "I'll do without. / I'll pass.", "From se passer de (to do without). Neutral: states your choice without judging the offer.",
              "Le dessert a l'air riche — je vais m'en passer.", "The dessert looks rich — I'll pass on it."],
            ["Une autre fois (peut-être).", "Another time, perhaps.", "A soft no dressed as a rain check. Either a genuine postponement or a gentle brush-off; the tone decides.",
              "— On prend un café ? — Une autre fois, là je suis débordé.", "— Fancy a coffee? — Another time — I'm swamped right now."],
          ],
        },
        {
          en: "Can't be bothered / not interested",
          fr: "Pas intéressé",
          desc: "Softer than a hard no, but they clearly signal a lack of interest, energy or necessity.",
          cards: [
            ["J'ai pas envie.", "I don't feel like it.", "A refusal grounded purely in mood. Takes de + infinitive or noun. Dropped ne; full form je n'ai pas envie.",
              "J'ai pas envie d'en parler.", "I don't feel like talking about it."],
            ["Pas envie.", "Don't feel like it.", "The clipped version: just the reason, no subject or verb. Blunter than j'ai pas envie, so keep it for friends and family.",
              "— On sort ce soir ? — Pas envie.", "— Going out tonight? — Don't feel like it."],
            ["Ça m'intéresse pas.", "I'm not interested.", "About the thing's appeal, not your mood. The standard brush-off for a pitch or unwanted offer. Full form ça ne m'intéresse pas.",
              "— Je te propose un CDI. — Non, ça m'intéresse pas.", "— I'm offering you a permanent contract. — No, I'm not interested."],
            ["C'est pas la peine.", "There's no need.", "La peine = the trouble or effort. Rejects help, an explanation or an effort as unnecessary; gentle or curt by tone.",
              "— Je vais t'expliquer. — C'est pas la peine.", "— I'll explain. — There's no need."],
            ["Pas la peine.", "No need.", "Clipped form of c'est pas la peine. A quick wave-off for help or apologies; takes de + infinitive: pas la peine de t'excuser.",
              "— Je te raccompagne ? — Pas la peine, j'habite à côté.", "— Shall I walk you back? — No need, I live next door."],
          ],
        },
        {
          en: "A firm, flat no",
          fr: "Un non catégorique",
          desc: "‘No way’, ‘absolutely not’: a firm, non-negotiable boundary.",
          cards: [
            ["Pas question.", "Out of the question.", "Clipped, conversational form of il n'est pas question de / il n'en est pas question. Emphatic.",
              "Sortir par ce temps ? Pas question.", "Go out in this weather? Out of the question."],
            ["Hors de question.", "No way. / Out of the question.", "Same meaning as pas question, a register up (fine at work). Takes que + subjunctive, or de + infinitive.",
              "Hors de question que tu leur en fasses cadeau.", "No way you're giving it to them as a gift."],
            ["C'est non !", "The answer is no!", "Names the refusal as a settled decision. Abrupt and final, as when discussion is over.",
              "Clem, c'est non !", "Clem, the answer's no!"],
            ["Absolument pas.", "Absolutely not.", "Flat, unambiguous denial of a suggestion or accusation. Neutral: clear without being crude.",
              "— Tu as donné mon numéro ? — Absolument pas.", "— Did you give out my number? — Absolutely not."],
            ["Certainement pas.", "Certainly not.", "As firm as absolument pas, often with a touch of indignation, as if the suggestion were beneath you.",
              "— Tu vas t'excuser ? — Certainement pas !", "— Are you going to apologize? — Certainly not!"],
            ["Rien du tout !", "Nothing at all!", "On its own it just means ‘nothing at all’. It becomes a refusal as a retort to a demand, or tacked onto a negation to shut it tight: je suis obligée de rien du tout.",
              "Je ne donne rien du tout.", "I'm not giving a single thing."],
          ],
        },
        {
          en: "Forbidding / ‘don't count on it’",
          fr: "Interdire",
          desc: "Refusing before the request is made, or refusing to take part.",
          cards: [
            ["N'y pense même pas.", "Don't even think about it.", "Pre-emptive: refuses the idea before the person can act on it. Direct but not vulgar.",
              "Emprunter ma voiture ? N'y pense même pas.", "Borrow my car? Don't even think about it."],
            ["Compte pas sur moi.", "Don't count on me.", "I'm out; I won't be part of it. Takes pour + noun or infinitive. Full form ne compte pas sur moi.",
              "Compte pas sur moi pour Saber.", "Don't count on me for Saber."],
            ["N'y compte pas.", "Don't count on it.", "Refuses by killing the expectation rather than bowing out of the request.",
              "Si tu attends des excuses, n'y compte pas.", "If you're waiting for an apology, don't count on it."],
            ["En aucun cas.", "Under no circumstances.", "Formal and administrative: the register of rules, contracts and official notices.",
              "Ces données ne doivent en aucun cas être partagées.", "This data must under no circumstances be shared."],
          ],
        },
        {
          en: "Slangier / emphatic refusals",
          fr: "Refus emphatiques",
          desc: "Colourful nos: real, but rarer. Save them for effect.",
          cards: [
            ["Même pas en rêve.", "In your dreams! / Not a chance.", "Literally ‘not even in a dream’. Colloquial and a little cheeky. For friends, family and peers, not the workplace.",
              "Moi, m'excuser ? Même pas en rêve.", "Me, apologize? In your dreams."],
            ["Jamais de la vie !", "Never! / Not on your life!", "Emphatic and expressive but not rude. Safe in most casual settings.",
              "— Tu remonterais sur ce manège ? — Jamais de la vie !", "— Would you go on that ride again? — Never in a million years!"],
            ["Tu peux toujours courir.", "You can keep dreaming.", "Literally ‘you can always run’. Familiar and a bit mocking. Often third person: il peut toujours courir.",
              "Il veut que je travaille gratuitement ? Il peut toujours courir.", "He wants me to work for free? He can keep dreaming."],
            ["Compte là-dessus…", "Yeah, don't hold your breath.", "Read with irony, it means the opposite of ‘count on it’. Folk version: compte là-dessus et bois de l'eau fraîche.",
              "— Il a dit qu'il rembourserait. — Compte là-dessus…", "— He said he'd pay it back. — Yeah, don't hold your breath…"],
          ],
        },
        {
          en: "The nuance: impossible, not refused",
          fr: "Impossible n'est pas refus",
          desc: "‘No way’ in the sense of ‘it can't be done’: these report an obstacle rather than answer a request.",
          cards: [
            ["Pas moyen (de…).", "There's no way to…", "The focus is an obstacle, not your will: something can't be done. In casual speech a bare pas moyen ! can also be a refusal, like ‘no way!’.",
              "Pas moyen d'ouvrir cette fichue porte.", "No way to get this blasted door open."],
            ["Il n'y a pas moyen.", "There's no way.", "Fuller and slightly more formal. Trap: English ‘no way!’ also means disbelief, which is c'est pas vrai !, not hors de question.",
              "Il n'y a pas moyen de le raisonner.", "There's no reasoning with him."],
          ],
        },
      ];
    </script>
