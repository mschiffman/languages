   Media:

      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/idioms/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Food idioms",
          fr: "À la sauce française",
          desc: "French talks about life in terms of food. A lot.",
          cards: [
            ["C'est la cerise sur le gâteau.", "It's the icing on the cake.", "The final touch, a bonus. Also used ironically for one more bad thing.",
              "On a eu du soleil toute la semaine, et en plus, la cerise sur le gâteau : la piscine était vide.", "We had sun all week, and the icing on the cake: the pool was empty."],
            ["C'est du gâteau.", "It's a piece of cake.", "Easy. Same idea: c'est les doigts dans le nez (I could do it with my eyes shut). The opposite: c'est pas du gâteau !",
              "Le permis ? C'est du gâteau, tu vas l'avoir.", "The driving test? It's a piece of cake, you'll pass."],
            ["Raconter des salades.", "To tell tall tales.", "To tell lies or spin stories. Common as an accusation: arrête de raconter des salades !",
              "Il nous raconte des salades, il n'a jamais rencontré Zidane.", "He's spinning us a yarn, he's never met Zidane."],
            ["En faire tout un fromage.", "To make a big fuss about it.", "To blow something small out of proportion. Also en faire tout un plat.",
              "C'est juste une rayure, tu ne vas pas en faire tout un fromage !", "It's just a scratch, don't make a big fuss about it!"],
            ["Tomber dans les pommes.", "To faint.", "To pass out. Probably nothing to do with apples: one theory links it to pâmer, an old verb for swooning.",
              "Il faisait si chaud dans le métro qu'une dame est tombée dans les pommes.", "It was so hot in the metro that a woman fainted."],
            ["Les carottes sont cuites.", "The game's up. / It's all over.", "Nothing more can be done. Resigned, a bit theatrical.",
              "Il reste deux minutes et on perd trois à zéro. Les carottes sont cuites.", "Two minutes left and we're losing three-nil. It's all over."],
            ["Aux petits oignons.", "Done to perfection.", "With great care: je m'en occupe aux petits oignons (I'll take care of it beautifully).",
              "Ma grand-mère nous a reçus aux petits oignons.", "My grandmother looked after us beautifully."],
            ["Appuie sur le champignon !", "Step on it!", "Le champignon is the accelerator pedal here. Same idea: fonce !",
              "On va rater l'avion, appuie sur le champignon !", "We're going to miss the plane, step on it!"],
            ["Mettre du beurre dans les épinards.", "To bring in a bit of extra money.", "To make life a little more comfortable, financially.",
              "Elle donne des cours d'anglais le soir pour mettre du beurre dans les épinards.", "She gives English lessons in the evening to bring in a bit of extra money."],
            ["Pour une bouchée de pain.", "For a song.", "For next to nothing: acheter quelque chose pour une bouchée de pain.",
              "Ils ont acheté cette maison pour une bouchée de pain il y a trente ans.", "They bought this house for a song thirty years ago."],
            ["Avoir un cœur d'artichaut.", "To fall in love easily.", "Like an artichoke, with a leaf for everyone. Affectionate teasing.",
              "Encore amoureux ? Tu as vraiment un cœur d'artichaut !", "In love again? You really do fall for everyone!"],
            ["Mettre son grain de sel.", "To put your two cents in.", "To give an opinion nobody asked for. Je peux mettre mon grain de sel ? (can I chip in?)",
              "Il faut toujours qu'il mette son grain de sel dans nos discussions.", "He always has to put his two cents into our discussions."],
            ["Ça ne mange pas de pain.", "It doesn't cost anything to try.", "Literally ‘it doesn't eat bread’: there's nothing to lose. Spoken: ça mange pas de pain.",
              "Envoie ton CV quand même, ça ne mange pas de pain.", "Send your CV anyway, it doesn't cost anything."],
            ["Avoir la pêche.", "To be full of beans.", "To be full of energy and in a good mood. Also avoir la frite.",
              "T'as la pêche aujourd'hui ! Tu as bien dormi ?", "You're full of beans today! Did you sleep well?"],
          ],
        },
        {
          en: "Animal idioms",
          fr: "Les animaux",
          desc: "Cats, rabbits and hens with a lot to say.",
          cards: [
            ["Appeler un chat un chat.", "To call a spade a spade.", "To say things plainly. Often il faut appeler un chat un chat.",
              "Appelons un chat un chat : ce projet est un échec.", "Let's call a spade a spade: this project is a failure."],
            ["Poser un lapin.", "To stand someone up.", "Not turning up for a date or a meeting: il m'a posé un lapin.",
              "Je l'ai attendue une heure au café, elle m'a posé un lapin.", "I waited an hour for her at the café, she stood me up."],
            ["Avoir le cafard.", "To feel down.", "Le cafard: a cockroach, and also the blues.",
              "Le dimanche soir, j'ai toujours un peu le cafard.", "On Sunday evenings I always feel a bit down."],
            ["Quand les poules auront des dents.", "When pigs fly.", "Never. Literally ‘when hens have teeth’.",
              "Lui, ranger sa chambre ? Quand les poules auront des dents !", "Him, tidy his room? When pigs fly!"],
          ],
        },
        {
          en: "Everyday idioms",
          fr: "La vie de tous les jours",
          desc: "Sayings you'll hear in any conversation.",
          cards: [
            ["Mieux vaut tard que jamais.", "Better late than never.", "Teasing or kind. Same order of words as the English.",
              "Tu as enfin passé ton permis ? Mieux vaut tard que jamais !", "You've finally passed your driving test? Better late than never!"],
            ["Briser la glace.", "To break the ice.", "To start talking in a new or awkward situation. Also rompre la glace.",
              "Pour briser la glace, il a raconté une blague.", "To break the ice, he told a joke."],
            ["Coûter les yeux de la tête.", "To cost an arm and a leg.", "Very expensive. Also coûter un bras.",
              "Cette voiture m'a coûté les yeux de la tête.", "This car cost me an arm and a leg."],
            ["Il pleut des cordes.", "It's raining cats and dogs.", "Literally ‘it's raining ropes’. Also il pleut à verse.",

            ["Tu parles d'un coup de chance !", "Talk about a stroke of luck!", "Tu parles de… : talk about… Can be sincere or ironic: tu parles d'une soirée !",
              "Il a trouvé un billet de cinquante euros par terre. Tu parles d'un coup de chance !", "He found a fifty-euro note on the ground. Talk about a stroke of luck!"],
          ],
        },
      ];
