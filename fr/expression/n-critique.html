    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 38.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, exFR, exEN, exFR, exEN, ...]
     note is "" when the phrase needs no explanation; those cards get
     two examples instead.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/critique/";
      const AUD_EXT = "mp3?v=261013";

      const categories = [
        {
          en: "Doubt & mild disapproval",
          fr: "Pas convaincu",
          desc: "Signalling you're not buying it, without picking a fight.",
          cards: [
            ["Je suis pas convaincu(e).", "I'm not convinced.", "Polite but firm doubt about an idea or argument. Careful speech keeps the ne: je ne suis pas convaincu. Softer: je suis pas sûr(e).",
              "— On devrait tout repeindre en gris. — Je suis pas convaincu, ça fait triste.", "— We should repaint everything grey. — I'm not convinced, it looks gloomy."],
            ["Mouais…", "Hmm… / Yeah, I dunno…", "A grudging, sceptical ‘yeah’: oui and bof rolled into one. Bof on its own is plain indifference: ‘meh’.",
              "— Il est bien, ce film, non ? — Mouais… sans plus.", "— It's a good film, isn't it? — Hmm… it's OK."],
            ["C'est pas terrible.", "It's not great.", "Classic French understatement that usually means ‘it's bad’. Pas top and pas génial work the same way.",
              "— Alors, ce resto ? — Franchement, c'est pas terrible.", "— So, how was the restaurant? — Honestly, it wasn't great."],
            ["Tu crois ?", "You think so? / Really?", "Questions someone's judgement without contradicting them outright. Formal: vous croyez ? Pushed into an accusation: vous croyez quoi, que je l'ai inventée ? (‘what do you think, that I made it up?’)",
              "— Cette robe me va super bien. — Tu crois ?", "— This dress really suits me. — You think?"],
            ["Ça colle pas.", "That doesn't add up.", "Literally ‘it doesn't stick’: the story, the dates or the facts don't fit together. Careful speech: ça ne colle pas.",
              "Je suis désolée, mais ça colle pas : il dit qu'il était chez lui, et sa voiture était au parking.", "I'm sorry, but it doesn't add up: he says he was at home, and his car was in the car park."],
            ["C'est chelou.", "That's weird. / That's dodgy.", "Verlan (back-slang) for louche, ‘shady’. Covers anything strange or suspicious; very informal.",
              "Franchement, vous trouvez pas ça chelou, qu'il soit parti sans rien dire ?", "Honestly, don't you think it's weird that he left without a word?"],
          ],
        },
        {
          en: "Blunt verdicts",
          fr: "C'est nul",
          desc: "Thumbs down on a film, a meal or a plan. Mostly casual; the last one is rude.",
          cards: [
            ["C'est nul.", "It's rubbish. / It sucks.", "The all-purpose thumbs down. Of a person: t'es nul(le), ‘you're useless’. Vulgar intensifier: nul à chier.",
              "C'est nul, hein. Ça marche pas du tout.", "It's rubbish, eh. It doesn't work at all."],
            ["C'est pourri.", "It's lame. / It's crap.", "Literally ‘rotten’: for bad ideas, things in bad shape, and bad luck: un temps pourri, une journée pourrie. For something morally rotten, go up to immonde, ‘vile’: vos méthodes sont immondes.",
              "— On pourrait l'appeler « Super Pizza » ? — Non, c'est pourri.", "— We could call it ‘Super Pizza’? — No, that's lame."],
            ["C'est une daube.", "It's total rubbish.", "Slang for a terrible film, book or product: une vraie daube. (In the kitchen, a daube is a Provençal beef stew.)",
              "J'ai vu le nouveau Marvel. Une daube : deux heures de bagarre et zéro histoire.", "I saw the new Marvel. Total rubbish: two hours of fighting and zero story."],
            ["C'est ridicule.", "That's ridiculous.", "",
              "— Il veut qu'on soit là à sept heures du matin. — C'est ridicule.", "— He wants us there at seven in the morning. — That's ridiculous.",
              "Arrête, tu es ridicule avec ce chapeau.", "Stop it, you look ridiculous in that hat."],
            ["C'est complètement débile !", "That's totally stupid!", "Débile is informal for ‘stupid, idiotic’. Neutral: c'est stupide, c'est idiot.",
              "Payer quinze euros pour une bouteille d'eau ? C'est complètement débile !", "Fifteen euros for a bottle of water? That's totally stupid!"],
            ["Ça n'a aucun intérêt.", "It's pointless.", "Cold and dismissive, but not rude: fine at work. Same verdict: c'est sans intérêt.",
              "Cette réunion n'avait aucun intérêt, on aurait pu tout régler par mail.", "That meeting was pointless, we could have sorted it all out by email."],
            ["C'est foireux.", "It's a shambles. / It's half-baked.", "Informal, from foirer, ‘to flop’: botched or bound to fail. Putting the noun at the end adds punch: elle est bien foireuse, ton enquête.",
              "Elle est bien foireuse, ton enquête. T'as aucune preuve.", "Your investigation is a real shambles. You haven't got a shred of proof."],
            ["C'est des conneries.", "That's bullshit.", "Vulgar but extremely common, so watch who's listening. As an exclamation: quelles conneries ! Milder: c'est des bêtises.",
              "— Il dit que c'est la faute du stagiaire. — C'est des conneries, c'est lui qui a tout signé.", "— He says it's the intern's fault. — That's bullshit, he's the one who signed everything."],
          ],
        },
        {
          en: "Calling someone out",
          fr: "Mais t'es malade ?",
          desc: "Direct challenges to what someone did. Heated and informal.",
          cards: [
            ["Tu te fous de ma gueule ?", "Are you taking the piss?", "Vulgar: you think someone is mocking you or taking you for a fool. To make them stop: arrête de te foutre de ma gueule. Milder: tu te moques de moi ?",
              "Trois heures de retard et pas un message ? Tu te fous de ma gueule ?", "Three hours late and not one text? Are you taking the piss?"],
            ["Mais t'es malade ?", "Are you out of your mind?", "Nothing to do with health: a shocked reaction to something reckless. Same idea: t'es fou ? ça va pas (la tête) ?",
              "Mais t'es malade ? Tu roules à 180 !", "Are you out of your mind? You're doing 180!"],
            ["T'es débile ou quoi ?", "Are you stupid or what?", "Insulting: for close friends or real anger. Plural: vous êtes débiles ou quoi ? Ou quoi ? on the end turns any question into an exasperated challenge.",
              "T'as laissé les clés sur la porte ? T'es débile ou quoi ?", "You left the keys in the door? Are you stupid or what?"],
            ["Tu te rends compte ?", "Do you realize?", "Makes someone face what they've done. Add de: tu te rends compte de ce que tu dis ? Said with a smile, it's plain amazement: tu te rends compte, on a gagné !",
              "Tu te rends compte ? Elle t'a attendu deux heures sous la pluie !", "Do you realize? She waited two hours for you in the rain!"],
            ["Tu sers à rien.", "You're useless.", "Blunt and hurtful: you contribute nothing. Formal or plural: vous servez à rien. Of a thing, ça sert à rien just means ‘it's no use’. Accusing someone of slacking: tu veux pas bosser !",
              "Vous servez à rien ! Ça fait trois semaines qu'on attend une réponse.", "You're useless! We've been waiting three weeks for an answer."],
          ],
        },
        {
          en: "Sarcastic digs",
          fr: "C'est malin !",
          desc: "Criticism dressed up as praise or an innocent question.",
          cards: [
            ["C'est malin !", "Well, that was clever!", "Always ironic: malin means ‘smart’, so this means ‘that was stupid’. A parent's favourite.",
              "T'as mangé tous les biscuits avant le dîner ? C'est malin !", "You ate all the biscuits before dinner? Very clever!"],
            ["Bravo !", "Well done! (ironic)", "Said flat, it congratulates someone on the mess they've made. Bravo, champion ! lays it on thicker.",
              "Bravo, t'as réveillé le bébé.", "Well done, you've woken the baby."],
            ["Comme si… !", "As if…!", "Comme si + imperfect mocks an idea as naive. On its own, comme si ! is a flat ‘as if!’.",
              "Comme si le fric suffisait à faire un bon film !", "As if money were enough to make a good film!"],
            ["C'est quoi, cette excuse ?", "What kind of excuse is that?", "C'est quoi, ce/cette… ? is a scornful ‘what's with this…?’. An excuse fumeuse is a woolly, smoke-and-mirrors one.",
              "Ton chien a mangé tes clés ? C'est quoi, cette excuse fumeuse ?", "Your dog ate your keys? What kind of lame excuse is that?"],
          ],
        },
        {
          en: "Overreacting & bad faith",
          fr: "T'exagères",
          desc: "Telling someone they're making too much of it, or not arguing fairly.",
          cards: [
            ["T'exagères.", "You're exaggerating. / That's a bit much.", "Covers both overstating things and overstepping the mark. Franchement sharpens it. Formal: vous exagérez.",
              "— Tout le monde me déteste au bureau. — T'exagères, franchement.", "— Everyone at work hates me. — Come on, you're exaggerating."],
            ["Fais pas tout un drame.", "Don't make a big deal of it.", "Also fais pas tout un plat (de ça). Overdoing it in general: en faire des tonnes, ‘to lay it on thick’.",
              "C'est juste une rayure sur la voiture, fais pas tout un drame.", "It's just a scratch on the car, don't make a big deal of it."],
            ["Quelle mauvaise foi !", "You're arguing in bad faith!", "Mauvaise foi is refusing to admit what you know is true. Of a person: t'es d'une mauvaise foi ! The film line adds abyssale, ‘bottomless’.",
              "Tu dis que t'as jamais promis ? T'es d'une mauvaise foi abyssale.", "You're saying you never promised? Your bad faith knows no bounds."],
            ["Tu te contredis.", "You're contradicting yourself.", "Points out an inconsistency. Là on the end means ‘right there, just now’.",
              "Hier tu disais le contraire. Tu te contredis, là.", "Yesterday you were saying the opposite. You're contradicting yourself."],
            ["Tu chipotes.", "You're nitpicking.", "Chipoter: to quibble over details, or to pick at your food. Pour rien makes it sound petty.",
              "On parle de deux euros, tu chipotes pour rien.", "We're talking about two euros, you're nitpicking over nothing."],
            ["Arrête de râler.", "Stop moaning.", "Râler is grumbling, said to be a national sport. A habitual moaner is un râleur / une râleuse.",
              "Arrête de râler, on est en vacances !", "Stop moaning, we're on holiday!"],
          ],
        },
        {
          en: "Going on and on",
          fr: "T'es en boucle",
          desc: "When someone won't drop it.",
          cards: [
            ["Tu radotes.", "You're repeating yourself.", "Telling the same story again and again. Often affectionate, of older people. Also tu me l'as déjà dit cent fois.",
              "Tu radotes, papi, tu nous l'as déjà racontée, cette histoire.", "You're repeating yourself, Grandpa, you've already told us that story."],
            ["T'es en boucle.", "You're stuck on a loop.", "Fixated on one subject and can't stop talking about it.",
              "Ça fait une heure que tu parles de ton ex. T'es en boucle !", "You've been talking about your ex for an hour. You're stuck on a loop!"],
            ["T'es lourd.", "You're being a pain.", "Lourd(e), ‘heavy’: tiresome, won't let it go. Avec ça names the subject.",
              "T'es lourd avec ça. T'es en boucle, merde !", "You're going on and on about it. You're stuck on a loop, damn it!"],
            ["Change de disque !", "Change the record!", "Tells someone to give it a rest. Same image: on dirait un disque rayé, ‘you sound like a broken record’.",
              "Oui, je sais, j'aurais dû t'écouter. Change de disque !", "Yes, I know, I should have listened to you. Change the record!"],
            ["Tu me gonfles.", "You're getting on my nerves.", "Informal; gonfler is ‘to pump up’. Of a situation: ça me gonfle. Vulgar: tu me fais chier.",
              "Tu me gonfles avec tes questions. Laisse-moi bosser.", "You're getting on my nerves with your questions. Let me work."],
          ],
        },
        {
          en: "Attitude",
          fr: "Pour qui tu te prends ?",
          desc: "Taking someone down a peg for arrogance or showing off.",
          cards: [
            ["Pour qui tu te prends ?", "Who do you think you are?", "",
              "Tu me donnes des ordres, maintenant ? Pour qui tu te prends ?", "You're giving me orders now? Who do you think you are?",
              "Pour qui vous vous prenez, à couper la file comme ça ?", "Who do you think you are, cutting in line like that?"],
            ["Tu te crois tout permis ?", "You think you can do whatever you like?", "Se croire tout permis: to think the rules don't apply to you. Formal: vous vous croyez tout permis ?",
              "Tu te gares sur la place handicapé ? Tu te crois tout permis ?", "You're parking in the disabled space? Think you can do whatever you like?"],
            ["Arrête de te la raconter.", "Stop showing off.", "Se la raconter: to talk yourself up. Arrête de frimer means the same.",
              "Arrête de te la raconter, tout le monde sait que t'as eu ton permis au troisième essai.", "Stop showing off, everyone knows you passed your driving test on the third try."],
            ["Il se la pète.", "He's full of himself.", "Slang, from péter: acts superior and shows off. Elle se la pète, tu te la pètes.",
              "Depuis qu'il a sa Porsche, il se la pète grave.", "Ever since he got his Porsche, he's been really full of himself."],
          ],
        },
      ];
    </script>
