    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 23.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/permission/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Asking, everyday",
          fr: "Demander",
          desc: "The simple ‘can I…?’ for friends, family and shops.",
          cards: [
            ["Je peux entrer ?", "Can I come in?", "Je peux + infinitive is the everyday way to ask. Est-ce que je peux… ? is a touch fuller and more polite.",
              "Toc toc ! Je peux entrer ?", "Knock knock! Can I come in?"],
            ["Je peux emprunter ton stylo ?", "Can I borrow your pen?", "Emprunter: to borrow; prêter: to lend. The other way round: tu peux me prêter ton stylo ?",
              "Je peux emprunter ton chargeur ? Je n'ai plus de batterie.", "Can I borrow your charger? My battery's dead."],
            ["Je pourrais partir plus tôt ?", "Could I leave early?", "Je peux → je pourrais: the same question, much gentler. The single most useful politeness lever.",
              "Je pourrais partir plus tôt vendredi ? J'ai un train à prendre.", "Could I leave early on Friday? I've got a train to catch."],
          ],
        },
        {
          en: "Do you mind if…?",
          fr: "Ça te dérange si… ?",
          desc: "Checking it won't bother anyone, and the trap in the answer.",
          cards: [
            ["Ça te dérange si j'ouvre la fenêtre ?", "Do you mind if I open the window?", "Careful with the answer: non, pas du tout means ‘go ahead’. Oui means it does bother them. Formal: ça vous dérange si… ?",
              "Ça te dérange si j'ouvre la fenêtre ? On étouffe ici.", "Do you mind if I open the window? It's stifling in here."],
            ["Ça vous dérange si je m'assois ici ?", "Do you mind if I sit here?", "The standard question for a free seat. Short form while pointing: c'est libre ? (is this seat free?)",
              "Excusez-moi, ça vous dérange si je m'assois ici ?", "Excuse me, do you mind if I sit here?"],
            ["Je peux me permettre une remarque ?", "May I make a comment?", "Se permettre: to take the liberty. A polite warning that criticism is coming.",
              "Je peux me permettre une petite remarque ? Le titre est un peu long.", "May I make a small comment? The title's a bit long."],
            ["Si ça ne te gêne pas…", "If it's not awkward for you…", "Gêner: to bother, to embarrass. Softens a request. Spoken: si ça te gêne pas.",
              "Si ça ne te gêne pas, j'aimerais amener ma sœur.", "If it's not awkward for you, I'd like to bring my sister."],
          ],
        },
        {
          en: "Formal requests",
          fr: "Demander poliment",
          desc: "Offices, strangers, letters: the polished forms.",
          cards: [
            ["Puis-je vous poser une question ?", "May I ask you a question?", "Puis-je, never peux-je, when you invert. Formal; in speech je peux vous poser une question ?",
              "Puis-je vous poser une question sur votre parcours ?", "May I ask you a question about your background?"],
            ["Vous permettez ?", "May I?", "Said as you reach for a chair, a newspaper, or squeeze past. Informal: tu permets ?",
              "Vous permettez ? Je voudrais juste prendre cette chaise.", "May I? I'd just like to take this chair."],
            ["Serait-il possible de… ?", "Would it be possible to…?", "Very polite: emails, hotels, administration. + infinitive: serait-il possible de changer de chambre ?",
              "Serait-il possible de décaler le rendez-vous à jeudi ?", "Would it be possible to move the appointment to Thursday?"],
            ["J'aurais besoin d'une autorisation.", "I'd need authorisation.", "The conditional keeps it polite. The document: une autorisation; the verb: autoriser.",
              "Pour filmer dans le musée, j'aurais besoin d'une autorisation ?", "Would I need authorisation to film in the museum?"],
          ],
        },
        {
          en: "Saying yes",
          fr: "Donner la permission",
          desc: "Go ahead, be my guest, of course.",
          cards: [
            ["Allez-y !", "Go ahead!", "Formal or plural; to one friend: vas-y ! Warmer: allez-y, je vous en prie.",
              "— Je peux prendre une photo ? — Allez-y !", "— Can I take a photo? — Go ahead!"],
            ["Non, pas du tout.", "No, not at all.", "The right answer to ça te dérange si… ? It means ‘it doesn't bother me at all’.",
              "— Ça vous dérange si j'ouvre la fenêtre ? — Non, pas du tout.", "— Do you mind if I open the window? — No, not at all."],
            ["Pas de problème.", "No problem.", "Casual and very common. Slangier: pas de souci, y a pas de souci.",
              "— Je peux venir avec mon chien ? — Pas de problème.", "— Can I come with my dog? — No problem."],
            ["T'as le droit.", "You're allowed.", "Spoken form of tu as le droit. Also playful: t'as le droit de changer d'avis (you're allowed to change your mind).",
              "— Je peux reprendre du dessert ? — T'as le droit, c'est les vacances !", "— Can I have more dessert? — You're allowed, it's the holidays!"],
            ["Fais-toi plaisir !", "Go for it! / Treat yourself!", "Literally ‘give yourself pleasure’: go ahead and enjoy it. Formal: faites-vous plaisir.",
              "— Je peux prendre le dernier croissant ? — Fais-toi plaisir !", "— Can I take the last croissant? — Go for it!"],
          ],
        },
        {
          en: "Saying no",
          fr: "Refuser la permission",
          desc: "From a polite ‘I'd rather you didn't’ to a flat ‘it's forbidden’.",
          cards: [
            ["Je préférerais que non.", "I'd rather you didn't.", "Polite but clear. The conditional softens it. Spoken shortcut: je préfère pas.",
              "— Je peux fumer sur le balcon ? — Je préférerais que non.", "— Can I smoke on the balcony? — I'd rather you didn't."],
            ["J'aimerais mieux pas.", "I'd rather not.", "Aimer mieux = préférer, slightly more casual. Add désolé(e) to soften it.",
              "— Je peux lire ton journal ? — J'aimerais mieux pas, désolée.", "— Can I read your diary? — I'd rather not, sorry."],
            ["Ça m'arrange pas trop.", "That doesn't really work for me.", "Polite no on practical grounds: it's inconvenient. Full form: ça ne m'arrange pas trop.",
              "— Je peux passer ce soir ? — Ce soir, ça m'arrange pas trop. Demain ?", "— Can I come by tonight? — Tonight doesn't really work for me. Tomorrow?"],
            ["C'est interdit.", "It's forbidden.", "The rule speaks. Signs say interdit de fumer, stationnement interdit.",
              "Désolé, c'est interdit de prendre des photos ici.", "Sorry, taking photos is forbidden here."],
            ["C'est pas autorisé.", "It's not allowed.", "Softer and more bureaucratic than interdit. Full form: ce n'est pas autorisé.",
              "Les chiens, c'est pas autorisé dans le magasin, désolée.", "Dogs aren't allowed in the shop, sorry."],
            ["Malheureusement, ce n'est pas possible.", "Unfortunately, that's not possible.", "The standard counter-desk refusal: polite, final. Spoken: c'est pas possible.",
              "Malheureusement, ce n'est pas possible de changer le billet.", "Unfortunately, it's not possible to change the ticket."],
            ["Il vaut mieux pas.", "Better not.", "Advice more than a ban: there's a good reason. Spoken: vaut mieux pas.",
              "— Je peux me baigner ? — Il vaut mieux pas, il y a du courant.", "— Can I go for a swim? — Better not, there's a current."],
          ],
        },
      ];
    </script>
