    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 48.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]

      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/connectors/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Adding",
          fr: "Ajouter",
          desc: "And on top of that…",
          cards: [
            ["En plus, …", "On top of that, … / Besides, …", "The everyday way to add a point, often a complaint. Also as an adverb: il est gentil, et drôle en plus.",
              "Il pleut, et en plus, j'ai oublié mon parapluie.", "It's raining, and on top of that I've forgotten my umbrella."],
            ["D'ailleurs, …", "Besides, … / Actually, …", "Adds a supporting point, or links to a related one. Also by the way: d'ailleurs, tu as des nouvelles de Marc ?",
              "Il n'est pas venu. D'ailleurs, il n'avait pas répondu à l'invitation.", "He didn't come. Actually, he hadn't replied to the invitation."],
            ["De plus, …", "Moreover, … / Furthermore, …", "More formal than en plus: writing, presentations. Also en outre.",
              "Ce logement est trop cher. De plus, il est loin du centre.", "This flat is too expensive. Moreover, it's far from the centre."],
            ["Moi non plus.", "Me neither.", "Non plus is the negative of aussi: moi aussi (me too), moi non plus (me neither).",
              "— Je n'aime pas les huîtres. — Moi non plus.", "— I don't like oysters. — Me neither."],
            ["Non seulement… mais aussi…", "Not only… but also…", "Emphatic addition. Also non seulement… mais en plus…",
              "Il est non seulement intelligent, mais aussi très drôle.", "He's not only clever, but also very funny."],
          ],
        },
        {
          en: "Contrasting",
          fr: "Opposer",
          desc: "But, however, even though…",
          cards: [
            ["Pourtant, …", "Yet, … / And yet, …", "Introduces something surprising given what came before. At the end too: c'est simple, pourtant.",
              "J'ai révisé toute la nuit. Pourtant, j'ai raté l'examen.", "I revised all night. And yet I failed the exam."],
            ["Par contre, …", "On the other hand, … / But, …", "Very common in speech. Purists prefer en revanche, but everyone says par contre.",
              "La chambre est petite. Par contre, la vue est magnifique.", "The room is small. On the other hand, the view is magnificent."],
            ["En revanche, …", "On the other hand, …", "More formal than par contre: writing, work, the news.",
              "Le premier film était excellent. En revanche, la suite est décevante.", "The first film was excellent. The sequel, on the other hand, is disappointing."],
            ["Malgré tout, …", "All the same, … / Despite everything, …", "Despite what's just been said. Malgré + noun: malgré la pluie (despite the rain).",
              "C'était une année difficile. Malgré tout, on a de bons souvenirs.", "It was a hard year. All the same, we have good memories."],
            ["Alors que…", "Whereas… / While…", "Contrasts two facts. Also tandis que (more formal).",
              "Il fait froid à Paris, alors qu'à Nice il fait vingt degrés.", "It's cold in Paris, whereas in Nice it's twenty degrees."],
            ["Au lieu de…", "Instead of…", "+ infinitive or noun: au lieu de travailler, au lieu du train.",
              "Au lieu de te plaindre, aide-moi un peu !", "Instead of complaining, give me a hand!"],
            ["Même si…", "Even if… / Even though…", "Takes the indicative, unlike bien que. Si becomes s' before il: même s'il pleut.",
              "On ira à la plage, même s'il fait un peu froid.", "We'll go to the beach, even if it's a bit cold."],
            ["Bien que…", "Although…", "Takes the subjunctive: bien qu'il soit tard. More formal than même si.",
              "Bien qu'il soit malade, il est venu travailler.", "Although he's ill, he came in to work."],
            ["Au contraire.", "On the contrary.", "Rejects a suggestion and says the opposite is true. Also bien au contraire.",
              "— Tu t'ennuies ? — Au contraire, je m'amuse beaucoup !", "— Are you bored? — On the contrary, I'm having a great time!"],
          ],
        },
        {
          en: "Cause & effect",
          fr: "Expliquer",
          desc: "Because, since, so, as a result.",
          cards: [
            ["Parce que…", "Because…", "Answers pourquoi ? In writing, car is common: il est resté, car il pleuvait.",
              "Je suis en retard parce que mon bus n'est pas passé.", "I'm late because my bus didn't come."],
            ["Puisque…", "Since… / Seeing as…", "The reason is already known or obvious. Can sound a little sharp: puisque tu insistes…",
              "Puisque tu es là, aide-moi à porter ça.", "Seeing as you're here, help me carry this."],
            ["Comme…", "As… / Since…", "At the start of a sentence, gives the reason first. Not after the main clause; use parce que there.",
              "Comme il pleuvait, on est restés à la maison.", "As it was raining, we stayed at home."],
            ["À cause de…", "Because of…", "+ noun, usually for something bad. For something good: grâce à (thanks to).",
              "Je suis en retard à cause des bouchons.", "I'm late because of the traffic."],
            ["Grâce à…", "Thanks to…", "+ noun or pronoun, for a good result: grâce à toi, grâce à ce livre.",
              "Grâce à toi, j'ai trouvé un appartement.", "Thanks to you, I found a flat."],
            ["C'est pour ça que…", "That's why…", "Spoken and very common. More formal: c'est pourquoi…",
              "Il travaille de nuit. C'est pour ça qu'il dort le matin.", "He works nights. That's why he sleeps in the mornings."],
            ["Donc…", "So… / Therefore…", "The logical consequence. In speech, also a pause word: donc, je disais…",
              "Il n'y avait plus de train, donc on a pris un taxi.", "There were no more trains, so we took a taxi."],
            ["Du coup…", "So… / As a result…", "Very common spoken alternative to donc. Some find it overused.",
              "Il a raté le bus, du coup il est arrivé en retard.", "He missed the bus, so he was late."],
            ["Tellement… que…", "So… that…", "Tellement + adjective + que + result. Also si… que… (more written).",
              "Il faisait tellement chaud qu'on n'a pas pu dormir.", "It was so hot that we couldn't sleep."],
          ],
        },
        {
          en: "Purpose",
          fr: "Le but",
          desc: "In order to, so that.",
          cards: [
            ["Pour que…", "So that…", "Takes the subjunctive: pour que tu puisses, pour qu'il comprenne. Formal: afin que.",
              "Je parle lentement pour que tu comprennes.", "I'm speaking slowly so that you understand."],
            ["Afin de…", "In order to…", "+ infinitive; more formal than pour. Common in writing and instructions.",
              "Afin de réduire l'attente, merci de préparer vos papiers.", "In order to reduce waiting times, please have your documents ready."],
          ],
        },
        {
          en: "Time & sequence",
          fr: "Le temps",
          desc: "First, then, as soon as, until.",
          cards: [
            ["D'abord, …", "First, … / First of all, …", "Starts a list of steps. More formal: tout d'abord.",
              "D'abord, on fait un café, et après, on discute.", "First we make a coffee, and then we talk."],
            ["Ensuite, …", "Then, … / Next, …", "The next step. Puis is a close synonym, a little more written.",
              "Ensuite, tu tournes à droite et c'est en face.", "Then you turn right and it's opposite."],
            ["Finalement, …", "In the end, … / Finally, …", "Also ‘after all’: finalement, je reste (actually, I'm staying). For the last step in a list: enfin.",
              "On hésitait entre deux hôtels. Finalement, on a pris le moins cher.", "We were torn between two hotels. In the end we took the cheaper one."],
            ["Dès que…", "As soon as…", "Takes the future for future events: dès que j'arriverai (as soon as I arrive).",
              "Je t'appelle dès que j'arrive à la gare.", "I'll call you as soon as I get to the station."],
            ["Pendant que…", "While…", "Two things at the same time. For a contrast, use alors que.",
              "Pendant que tu cuisines, je mets la table.", "While you cook, I'll lay the table."],
            ["Avant de…", "Before…", "+ infinitive when the subject is the same: avant de partir. Otherwise avant que + subjunctive.",
              "Lave-toi les mains avant de manger.", "Wash your hands before you eat."],
            ["Une fois que…", "Once…", "When one thing is done, the next can happen.",
              "Une fois que tu as fini, tu peux sortir.", "Once you've finished, you can go out."],
            ["Jusqu'à…", "Until… / Up to…", "Time or place: jusqu'à lundi, jusqu'à la gare. Jusqu'à ce que + subjunctive.",
              "Le magasin est ouvert jusqu'à vingt heures.", "The shop's open until eight."],
            ["Depuis…", "For… / Since…", "With the present for something still going on: j'habite ici depuis dix ans (I've lived here for ten years).",
              "J'apprends le français depuis deux ans.", "I've been learning French for two years."],
            ["À l'époque, …", "Back then, … / At the time, …", "Sets a story in the past. Also à cette époque-là.",
              "À l'époque, on n'avait pas de téléphone portable.", "Back then, we didn't have mobile phones."],
            ["D'un coup, …", "Suddenly, … / All at once, …", "Also tout à coup, tout d'un coup. Casual: d'un coup, le courant a sauté.",
              "On regardait la télé et, d'un coup, tout s'est éteint.", "We were watching TV and suddenly everything went off."],
          ],
        },
        {
          en: "Conditions",
          fr: "La condition",
          desc: "If, unless, in case, otherwise.",
          cards: [
            ["Si jamais…", "If by any chance… / If ever…", "A less likely if. Same tenses as si: si jamais tu le vois, dis-lui bonjour.",
              "Si jamais tu as besoin de quelque chose, appelle-moi.", "If you ever need anything, call me."],
            ["Au cas où…", "In case…", "Takes the conditional: au cas où il pleuvrait. On its own: (just) in case: prends un pull, au cas où.",
              "Prends un parapluie, au cas où.", "Take an umbrella, just in case."],
            ["À moins que…", "Unless…", "Takes the subjunctive, often with a ne that isn't negative: à moins qu'il ne pleuve. Spoken: sauf si + indicative.",
              "On mangera dehors, à moins qu'il fasse trop froid.", "We'll eat outside, unless it's too cold."],
            ["Tant que…", "As long as…", "Condition or duration: tant que tu es là, tant qu'il fait beau.",
              "Tant que tu es là, tu peux m'aider ?", "While you're here, can you help me?"],
            ["Sinon, …", "Otherwise, … / Or else, …", "The consequence if not. In speech, also ‘apart from that’: sinon, ça va ?",
              "Dépêche-toi, sinon on va rater le train.", "Hurry up, or we'll miss the train."],
            ["Dans ce cas, …", "In that case, …", "Draws a consequence from what was just said.",
              "— Il n'y a plus de place. — Dans ce cas, on reviendra demain.", "— There's no room left. — In that case, we'll come back tomorrow."],
          ],
        },
        {
          en: "Summing up",
          fr: "Conclure",
          desc: "In short, basically, for example.",
          cards: [
            ["Bref, …", "Anyway, … / In short, …", "Cuts a story short and gets to the point. Also, in speech, enfin bref…",
              "Bref, on s'est perdus, mais on a fini par arriver.", "Anyway, we got lost, but we got there in the end."],
            ["En gros, …", "Basically, … / Roughly, …", "Sums up roughly, without detail. Casual.",
              "En gros, il faut tout refaire.", "Basically, we have to redo everything."],
            ["Donc voilà.", "So yeah. / So there you go.", "Ends an explanation in speech. Also ben voilà.",
              "J'ai changé de boulot, j'ai déménagé… donc voilà.", "I changed jobs, I moved… so yeah."],
            ["Par exemple, …", "For example, …", "Also comme (like) before a list: des fruits comme les pommes.",
              "Il y a plein de choses à voir, par exemple le musée d'Orsay.", "There's loads to see, for example the Musée d'Orsay."],
            ["Apparemment, …", "Apparently, …", "Passes on what you've heard without vouching for it. Also à ce qu'il paraît.",
              "Apparemment, le restaurant a changé de propriétaire.", "Apparently the restaurant has changed hands."],
            ["Surtout, …", "Above all, … / Especially, …", "Stresses the most important point. As an order: surtout, ne dis rien ! (whatever you do, don't say anything!)",
              "Prends des vêtements chauds, et surtout, n'oublie pas ton passeport.", "Take warm clothes, and above all, don't forget your passport."],
          ],
        },
      ];
    </script>
