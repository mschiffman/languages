    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 24.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/apology/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Saying sorry",
          fr: "S'excuser",
          desc: "The everyday apologies, from bumping into someone to forgetting a message.",
          cards: [
            ["Désolé(e).", "Sorry.", "The all-purpose apology. Stronger with an adverb: vraiment désolé(e). Adds what for with de or pour: désolé pour hier.",
              "Oh, désolée, je ne t'avais pas vu !", "Oh, sorry, I hadn't seen you!"],
            ["Pardon !", "Sorry! / Excuse me!", "Quick and reflexive: when you bump into someone, interrupt, or step on a foot. Also how you ask someone to repeat: pardon ?",
              "Pardon ! Je vous ai fait mal ?", "Sorry! Did I hurt you?"],
            ["Excuse-moi.", "Excuse me. / I'm sorry.", "Polite and always safe. Formal or plural: excusez-moi. Often followed by the reason: excuse-moi pour tout à l'heure.",
              "Excuse-moi, je t'ai coupé la parole.", "Sorry, I cut you off."],
            ["Je m'excuse.", "I apologise.", "Very common in speech. Purists object that you can't excuse yourself, so in careful French prefer excusez-moi or je vous prie de m'excuser.",
              "Je m'excuse pour le bruit hier soir.", "I apologise for the noise last night."],
          ],
        },
        {
          en: "A sincere apology",
          fr: "S'excuser sincèrement",
          desc: "When it matters: admitting fault and meaning it.",
          cards: [
            ["Je suis vraiment désolé(e).", "I'm really sorry.", "Désolé(e) with real weight. More formal: je suis sincèrement désolé(e).",
              "Je suis vraiment désolé, j'ai complètement oublié ton anniversaire.", "I'm really sorry, I completely forgot your birthday."],
            ["Je suis navré(e).", "I'm terribly sorry.", "More heartfelt and a little formal: customer service, condolences, bad news. Also used for polite refusals: je suis navrée, c'est complet.",
              "Je suis navrée, votre commande n'est pas encore arrivée.", "I'm terribly sorry, your order hasn't arrived yet."],
            ["Je te demande pardon.", "I'm so sorry. / Please forgive me.", "Literally ‘I ask you for forgiveness’: for something serious or personal. Formal: je vous demande pardon. Said with indignation, it means ‘I beg your pardon?!’",
              "Je te demande pardon, je n'aurais jamais dû dire ça.", "Please forgive me, I should never have said that."],
            ["C'est (de) ma faute.", "It's my fault.", "Both forms are used; c'est ma faute is the more common in speech. To say it's not yours: c'est pas de ma faute !",
              "On a raté le train, c'est ma faute, je me suis réveillé trop tard.", "We missed the train, it's my fault, I woke up too late."],
            ["Je m'en veux.", "I feel terrible about it.", "Literally ‘I hold it against myself’: guilt, not just politeness. To someone else: je ne t'en veux pas (I don't hold it against you).",
              "Je m'en veux de ne pas t'avoir appelé plus tôt.", "I feel terrible for not calling you sooner."],
            ["Je ne l'ai pas fait exprès.", "I didn't mean to.", "Exprès means on purpose. Spoken: je l'ai pas fait exprès. Children's version: c'est pas exprès !",
              "Pardon pour ton vase, je ne l'ai pas fait exprès.", "Sorry about your vase, I didn't mean to."],
            ["Ça ne se reproduira pas.", "It won't happen again.", "The promise that goes with a serious apology, at work or at home. Spoken: ça se reproduira pas.",
              "Je suis désolé pour ce retard. Ça ne se reproduira pas.", "I'm sorry for being late. It won't happen again."],
          ],
        },
        {
          en: "Getting attention or getting by",
          fr: "Attirer l'attention",
          desc: "‘Excuse me’ to strangers: asking, squeezing past, calling a waiter.",
          cards: [
            ["Excusez-moi, vous avez l'heure ?", "Excuse me, do you have the time?", "Excusez-moi is the polite way to approach a stranger. Start with bonjour if you're asking for something longer: bonjour, excusez-moi, je cherche la gare.",
              "Excusez-moi, vous savez où se trouve la pharmacie ?", "Excuse me, do you know where the chemist's is?"],
            ["Pardon, je peux passer ?", "Sorry, can I get through?", "For crowded trains, cinema rows and supermarket aisles. Shorter: pardon, pardon… as you squeeze by.",
              "Pardon, je peux passer ? Je descends au prochain arrêt.", "Sorry, can I get past? I'm getting off at the next stop."],
            ["S'il vous plaît !", "Excuse me!", "Calls a waiter or shop assistant over. Never garçon !, which sounds rude and dated.",
              "S'il vous plaît ! On pourrait avoir l'addition ?", "Excuse me! Could we have the bill?"],
          ],
        },
        {
          en: "Sorry for the trouble",
          fr: "Désolé de…",
          desc: "Apologising in advance, or for the wait, the delay or the late reply.",
          cards: [
            ["Désolé(e) de te déranger.", "Sorry to bother you.", "The polite opener before a request. Formal: désolé de vous déranger. Also: je ne vous dérange pas ?",
              "Désolée de te déranger, mais tu aurais un chargeur ?", "Sorry to bother you, but would you have a charger?"],
            ["Désolé(e) du retard.", "Sorry I'm late.", "Also désolé(e) pour le retard. A real excuse often follows: il y avait des bouchons.",
              "Désolé du retard, le métro était bloqué.", "Sorry I'm late, the metro was stuck."],
            ["Désolé(e) pour l'attente.", "Sorry for the wait.", "What staff say after keeping you waiting. Formal: merci de votre patience (thank you for your patience).",
              "Désolée pour l'attente, je suis à vous tout de suite.", "Sorry for the wait, I'll be right with you."],
            ["Désolé(e) de répondre si tard.", "Sorry for the late reply.", "The opener for a message you've left too long. Shorter: désolé(e) pour le retard.",
              "Désolé de répondre si tard, j'étais en vacances.", "Sorry for the late reply, I was on holiday."],
            ["Toutes mes excuses.", "My apologies.", "Formal and polished: emails, work, customer service. Very formal writing: veuillez nous excuser pour la gêne occasionnée.",
              "Toutes mes excuses, je me suis trompé de salle.", "My apologies, I went to the wrong room."],
          ],
        },
        {
          en: "Accepting an apology",
          fr: "Accepter des excuses",
          desc: "Letting someone off the hook, kindly.",
          cards: [
            ["Y a pas de mal.", "No harm done.", "Spoken form of il n'y a pas de mal. A warm way to wave off a small apology.",
              "— Oh pardon, je vous ai bousculé ! — Y a pas de mal.", "— Oh sorry, I bumped into you! — No harm done."],
            ["Ce n'est pas de ta faute.", "It's not your fault.", "Spoken: c'est pas de ta faute. Formal: ce n'est pas de votre faute.",
              "Ce n'est pas de ta faute, il pleuvait, personne n'aurait pu prévoir l'accident.", "It's not your fault, it was raining, nobody could have seen the accident coming."],
            ["Ça arrive.", "It happens.", "Puts the mistake down to bad luck. Also ça arrive à tout le monde (it happens to everyone).",
              "— J'ai oublié notre rendez-vous, je suis désolée. — Ça arrive, on remet ça à demain ?", "— I forgot our appointment, I'm so sorry. — It happens, shall we do it tomorrow?"],
            ["C'est oublié.", "It's forgotten.", "Closes the matter for good after a real apology. Same idea: on n'en parle plus (let's not mention it again).",
              "— Je te demande pardon pour l'autre soir. — C'est oublié.", "— I'm so sorry about the other night. — It's forgotten."],
            ["Je ne t'en veux pas.", "I'm not angry with you.", "En vouloir à quelqu'un: to hold something against them. Spoken: je t'en veux pas.",
              "Je ne t'en veux pas, mais la prochaine fois, préviens-moi.", "I'm not angry with you, but next time, let me know."],
          ],
        },
      ];
    </script>
