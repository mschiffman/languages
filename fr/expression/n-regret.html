    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 16.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/regret/";
      const AUD_EXT = "mp3?v=2610231958";

      const categories = [
        {
          en: "Too bad",
          fr: "Dommage",
          desc: "Small disappointments, shrugged off or lamented.",
          cards: [
            ["Tant pis.", "Oh well. / Never mind.", "Accepts a setback and moves on. Its opposite is tant mieux (so much the better).",
              "Le magasin est fermé ? Tant pis, on reviendra demain.", "The shop's closed? Oh well, we'll come back tomorrow."],
            ["Dommage.", "Too bad. / Shame.", "Short and light. Fuller: c'est dommage (more sympathetic); que + subjunctive: dommage que tu ne puisses pas venir.",
              "— Je ne peux pas venir samedi. — Dommage, on aurait bien rigolé.", "— I can't come on Saturday. — Shame, it would have been a laugh."],
            ["Quel dommage !", "What a pity!", "More expressive and emotional than dommage. Also c'est vraiment dommage.",
              "Il a raté son train et il a manqué le mariage ? Quel dommage !", "He missed his train and the wedding? What a pity!"],
            ["Tant mieux pour toi.", "Good for you.", "Sincere or slightly ironic, depending on tone. On its own, tant mieux ! means ‘great, so much the better!’",
              "Tu pars aux Maldives ? Tant mieux pour toi…", "You're off to the Maldives? Good for you…"],
          ],
        },
        {
          en: "Bad luck",
          fr: "La malchance",
          desc: "Commiserating when luck runs out.",
          cards: [
            ["Pas de chance.", "Tough luck. / Bad luck.", "Neutral sympathy for a mishap. Also c'est pas de chance.",
              "Ton vol est annulé ? Pas de chance.", "Your flight's cancelled? Bad luck."],
            ["C'est pas de bol.", "That's bad luck.", "Familiar slang: le bol means luck here. Same idea: c'est pas de pot.",
              "Il pleut le seul jour où tu es libre ? C'est pas de bol.", "It rains on the one day you're free? That's bad luck."],
            ["Manque de bol !", "Just my luck! / Unlucky!", "Very informal. Often in a story, just before the bad part: manque de bol, il pleuvait.",
              "J'arrive à la gare et, manque de bol, le train venait de partir.", "I get to the station and, just my luck, the train had just left."],
          ],
        },
        {
          en: "Resignation",
          fr: "Se résigner",
          desc: "Accepting what can't be changed.",
          cards: [
            ["C'est la vie.", "That's life.", "Philosophical acceptance. French people say it too, though not as often as English speakers imagine.",
              "On n'a pas eu l'appartement. Bah, c'est la vie.", "We didn't get the flat. Oh well, that's life."],
            ["C'est comme ça.", "That's how it is.", "Accepts a situation, or closes a discussion: no arguing. Also c'est comme ça et pas autrement.",
              "Les magasins ferment le dimanche ici, c'est comme ça.", "The shops close on Sundays here, that's just how it is."],
            ["On ne peut pas tout avoir.", "You can't have everything.", "Spoken: on peut pas tout avoir. A shrug at a trade-off.",
              "La maison est super, mais loin de tout. On ne peut pas tout avoir.", "The house is great, but miles from anywhere. You can't have everything."],
          ],
        },
        {
          en: "Regretting",
          fr: "Regretter",
          desc: "Wishing you'd done things differently.",
          cards: [
            ["Je regrette.", "I regret it. / I'm sorry.", "Regret for something you did. Also a polite no: je regrette, c'est complet (I'm sorry, we're full).",
              "Je regrette de ne pas avoir appris le piano.", "I regret not learning the piano."],
            ["J'aurais dû…", "I should have…", "Past conditional of devoir + infinitive. The opposite: je n'aurais pas dû (I shouldn't have).",
              "J'aurais dû partir plus tôt, maintenant je suis coincé dans les bouchons.", "I should have left earlier, now I'm stuck in traffic."],
            ["Si seulement…", "If only…", "+ imperfect for now (si seulement il faisait beau), + pluperfect for the past (si seulement j'avais su).",
              "Si seulement j'avais su, je ne l'aurais jamais acheté.", "If only I'd known, I'd never have bought it."],
            ["J'aurais préféré que non.", "I'd rather it hadn't happened.", "Mild regret about something that happened. Also j'aurais préféré + infinitive: j'aurais préféré rester.",
              "— Il a tout raconté à ta mère ? — Oui… j'aurais préféré que non.", "— He told your mum everything? — Yes… I'd rather he hadn't."],
            ["Je suis désolé(e) pour toi.", "I'm sorry for you.", "Sympathy for someone's misfortune, not an apology. Formal: je suis désolé(e) pour vous.",
              "Ton chien est mort ? Je suis vraiment désolée pour toi.", "Your dog died? I'm so sorry."],
            ["C'est triste.", "That's sad.", "Simple sympathy. Stronger: c'est vraiment triste, c'est trop triste.",
              "Ils ferment la librairie du quartier ? C'est triste.", "They're closing the local bookshop? That's sad."],
          ],
        },
      ];
    </script>
