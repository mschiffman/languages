    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 20.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/voila/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Ta-da!",
          fr: "Présenter un résultat",
          desc: "Showing off something you've just finished.",
          cards: [
            ["Et voilà !", "There we go! / Ta-da!", "Presents a result with a flourish. Pronounced vwala, never ‘wala’.",
              "Et voilà ! Ton vélo est réparé.", "There we go! Your bike's fixed."],
            ["Voilà, c'est fait.", "There, done.", "Plain and satisfied: the job's finished. Also c'est bon (all set), the everyday one.",
              "Voilà, c'est fait, j'ai envoyé le dossier.", "There, done, I've sent off the file."],
            ["Et voilà le travail !", "And that's how it's done!", "Colloquial, with a little note of pride.",
              "Et voilà le travail ! La cuisine est comme neuve.", "And that's how it's done! The kitchen's as good as new."],
            ["Et hop !", "Hey presto! / And up it goes!", "Goes with a quick, deft action: lifting, throwing, flipping.",
              "Et hop, la crêpe est retournée !", "Hey presto, the pancake's flipped!"],
            ["Terminé !", "Done! / Finished!", "Announces the end of a task. Also fini !",
              "Terminé ! On peut aller manger ?", "Done! Can we go and eat?"],
          ],
        },
        {
          en: "One off the list",
          fr: "Une bonne chose de faite",
          desc: "The relief of ticking something off.",
          cards: [
            ["Une bonne chose de faite !", "That's one thing done!", "Relief at finishing a chore you'd been putting off.",
              "J'ai enfin rempli ma déclaration d'impôts. Une bonne chose de faite !", "I've finally done my tax return. That's one thing done!"],
            ["Un truc de moins.", "One less thing to worry about.", "Casual: un truc = a thing. Also ça de moins (that's one less).",
              "Les billets sont réservés, un truc de moins.", "The tickets are booked, one less thing to worry about."],
            ["Encore une de réglée !", "Another one sorted!", "Régler: to settle, to sort out. Une stands for a problem, une affaire, une question.",
              "La voiture est réparée. Encore une de réglée !", "The car's fixed. Another one sorted!"],
          ],
        },
        {
          en: "How about that?",
          fr: "Attendre une réaction",
          desc: "Fishing for praise after showing your work.",
          cards: [
            ["Qu'est-ce que t'en dis ?", "What do you say to that?", "The closest to ‘how about that?’ Spoken form of qu'est-ce que tu en dis ? Formal: qu'en dites-vous ?",
              "J'ai repeint le salon. Qu'est-ce que t'en dis ?", "I've repainted the living room. What do you reckon?"],
            ["Pas mal, hein ?", "Not bad, eh?", "Modest bragging. Also pas mal, non ?",
              "Je l'ai fait moi-même, ce gâteau. Pas mal, hein ?", "I made this cake myself. Not bad, eh?"],
            ["Alors ?", "Well?", "Invites the verdict. Drawn out — alors ? — it shows impatience.",
              "Tu as goûté ma sauce ? Alors ?", "You've tasted my sauce? Well?"],
            ["C'est pas beau, ça ?", "Isn't that lovely?", "Showing off, very satisfied. Full form: ce n'est pas beau, ça ?",
              "Un ciel bleu et la mer à nos pieds. C'est pas beau, ça ?", "A blue sky and the sea at our feet. Isn't that lovely?"],
            ["Avoue !", "Admit it!", "Playful: you want them to concede. Often avoue que… : avoue que c'est bon !",
              "Avoue que c'est meilleur que chez ta mère !", "Admit it's better than your mum's!"],
          ],
        },
        {
          en: "The other jobs of voilà",
          fr: "Les autres sens de voilà",
          desc: "Handing over, agreeing, finding someone, wrapping up.",
          cards: [
            ["Et voilà pour vous.", "Here you go.", "Handing something over: change, a coffee, a receipt. Casual: voilà !",
              "Un café et un croissant, et voilà pour vous.", "A coffee and a croissant, here you go."],
            ["Voilà !", "Exactly! / That's it!", "Agreement: that's exactly what I meant. Also voilà, c'est ça.",
              "— Donc il faut tout recommencer ? — Voilà !", "— So we have to start all over again? — Exactly!"],
            ["Ah, te voilà !", "Ah, there you are!", "When someone you've been waiting for or looking for appears. Formal or plural: vous voilà !",
              "Ah, te voilà ! On te cherchait partout.", "Ah, there you are! We were looking for you everywhere."],
            ["Voilà, c'est tout.", "That's all.", "Rounds off an explanation or a speech.",
              "On part à huit heures et on rentre dimanche. Voilà, c'est tout.", "We leave at eight and come back on Sunday. That's all."],
            ["Et voilà, quoi.", "So… yeah. That's it.", "Trailing off at the end of a story. Quoi adds a shrug.",
              "Bref, on s'est disputés, il est parti, et voilà, quoi.", "Anyway, we argued, he left, and… yeah."],
            ["Voilà pourquoi…", "That's why…", "Points back to what you've just said as the reason. Also c'est pour ça que…",
              "Il pleuvait. Voilà pourquoi je suis en retard.", "It was raining. That's why I'm late."],
            ["Voilà deux ans que…", "It's been two years since… / For two years now…", "Voilà + time + que: how long something has been going on. Same as ça fait… que.",
              "Voilà deux ans que j'habite à Lyon.", "I've been living in Lyon for two years now."],
          ],
        },
      ];
    </script>
