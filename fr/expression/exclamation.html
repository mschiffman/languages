<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link href="/img/favicon.png" rel="icon" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/pimsleur.css" />
  </head>
  <body class="min-h-screen bg-grid relative">
    <!-- Background decorative blobs -->
    <div
      class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0"
    >
      <div
        class="absolute top-[-80px] left-[-80px] w-96 h-96 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.18) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute bottom-[-60px] right-[-60px] w-80 h-80 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(0, 200, 255, 0.14) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute top-1/2 right-1/4 w-64 h-64 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.08) 0%,
            transparent 70%
          );
        "
      ></div>
    </div>

    <div class="relative z-10 w-full px-6 py-12">
      <!-- Header -->
      <div class="text-center mb-14">
        <div class="flex items-center justify-center gap-4 mb-3">
          <span class="badge">EXPRESSIONS</span>
          <span class="badge">EXCLAMATIONS</span>
        </div>
        <h1
          class="text-7xl font-bold tracking-tight mb-2 header-glow"
          style="
            font-family: &quot;Playfair Display&quot;, serif;
            font-style: italic;
            color: white;
            letter-spacing: -0.02em;
          "
        >
          Exclamations
        </h1>
        <p
          class="text-2xl mb-4"
          style="
            color: var(--cyan);
            opacity: 0.85;
            font-family: &quot;Playfair Display&quot;, serif;
          "
        >
          Exclamations courantes
        </p>
        <div class="header-line w-64 mx-auto"></div>
        <p
          class="mt-4 text-sm tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.4);
            font-family: &quot;Roboto&quot;, sans-serif;
          "
        >
          Expression Flashcards
        </p>
      </div>

      <!-- Cards are rendered from `categories` below by expression-flash.js -->
      <div id="cards"></div>

      <!-- Footer -->
      <div class="mt-14 text-center">
        <div class="header-line w-48 mx-auto mb-5"></div>
        <p
          class="text-xs tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.25);
            font-family: &quot;Space Mono&quot;, monospace;
          "
        >
          <span id="count">30</span> expressions · Exclamations · Bonne chance&#8239;!
        </p>
      </div>
    </div>

    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 30.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, exFR, exEN, exFR, exEN, ...]
     note is "" when the phrase needs no explanation; those cards get
     two examples instead.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/exclamation/";
      const AUD_EXT = "mp3?v=261011";

      const categories = [
        {
          en: "Mild exasperation",
          fr: "Agacement léger",
          desc: "The “Jeez!” moments: a small frustration, nothing serious.",
          cards: [
            ["Purée !", "Jeez! / Darn!", "A softened stand-in for a much ruder word. Very common, and fine among friends and family.",
              "Purée, j'ai raté mon train !", "Jeez, I missed my train!"],
            ["Punaise !", "Darn! / Jeez!", "Another softened swear, just as mild as purée.",
              "Punaise, j'ai oublié mes clés !", "Darn, I forgot my keys!"],
            ["Mince !", "Gosh! / Drat!", "Gentle frustration, quieter than the others.",
              "Mince, encore en retard…", "Gosh, late again…"],
            ["Oh là là !", "Oh dear! / Wow!", "A Swiss-army knife: surprise, dismay or amazement. The tone does the work.",
              "Oh là là, il y a du monde.", "Wow, there are a lot of people."],
          ],
        },
        {
          en: "Surprise & amazement",
          fr: "Ça alors !",
          desc: "Surprise, from pleasant to properly shocked.",
          cards: [
            ["Ça alors !", "Well I'll be! / No way!", "Pleasant or shocked surprise.",
              "Ça alors ! Tu es déjà là ?", "Well I'll be! You're already here?"],
            ["Ben dis donc !", "Wow, would you look at that!", "Colloquial and friendly. Bah dis donc works too.",
              "Ben dis donc ! Tu as changé de coiffure !", "Wow! You changed your hairstyle!"],
            ["Eh ben !", "Well then!", "Light surprise, or a hint of disbelief depending on tone.",
              "Eh ben ! Tu as fini tout le gâteau ?", "Well! You finished the whole cake?"],
            ["Waouh !", "Wow!", "The modern wow. Also spelled Wouah or Waou.",
              "Waouh, c'est joli, j'adore !", "Wow, that's pretty, I love it!"],
          ],
        },
        {
          en: "Annoyance & “Come on!”",
          fr: "Non mais !",
          desc: "From mild scolding to setting a boundary.",
          cards: [
            ["Non mais !", "Oh, come on! / Seriously?!", "Mild scolding. Often the start of an indignant rant.",
              "Non mais, t'as vu le prix ?", "Come on, did you see the price?"],
            ["Ça suffit !", "That's enough!", "Clear boundary-setting, and still polite.",
              "Ça suffit, arrêtez de vous disputer !", "That's enough, stop arguing!"],
            ["Zut !", "Darn!", "Old-school and harmless.",
              "Zut ! Le magasin est fermé.", "Darn! The store is closed."],
            ["Bon sang !", "Good grief! / For goodness' sake!", "Colorful but not rude.",
              "Bon sang, j'en étais sûre !", "Good grief, I knew it!"],
          ],
        },
        {
          en: "Pleasant surprise & admiration",
          fr: "Trop bien !",
          desc: "Delight, enthusiasm and things going well.",
          cards: [
            ["Trop bien !", "So good! / Awesome!", "Very casual and current.",
              "Trop bien, tu l'as trouvé.", "Awesome! You found it!"],
            ["Génial !", "Great! / Brilliant!", "Warm and widely used.",
              "Génial ! J'ai eu le poste !", "Awesome! I got the job!"],
            ["Super !", "Great! / Brilliant!", "Very natural in everyday speech.",
              "Super ! Tu viens avec nous !", "Great! You're coming with us."],
            ["Extra !", "Terrific! / Great!", "Delight or enthusiasm. A little dated now; génial and super are more common.",
              "Extra ! C'est exactement ce que je voulais.", "Terrific! That's exactly what I wanted."],
            ["Nickel !", "Perfect! / All set!", "Everything is in order or just right. Said when a job is done well or a plan works.",
              "— Voilà, c'est réparé. — Nickel, merci !", "— There, it's fixed. — Perfect, thanks!"],
            ["Youpi !", "Yippee! / Hooray!", "Childlike joy. Adults use it playfully, or ironically.",
              "Youpi ! C'est les vacances !", "Yay! It's vacation time!"],
          ],
        },
        {
          en: "Relief & gratitude",
          fr: "Dieu merci !",
          desc: "Relief after tension, or a narrow escape.",
          cards: [
            ["Dieu merci !", "Thank God!", "Classic expression of relief or gratitude.",
              "Dieu merci, tout s'est bien passé !", "Thank God, everything went well!"],
            ["Merci mon Dieu !", "Thank God! / Thank heavens!", "Stronger and more emotional than dieu merci.",
              "Merci mon Dieu ! Tout le monde va bien.", "Thank God! Everyone's okay."],
            ["Ouf !", "Phew!", "Relief after tension or a narrow escape.",
              "Ouf, j'ai cru qu'on allait le rater !", "Phew, I thought we were going to miss it."],
            ["Enfin !", "Finally!", "Relief that something is over or solved.",
              "Enfin, c'est terminé !", "Finally, it's done!"],
            ["On l'a échappé belle !", "That was close!", "Literally ‘we escaped it beautifully’. For avoiding trouble or danger.",
              "On l'a échappé belle ! Un arbre est tombé juste derrière notre voiture.", "That was close! A tree fell right behind our car."],
          ],
        },
        {
          en: "Shock & horror",
          fr: "Mon Dieu !",
          desc: "Disbelief, distress and things that are appalling.",
          cards: [
            ["Mon Dieu !", "My God!", "Shock, disbelief or distress.",
              "Mon Dieu, qu'est-ce qui s'est passé ?", "My God, what happened?"],
            ["Oh mon Dieu !", "Oh my God!", "The same tone as English ‘OMG’. Very common in speech.",
              "Oh mon Dieu, qu'est-ce que j'ai fait ?", "Oh my God, what have I done?"],
            ["C'est pas vrai !", "No way! / It can't be true!", "Very common for shock or disbelief.",
              "C'est pas vrai ! Il a gagné !", "No way! He won!"],
            ["Quelle horreur !", "How awful! / What a horror!", "For something tragic, disgusting or appalling.",
              "Quelle horreur, le pauvre !", "How awful, poor guy!"],
            ["Incroyable !", "Unbelievable!", "Amazement or shock, depending on tone.",
              "Incroyable ! Personne ne l'a vu venir.", "Unbelievable! Nobody saw it coming."],
          ],
        },
        {
          en: "Old-fashioned but cute",
          fr: "Sapristi !",
          desc: "Playfully old-timey. Fun in writing or when joking around.",
          cards: [
            ["Sapristi !", "Goodness me!", "Playfully old-timey.",
              "Sapristi, j'ai oublié le gâteau !", "Goodness me, I forgot the cake!"],
            ["Fichtre !", "My word! / Gosh!", "Old-fashioned astonishment, now mostly used for comic effect.",
              "Fichtre, quelle belle voiture !", "Gosh, what a beautiful car!"],
          ],
        },
      ];
    </script>
    <script src="../../assets/js/expression-flash.js"></script>
    <script src="../../assets/js/nav-expression-flash.js"></script>
  </body>
</html>
