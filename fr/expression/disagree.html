    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 20.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, example FR, example EN]
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/disagree/";
      const AUD_EXT = "mp3?v=261023";

      const categories = [
        {
          en: "Polite disagreement",
          fr: "Nuancer",
          desc: "Softening a no so the discussion stays friendly.",
          cards: [
            ["Je ne suis pas tout à fait d'accord.", "I don't quite agree.", "Leaves room for discussion: you agree in part. Spoken: je suis pas tout à fait d'accord.",
              "Je ne suis pas tout à fait d'accord avec toi sur ce point.", "I don't quite agree with you on that point."],
            ["Je vois ce que tu veux dire, mais…", "I see what you mean, but…", "Acknowledges their point before you push back. Formal: je vois ce que vous voulez dire, mais…",
              "Je vois ce que tu veux dire, mais c'est trop cher pour nous.", "I see what you mean, but it's too expensive for us."],
            ["Je ne dirais pas ça.", "I wouldn't say that.", "A gentle correction in the conditional. Spoken: je dirais pas ça.",
              "— Ce resto est nul. — Je ne dirais pas ça, les desserts sont bons.", "— This restaurant is rubbish. — I wouldn't say that, the desserts are good."],
            ["Ça se discute.", "That's debatable.", "Literally ‘that can be discussed’: you're not convinced, but you're not fighting about it.",
              "— Paris est la plus belle ville du monde. — Ça se discute.", "— Paris is the most beautiful city in the world. — That's debatable."],
            ["Avec tout le respect que je te dois, …", "With all due respect, …", "Formal opener before a firm disagreement, often with a boss or an elder. Formal: que je vous dois.",
              "Avec tout le respect que je vous dois, ce plan ne marchera pas.", "With all due respect, this plan won't work."],
          ],
        },
        {
          en: "Mild disagreement",
          fr: "Exprimer un désaccord",
          desc: "Everyday ways to say ‘not really’ or ‘I don't think so’.",
          cards: [
            ["Oui, mais…", "Yes, but…", "Grants the point, then adds the objection. Very common in arguments: oui, mais quand même… (yes, but still…)",
              "— On sera plus tranquilles à la campagne. — Oui, mais il n'y a pas de travail.", "— We'll have more peace in the country. — Yes, but there's no work."],
            ["Je comprends, mais…", "I understand, but…", "Shows empathy first, then holds your ground. Good at work and with family.",
              "Je comprends, mais on ne peut pas tout annuler maintenant.", "I understand, but we can't cancel everything now."],
            ["Pas vraiment.", "Not really.", "A mild no to a question or a claim. Also pas trop.",
              "— Tu as aimé le film ? — Pas vraiment.", "— Did you like the film? — Not really."],
            ["Pas exactement.", "Not exactly.", "Corrects a detail without contradicting the whole. Same idea: pas tout à fait (not quite).",
              "— Donc tu as quitté ton travail ? — Pas exactement, je suis en congé.", "— So you've left your job? — Not exactly, I'm on leave."],
            ["Je ne pense pas.", "I don't think so.", "Neutral. Spoken: je pense pas. Same idea: je ne crois pas.",
              "— Il va pleuvoir demain ? — Je ne pense pas.", "— Is it going to rain tomorrow? — I don't think so."],
            ["Je ne suis pas de ton avis.", "I don't see it that way.", "Literally ‘I'm not of your opinion’. Straightforward but polite. Formal: je ne suis pas de votre avis.",
              "Je ne suis pas de ton avis, je trouve qu'elle a bien fait.", "I don't see it that way, I think she did the right thing."],
          ],
        },
        {
          en: "Firm disagreement",
          fr: "Contredire",
          desc: "Saying plainly that someone is wrong.",
          cards: [
            ["Je ne suis pas d'accord.", "I disagree.", "Clear and polite. Spoken: je suis pas d'accord. Stronger: je ne suis pas du tout d'accord.",
              "Je ne suis pas d'accord, c'est toi qui as commencé.", "I disagree, you're the one who started it."],
            ["Tu te trompes.", "You're wrong.", "Se tromper: to be mistaken. Direct; with friends. Formal: vous vous trompez. Gentler: je crois que tu te trompes.",
              "Tu te trompes, le magasin ferme à dix-neuf heures, pas à vingt.", "You're wrong, the shop closes at seven, not eight."],
            ["Pas du tout !", "Not at all!", "A clear, emphatic no. Also as a reply to an accusation: — Tu es fâché ? — Pas du tout !",
              "— C'était ton idée ! — Pas du tout, c'était la tienne !", "— It was your idea! — Not at all, it was yours!"],
            ["C'est faux.", "That's not true. / That's wrong.", "Factual disagreement: the claim is wrong. Spoken: c'est pas vrai (also used for disbelief).",
              "C'est faux, je n'ai jamais dit ça.", "That's not true, I never said that."],
            ["Ça n'a rien à voir.", "That's got nothing to do with it.", "Rejects an argument as irrelevant. Spoken: ça a rien à voir.",
              "— Il est en retard parce qu'il est jeune. — Ça n'a rien à voir.", "— He's late because he's young. — That's got nothing to do with it."],
            ["Là, je ne te suis pas.", "I'm not with you there.", "Suivre: to follow. You go along with them up to this point, but no further.",
              "Jusque-là, d'accord, mais là, je ne te suis pas.", "Up to there, fine, but here I'm not with you."],
          ],
        },
        {
          en: "Agreeing to disagree",
          fr: "Clore le débat",
          desc: "Ending an argument that's going nowhere.",
          cards: [
            ["On n'est pas d'accord, c'est tout.", "We just don't agree, that's all.", "Accepts the disagreement and moves on. Note the n' of on n'est, often unheard in speech.",
              "Bon, on n'est pas d'accord, c'est tout. On change de sujet ?", "Right, we just don't agree. Shall we change the subject?"],
            ["Chacun son avis.", "Each to their own.", "Everyone's entitled to an opinion. Also chacun ses goûts (each to their own taste).",
              "Moi, je n'aime pas le jazz, mais chacun son avis.", "Personally I don't like jazz, but each to their own."],
            ["On ne va pas se disputer pour ça.", "Let's not fight over it.", "Se disputer: to argue. Defuses a minor quarrel. Spoken: on va pas se disputer pour ça.",
              "Allez, on ne va pas se disputer pour une place de parking.", "Come on, let's not fight over a parking space."],
          ],
        },
      ];
    </script>
