    <div class="relative z-10 w-full px-6 py-12">

        <h1

            color: white;

        <p
          class="text-2xl mb-4"
          style="
            color: var(--cyan);
            opacity: 0.85;
            font-family: &quot;Playfair Display&quot;, serif;

          Donner son avis
        </p>
        <div class="header-line w-64 mx-auto"></div>
        <p
          class="mt-4 text-sm tracking-widest uppercase"

      <!-- Cards are rendered from `categories` below by expression-flash.js -->

      <!-- Footer -->
      <div class="mt-14 text-center">
        <div class="header-line w-48 mx-auto mb-5"></div>
        <p

          style="
            color: rgba(255, 255, 255, 0.25);
            font-family: &quot;Space Mono&quot;, monospace;
          "
        >
          <span id="count">24</span> expressions · Opinion · Bonne chance&#8239;!
        </p>
      </div>

    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : 01.mp3 … 24.mp3 in AUD_DIR (one per card, in reading order)
   categories -> cards: [French, English, note, exFR, exEN, exFR, exEN, ...]
     note is "" when the phrase needs no explanation; those cards get
     two examples instead.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/lessons/Expressions/opinion/";
      const AUD_EXT = "mp3?v=261011";

      const categories = [
        {
          en: "Everyday openers",
          fr: "À mon avis",
          desc: "The neutral frame for putting your own view on the table.",
          cards: [
            ["À mon avis, …", "In my opinion, …", "The safe spoken default. Never à mon opinion or dans mon opinion.",
              "À mon avis, c'est trop tôt pour en parler.", "In my opinion, it's too early to talk about it."],
            ["Je trouve que…", "I think… / I find…", "How something strikes you: taste, or an impression from experience. Also je trouve ça + adjective: je trouve ça nul.",
              "Je trouve que ce film est un peu long.", "I think this film is a bit long."],
            ["Je pense que…", "I think that…", "A view you've reasoned your way to. In the negative it takes the subjunctive: je ne pense pas qu'il soit là.",
              "Je pense qu'on devrait réserver à l'avance.", "I think we should book ahead."],
            ["Je crois que…", "I believe… / I think…", "A shade less certain than je pense que; also for facts you're not sure of.",
              "Je crois que le musée ferme à six heures.", "I think the museum closes at six."],
            ["Pour moi, …", "For me, … / As I see it, …", "",
              "Pour moi, c'est une erreur.", "As I see it, it's a mistake.",
              "Pour moi, le meilleur resto du quartier, c'est celui-là.", "For me, the best restaurant in the area is that one."],
            ["Personnellement, …", "Personally, …", "Stresses that this is your view, which others may not share. Often with moi: moi, personnellement…",
              "Personnellement, je préfère rester à la maison ce soir.", "Personally, I'd rather stay home tonight."],
          ],
        },
        {
          en: "More formal",
          fr: "Selon moi",
          desc: "For essays, debates, meetings and careful speech.",
          cards: [
            ["Selon moi, …", "In my view, …", "A notch above à mon avis; common in writing. With someone else it means ‘according to’: selon Marie.",
              "Selon moi, cette réforme ne règle pas le vrai problème.", "In my view, this reform doesn't fix the real problem."],
            ["D'après moi, …", "From my point of view, …", "A little more spoken than selon moi. D'après also cites sources: d'après la météo, il va pleuvoir.",
              "D'après moi, il ne viendra pas.", "If you ask me, he won't come."],
            ["À mon sens, …", "To my mind, …", "Elegant and slightly literary; at home in writing and careful speech.",
              "À mon sens, c'est la meilleure solution.", "To my mind, it's the best solution."],
            ["De mon point de vue, …", "From where I stand, …", "Frames your view as one perspective among several. Useful when you know others see it differently.",
              "De mon point de vue, le projet est trop risqué.", "From where I stand, the project is too risky."],
            ["J'estime que…", "I consider that… / I feel that…", "Formal and measured: you've weighed things up. Common in meetings and letters.",
              "J'estime que nous avons fait le maximum.", "I feel we've done everything we could."],
          ],
        },
        {
          en: "Hedging",
          fr: "J'ai l'impression",
          desc: "Softening your view when you're not sure, or don't want to sound too blunt.",
          cards: [
            ["Il me semble que…", "It seems to me that…", "Already hedged. Takes the indicative, unlike il semble que, which takes the subjunctive.",
              "Il me semble que c'était mardi, pas mercredi.", "I think it was Tuesday, not Wednesday."],
            ["J'ai l'impression que…", "I get the feeling that…", "Based on a hunch rather than evidence. J'ai le sentiment que is a touch more emotional.",
              "J'ai l'impression que ça ne va pas marcher.", "I get the feeling it's not going to work."],
            ["Je dirais que…", "I'd say…", "The conditional softens the claim. Also good for estimates: je dirais une vingtaine.",
              "Je dirais que c'est plutôt réussi.", "I'd say it turned out fairly well."],
            ["Je ne suis pas sûr(e), mais…", "I'm not sure, but…", "Admits doubt up front before giving your view anyway. Spoken: chais pas, mais…",
              "Je ne suis pas sûre, mais je crois qu'il a déménagé.", "I'm not sure, but I think he's moved."],
          ],
        },
        {
          en: "Candid & convinced",
          fr: "Franchement",
          desc: "Saying what you really think, and standing by it.",
          cards: [
            ["Si tu veux mon avis, …", "If you want my opinion, …", "Often the lead-in to something the listener won't like. Formal: si vous voulez mon avis.",
              "Si tu veux mon avis, tu devrais refuser.", "If you ask me, you should turn it down."],
            ["Franchement, …", "Honestly, … / Frankly, …", "",
              "Franchement, c'était nul.", "Honestly, it was rubbish.",
              "Franchement, je ne m'attendais pas à ce que ce soit aussi bien.", "Honestly, I didn't expect it to be that good."],
            ["Je suis convaincu(e) que…", "I'm convinced that…", "No doubt in your mind. Je suis persuadé(e) que works the same way.",
              "Je suis convaincue que c'est la bonne décision.", "I'm convinced it's the right decision."],
            ["Ça ne fait aucun doute.", "There's no doubt about it.", "Spoken without the ne: ça fait aucun doute. Often after pour moi.",
              "— Tu crois qu'elle va réussir ? — Pour moi, ça ne fait aucun doute.", "— Do you think she'll pass? — I have no doubt about it."],
          ],
        },
        {
          en: "Asking for an opinion",
          fr: "Et toi ?",
          desc: "Handing the floor to the other person.",
          cards: [
            ["Qu'est-ce que tu en penses ?", "What do you think (of it)?", "The standard question; en means ‘of it’. Formal: qu'en pensez-vous ?",
              "J'ai fini mon CV. Qu'est-ce que tu en penses ?", "I've finished my CV. What do you think?"],
            ["Tu en penses quoi ?", "What do you think?", "Casual word order, with the question word at the end. Spoken: t'en penses quoi ?",
              "— T'en penses quoi, de cette veste ? — Elle te va super bien.", "— What do you think of this jacket? — It really suits you."],
            ["Ça te paraît comment ?", "How does it look to you?", "Asks for a first impression rather than a considered verdict.",
              "J'ai changé le début. Ça te paraît comment ?", "I've changed the opening. How does it look to you?"],
            ["Quel est ton avis ?", "What's your opinion?", "Direct and a little more formal. Vous form: quel est votre avis ? Often followed by sur: sur la question.",
              "Quel est votre avis sur la question ?", "What's your view on the matter?"],
            ["Et toi ?", "And you? / What about you?", "",
              "Moi, je trouve ça trop cher. Et toi ?", "I think it's too expensive. What about you?",
              "— Je vote pour le premier. Et vous ? — Pareil.", "— I'm voting for the first one. What about you? — Same."],
          ],
        },
      ];
    </script>
