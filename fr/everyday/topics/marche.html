<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Un marché en plein air</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CHXHM9CZKM");
    </script>

    <!-- Favicons -->
    <link href="/img/favicon.png" rel="icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/assets/js/topic.js"></script>

    <link rel="stylesheet" href="/assets/css/topic.css" />
  </head>
  <body>
    <div class="container py-4">
      <a href="../../index.html" target="_blank" class="btn btn-secondary mb-3"
        >Site Map</a
      >
      <button id="openAudio" type="button" class="btn btn-audio mb-3 ms-2">
        🔊 Audio Player
      </button>
      <div
        class="note-wrapper mb-3 ms-2"
        data-note="C’est un marché en plein air très animé. Plusieurs marchands vendent des fruits, des légumes, du pain, du fromage, de la viande et du poisson sur leurs étals. Les clients se promènent entre les stands, regardent les produits et discutent avec les vendeurs. Certains portent un panier ou un sac pendant qu’ils font leurs courses."
      >
        <button id="noteBtn" type="button" class="btn btn-note" title="Transcript">
          📝 Transcript
        </button>
      </div>

      <div id="audioPlayerWindow">
        <div id="audioPlayerHeader">
          <span>🎵 Audio Player</span>
          <button id="closeAudio" type="button">&times;</button>
        </div>
        <div id="audioPlayerControls">
          <button id="playBtn" title="Play" type="button">&#9658;</button>
          <button id="pauseBtn" title="Pause" type="button">
            &#10074;&#10074;
          </button>
          <button id="stopBtn" title="Stop" type="button">&#9632;</button>
        </div>
        <div id="progressContainer">
          <input
            type="range"
            id="progressBar"
            min="0"
            max="100"
            step="0.1"
            value="0"
            class="form-range"
          />
        </div>
        <audio id="audioElement"></audio>
      </div>

      <div class="mx-auto" style="max-width: 900px">
        <img
          src="/img/everyday/market.jpg"
          alt=""
          class="img-fluid mb-4 rounded d-block mx-auto"
        />
      </div>

      <div id="content">Loading marché...</div>
    </div>

    <script>
      initTopicPage("marche");
    </script>
  </body>
</html>
