<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famille</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CHXHM9CZKM");
    </script>

    <!-- Favicons -->
    <link href="/img/favicon.png" rel="icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/assets/js/topic.js"></script>

    <link rel="stylesheet" href="/assets/css/topic.css" />
  </head>
  <body>
    <div class="container py-4">
      <a
        href="../../index.html"
        target="_blank"
        class="btn btn-secondary mb-3"
        >Site Map</a
      >
      <button id="openAudio" type="button" class="btn btn-audio mb-3 ms-2">
        🔊 Audio Player
      </button>
      <div
        class="note-wrapper mb-3 ms-2"
        data-note="C’est une photo de famille très chaleureuse. Les parents sont assis avec leurs enfants et leurs grands-parents autour d’eux. Chaque membre de la famille sourit et profite du moment ensemble. On sent une ambiance joyeuse et pleine d’amour entre les générations."
      >
        <button id="noteBtn" type="button" class="btn btn-note" title="Transcript">
          📝 Transcript
        </button>
      </div>

      <div id="audioPlayerWindow">
        <div id="audioPlayerHeader">
          <span>🎵 Audio Player</span>
          <button id="closeAudio" type="button">&times;</button>
        </div>
        <div id="audioPlayerControls">
          <button id="playBtn" title="Play" type="button">&#9658;</button>
          <button id="pauseBtn" title="Pause" type="button">
            &#10074;&#10074;
          </button>
          <button id="stopBtn" title="Stop" type="button">&#9632;</button>
        </div>
        <div id="progressContainer">
          <input
            type="range"
            id="progressBar"
            min="0"
            max="100"
            step="0.1"
            value="0"
            class="form-range"
          />
        </div>
        <audio id="audioElement"></audio>
      </div>

      <div class="mx-auto" style="max-width: 700px">
        <img
          src="/img/everyday/famille.jpg"
          alt=""
          class="img-fluid mb-4 rounded d-block mx-auto"
        />
      </div>

      <div id="content">Loading famille...</div>
    </div>

    <script>
      initTopicPage("famille");
    </script>
  </body>
</html>
