<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Conversation 43: Quiz</title>
    <!-- Stand-alone conversation quiz: Alpine.js, and the recordings are all inside this
         file, so it opens by double-click with no internet. Built by
         build_convquiz.py from template.html + the conversation's questions. -->
    <style>

    </style>
    <style>
      :root {
        --paper: #f5f2ea;
        --paper-edge: #e6e0d2;
        --forest: #1f2f4a;
        --forest-soft: #3b5278;
        --leaf: #7ea3d8;
        --leaf-tint: #e3ecf8;
        --gold: #f6b93b;
        --gold-deep: #e39b12;
        --right: #3f8a43;
        --right-tint: #e1f1d8;
        --wrong: #e2876a;
        --wrong-tint: #fbe9df;
        --miss: #a5552a;
      }
      [x-cloak] { display: none !important; }
      * { box-sizing: border-box; }
      html { background: var(--paper-edge); }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        color: var(--forest);
        background: radial-gradient(120% 80% at 50% 0%, #fbfaf5 0%, var(--paper) 55%, var(--paper-edge) 100%) no-repeat;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px 24px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .listen {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font: inherit;
        font-weight: 700;
        font-size: 1.15rem;
        color: #fff;
        background: var(--forest-soft);
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 1.3rem 0.55rem 0.9rem;
        min-height: 3rem;
        cursor: pointer;
      }
      .listen:hover, .listen:focus-visible { background: var(--forest); }
      .listen svg { width: 1.4em; height: 1.4em; }
      .back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin-top: 0.7rem;
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--forest-soft);
        text-decoration: none;
        border-radius: 999px;
        padding: 0.2rem 0.7rem 0.2rem 0.4rem;
        min-height: 2rem;
      }
      .back:hover, .back:focus-visible { background: var(--paper-edge); color: var(--forest); }
      .back svg { width: 1.1em; height: 1.1em; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.8rem 0 0.5rem;
      }
      .brand {
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(1rem, 4.4vw, 1.35rem);
        line-height: 1.15;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }
      .brand svg { width: 1.2em; height: 1.2em; flex: 0 0 auto; }
      .tag {
        font-size: 0.8em;
        background: var(--gold);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
      }
      .counter {
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        color: var(--forest-soft);
        background: var(--paper);
        border: 2px solid var(--paper-edge);
        border-radius: 999px;
        padding: 0.25rem 0.8rem;
        white-space: nowrap;
      }
      .progress {
        display: flex;
        gap: 4px;
        margin: 0.2rem 0 1rem;
      }
      .progress span {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--paper-edge);
      }
      .progress span.ok { background: var(--right); }
      .progress span.no { background: var(--wrong); }
      .progress span.now { background: var(--gold); }

      main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.9rem; }
      .kind {
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--forest-soft);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .q {
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(1.3rem, 5.4vw, 1.75rem);
        line-height: 1.3;
        margin: 0;
      }
      .say {
        font-size: clamp(1.3rem, 5.4vw, 1.75rem);
        font-weight: 700;
        background: #fff;
        border: 3px dashed var(--leaf);
        border-radius: 18px;
        padding: 0.6rem 1rem;
        margin: 0;
        line-height: 1.35;
      }
      .blank {
        display: inline-block;
        min-width: 4.5em;
        border-bottom: 4px solid var(--forest);
        text-align: center;
        padding: 0 0.2em;
      }
      .blank.ok { color: var(--right); border-color: var(--right); }
      .art {
        margin: 0;
        border-radius: 18px;
        overflow: hidden;
        border: 3px solid var(--forest);
        background: #fff;
        max-height: 38vh;
        display: flex;
        justify-content: center;
      }
      .art img { width: 100%; max-height: 38vh; object-fit: contain; display: block; }

      button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:disabled { cursor: default; }
      button:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
      .opts { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
      .opts.two { grid-template-columns: 1fr 1fr; }
      .opt {
        min-height: 58px;
        padding: 0.5rem 0.9rem;
        border: 3px solid var(--forest);
        border-radius: 18px;
        background: #fff;
        font-weight: 700;
        font-size: clamp(1.1rem, 4.6vw, 1.35rem);
        line-height: 1.25;
        text-align: left;
        box-shadow: 0 4px 0 var(--paper-edge);
        transition: background 0.15s, border-color 0.15s, opacity 0.2s, transform 0.1s;
      }
      .opts.two .opt { text-align: center; }
      .opt:not(:disabled):hover { background: #fffaf0; }
      .opt:not(:disabled):active { transform: translateY(2px); }
      .opt.right { background: var(--right-tint); border-color: var(--right); box-shadow: none; }
      .opt.wrong { background: var(--wrong-tint); border-color: var(--wrong); color: var(--miss); text-decoration: line-through; box-shadow: none; }
      .opt.dim { opacity: 0.45; box-shadow: none; }
      .opt .mark { float: right; text-decoration: none; }

      .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .pic {
        padding: 0;
        border: 4px solid var(--forest);
        border-radius: 18px;
        background: #fff;
        overflow: hidden;
        position: relative;
        aspect-ratio: 16 / 10;
        transition: border-color 0.15s, opacity 0.2s, transform 0.1s;
      }
      .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .pic.contain img { object-fit: contain; }
      .pic:not(:disabled):active { transform: translateY(2px); }
      .pic.right { border-color: var(--right); box-shadow: 0 0 0 4px var(--right-tint); }
      .pic.wrong { border-color: var(--wrong); box-shadow: 0 0 0 4px var(--wrong-tint); }
      .pic.dim { opacity: 0.4; }
      .pic .mark {
        position: absolute; top: 6px; right: 6px;
        width: 2rem; height: 2rem; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 1.2rem; color: #fff;
      }
      .pic.right .mark { background: var(--right); }
      .pic.wrong .mark { background: var(--wrong); }

      /* order: tap the cards in the right order */
      .placed { display: flex; flex-direction: column; gap: 0.45rem; }
      .slot {
        min-height: 52px;
        border: 3px dashed var(--leaf);
        border-radius: 16px;
        padding: 0.45rem 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        font-size: clamp(1.05rem, 4.4vw, 1.25rem);
        background: rgba(255, 255, 255, 0.5);
      }
      .slot.filled { border-style: solid; border-color: var(--right); background: var(--right-tint); }
      .slot .n {
        flex: 0 0 auto;
        width: 1.8rem; height: 1.8rem; border-radius: 50%;
        background: var(--forest); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif; font-size: 1rem;
      }
      .chip-dot { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2px solid rgba(0,0,0,0.25); flex: 0 0 auto; }
      .opt.chip { display: flex; align-items: center; gap: 0.6rem; }
      .shake { animation: shake 0.4s; }
      @keyframes shake {
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      .feedback {
        border-radius: 16px;
        padding: 0.7rem 1rem;
        font-size: clamp(1.05rem, 4.4vw, 1.2rem);
        line-height: 1.4;
      }
      .feedback.ok { background: var(--right-tint); border: 2px solid var(--right); }
      .feedback.no { background: var(--wrong-tint); border: 2px solid var(--wrong); }
      .feedback b { font-family: "Segoe UI", Montserrat, system-ui, sans-serif; font-weight: 600; font-size: 1.15em; }
      .feedback .story { display: block; margin-top: 0.3rem; font-style: italic; color: var(--forest-soft); }

      footer { display: flex; justify-content: center; padding-top: 1rem; }
      .big {
        min-width: 220px;
        height: 56px;
        border: none;
        border-radius: 999px;
        background: var(--gold);
        font-family: "Segoe UI", Montserrat, system-ui, sans-serif;
        font-weight: 600;
        font-size: 1.2rem;
        box-shadow: 0 5px 0 var(--gold-deep);
        padding: 0 1.5rem;
      }
      .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); }
      .big.soft { background: var(--leaf-tint); box-shadow: 0 5px 0 var(--leaf); }

      .results { display: flex; flex-direction: column; gap: 0.9rem; }
      .score-card { text-align: center; background: #fff; border: 2px solid var(--paper-edge); border-radius: 20px; padding: 0.9rem 1rem 1rem; }
      .stars { font-size: 2.6rem; letter-spacing: 0.2em; }
      .stars .off { filter: grayscale(1); opacity: 0.3; }
      .score { font-family: "Segoe UI", Montserrat, system-ui, sans-serif; font-weight: 700; font-size: 2.6rem; line-height: 1.1; margin: 0; }
      .pct { margin: 0.1rem 0 0.6rem; color: var(--forest-soft); font-size: 1.1rem; }
      .tally { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; }
      .tally .t { font-family: "Segoe UI", Montserrat, system-ui, sans-serif; font-weight: 600; border-radius: 999px; padding: 0.2rem 0.9rem; }
      .tally .t.ok { background: var(--right-tint); color: var(--right); }
      .tally .t.no { background: var(--wrong-tint); color: var(--miss); }
      .msg { margin: 0.7rem 0 0; font-size: 1.1rem; line-height: 1.35; }
      .panel { display: flex; flex-direction: column; gap: 0.5rem; }
      .panel h2 { font-family: "Segoe UI", Montserrat, system-ui, sans-serif; font-size: 1.2rem; margin: 0.3rem 0 0; display: flex; align-items: center; gap: 0.5rem; }
      .panel .count { font-size: 0.95rem; min-width: 1.7rem; text-align: center; border-radius: 999px; padding: 0.05rem 0.5rem; background: var(--wrong); color: #fff; }
      .panel .count.ok { background: var(--right); }
      .rev { background: #fff; border-left: 6px solid var(--wrong); border-radius: 10px; padding: 0.55rem 0.8rem; line-height: 1.4; }
      .rights .rev { border-left-color: var(--right); }
      .rev .ask { margin: 0 0 0.3rem; font-weight: 700; }
      .rev .row { display: flex; gap: 0.6rem; align-items: baseline; }
      .rev .lbl { flex: 0 0 5.2rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--forest-soft); }
      .rights .rev .lbl { flex-basis: 1.2rem; font-size: 1.05rem; font-weight: 700; color: var(--right); }
      .rev .val { min-width: 0; overflow-wrap: anywhere; }
      .rev .yours .val { color: var(--miss); }
      .rev .correct .val { color: var(--right); font-weight: 700; }
      .rev img { display: block; width: 7rem; border-radius: 8px; margin: 0.15rem 0; border: 2px solid currentColor; }
      footer.end { flex-direction: column; align-items: center; gap: 0.9rem; }

      @media (min-width: 560px) {
        .opts.wide2 { grid-template-columns: 1fr 1fr; }
      }
      @media print {
        body { background: #fff; }
        footer, .progress, .back { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage" x-data="storyQuiz()" x-cloak>
      <a class="back" href="conv43.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        Back to the conversation
      </a>
      <header>
        <div class="brand">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" fill="#7EA3D8" stroke="#1F2F4A" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span>Conversation 43</span>
          <span class="tag" x-text="practice ? 'Practice' : 'Quiz'"></span>
        </div>
        <div class="counter" x-text="done ? (practice ? 'Practice done' : 'Results') : (i + 1) + ' / ' + qs.length"></div>
      </header>

      <div class="progress" aria-hidden="true">
        <template x-for="(r, k) in results" :key="k">
          <span :class="r === true ? 'ok' : r === false ? 'no' : (k === i && !done ? 'now' : '')"></span>
        </template>
      </div>

      <!-- ---------- one question ---------- -->
      <main x-show="!done">
        <div class="kind" x-text="kindLabel()"></div>

        <!-- question line (all types but fill / yesno) -->
        <p class="q" x-show="q.q" x-text="q.q"></p>

        <!-- a sentence from the story, said by someone -->
        <p class="say" x-show="q.say" x-text="q.say"></p>

        <!-- a phrase to listen to (recording embedded below) -->
        <button class="listen" type="button" x-show="q.audio" @click="play()">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <span x-text="heard ? 'Listen again' : 'Listen'"></span>
        </button>
        <audio x-ref="aud" preload="none"></audio>

        <!-- fill: sentence with a gap -->
        <p class="say" x-show="q.type === 'fill'">
          <span x-text="q.before"></span>
          <span class="blank" :class="answered && lastRight ? 'ok' : ''" x-text="answered ? q.answer : ' '"></span><span x-text="q.after"></span>
        </p>

        <!-- yes / no: a statement -->
        <p class="say" x-show="q.type === 'yesno'" x-text="q.statement"></p>

        <figure class="art" x-show="q.pic"><img :src="q.pic ? PICS[q.pic] : ''" alt="" /></figure>

        <!-- choose / fill / yesno: word or sentence buttons -->
        <div class="opts" :class="optClass()" x-show="['choose', 'fill', 'yesno'].includes(q.type)">
          <template x-for="(o, k) in opts" :key="i + '-' + k">
            <button class="opt" :disabled="answered" :class="optState(o)" @click="pick(o)">
              <span x-text="o"></span><span class="mark" x-text="markFor(o)"></span>
            </button>
          </template>
        </div>

        <!-- pics: tap the right picture -->
        <div class="pics" x-show="q.type === 'pics'">
          <template x-for="(o, k) in opts" :key="i + '-p' + k">
            <button class="pic" :class="[optState(o), (q.contain || []).includes(o) ? 'contain' : '']" :disabled="answered" @click="pick(o)" :aria-label="'Picture ' + (k + 1)">
              <img :src="PICS[o]" alt="" />
              <span class="mark" x-show="markFor(o)" x-text="markFor(o)"></span>
            </button>
          </template>
        </div>

        <!-- order: tap cards one by one -->
        <template x-if="q.type === 'order'">
          <div style="display: flex; flex-direction: column; gap: 0.9rem">
            <div class="placed">
              <template x-for="(item, k) in q.items" :key="i + '-s' + k">
                <div class="slot" :class="k < placed.length ? 'filled' : ''">
                  <span class="n" x-text="k + 1"></span>
                  <span class="chip-dot" x-show="k < placed.length && q.colors" :style="q.colors ? 'background:' + q.colors[placed[k]] : ''"></span>
                  <span x-text="k < placed.length ? placed[k] : ''"></span>
                </div>
              </template>
            </div>
            <div class="opts" :class="q.chips ? 'two' : 'wide2'">
              <template x-for="(o, k) in opts" :key="i + '-o' + k">
                <button class="opt" :class="[q.colors ? 'chip' : '', shaking === o ? 'shake wrong' : '']" x-show="!placed.includes(o)" :disabled="answered" @click="tapOrder(o)">
                  <span class="chip-dot" x-show="q.colors" :style="q.colors ? 'background:' + q.colors[o] : ''"></span>
                  <span x-text="o"></span>
                </button>
              </template>
            </div>
          </div>
        </template>

        <!-- instant feedback -->
        <div class="feedback" :class="lastRight ? 'ok' : 'no'" x-show="answered" aria-live="polite">
          <b x-text="lastRight ? cheer : (q.type === 'order' ? 'All done!' : 'Not quite.')"></b>
          <span x-show="!lastRight && q.type !== 'order'"> The answer is <strong x-text="answerText()"></strong><span x-text="/[.!?]$/.test(answerText()) ? '' : '.'"></span></span>
          <span x-show="q.type === 'order' && !lastRight" x-text="' ' + mistakes + (mistakes === 1 ? ' mistake' : ' mistakes') + ' on the way. Next time, try with none!'"></span>
          <span class="story" x-show="q.note" x-text="q.note"></span>
        </div>

        <footer>
          <button class="big" x-show="answered" @click="next()" x-text="i + 1 < qs.length ? 'Next →' : 'See my score'"></button>
        </footer>
      </main>

      <!-- ---------- results: score, wrong answers next to the right ones, right answers ---------- -->
      <section class="results" x-show="done" aria-live="polite">
        <div class="score-card">
          <div class="stars" aria-hidden="true">
            <template x-for="s in 3" :key="s"><span :class="s <= stars() ? '' : 'off'">&#11088;</span></template>
          </div>
          <p class="score" x-text="score() + ' / ' + qs.length"></p>
          <p class="pct"><b x-text="pct() + '%'"></b> correct</p>
          <div class="tally">
            <span class="t ok" x-text="score() + ' correct'"></span>
            <span class="t no" x-text="redo().length + ' wrong'"></span>
          </div>
          <p class="msg" x-text="message()"></p>
        </div>

        <section class="panel wrongs" x-show="redo().length">
          <h2>Wrong answers <span class="count" x-text="redo().length"></span></h2>
          <template x-for="(m, k) in review(false)" :key="'w' + k">
            <div class="rev">
              <p class="ask" x-text="m.ask"></p>
              <div class="row yours">
                <span class="lbl" x-text="m.lbl"></span>
                <span class="val">
                  <img x-show="m.yoursPic" :src="m.yoursPic" alt="" />
                  <s x-show="m.strike" x-text="m.yours"></s>
                  <span x-show="!m.strike" x-text="m.yours"></span>
                </span>
              </div>
              <div class="row correct">
                <span class="lbl">Correct</span>
                <span class="val">
                  <img x-show="m.answerPic" :src="m.answerPic" alt="" />
                  <span x-text="m.answer"></span>
                </span>
              </div>
            </div>
          </template>
        </section>

        <section class="panel rights" x-show="score()">
          <h2>Right answers <span class="count ok" x-text="score()"></span></h2>
          <template x-for="(m, k) in review(true)" :key="'r' + k">
            <div class="rev">
              <p class="ask" x-text="m.ask"></p>
              <div class="row correct">
                <span class="lbl">&#10003;</span>
                <span class="val">
                  <img x-show="m.answerPic" :src="m.answerPic" alt="" />
                  <span x-text="m.answer"></span>
                </span>
              </div>
            </div>
          </template>
        </section>

        <footer class="end">
          <button class="big" @click="redo().length ? startRound(redo(), true) : startRound(all, false)" x-text="redo().length ? 'Practice these (' + redo().length + ')' : 'Play again'"></button>
          <button class="big soft" x-show="redo().length" @click="startRound(all, false)">&#8635; Start again</button>
        </footer>
      </section>
    </div>

    <script>
      /* ---------------- the story's pictures (small JPEGs, base64) ---------------- */
      const PICS = {};

      function shuffle(a) {
        a = a.slice();
        for (let k = a.length - 1; k > 0; k--) {
          const j = Math.floor(Math.random() * (k + 1));
          [a[k], a[j]] = [a[j], a[k]];
        }
        return a;
      }

      const YES_NO = ["True", "False"];
      const CHEERS = ["Bravo !", "Très bien !", "Exactement !", "Parfait !", "C'est ça !"];

      function storyQuiz() {
        return {
          all: QUESTIONS,
          qs: QUESTIONS, // this round: every question, or only the missed ones (practice)
          practice: false,
          picked: [], // what was chosen for each question of the round
          i: 0,
          q: QUESTIONS[0],
          opts: [],
          answered: false,
          lastRight: false,
          chosen: null,
          cheer: "",
          placed: [],
          mistakes: 0,
          shaking: null,
          heard: false,
          results: QUESTIONS.map(() => null),
          done: false,

          init() {
            this.load();
          },
          load() {
            this.q = this.qs[this.i];
            this.answered = false;
            this.chosen = null;
            this.placed = [];
            this.mistakes = 0;
            this.shaking = null;
            this.heard = false;
            if (this.$refs.aud) this.$refs.aud.pause();
            const q = this.q;
            if (q.type === "yesno") this.opts = YES_NO.slice();
            else if (q.type === "order") {
              let o = shuffle(q.items);
              while (q.items.length > 1 && o.every((x, k) => x === q.items[k])) o = shuffle(q.items);
              this.opts = o;
            } else this.opts = q.keep ? q.options.slice() : shuffle(q.options);
            window.scrollTo(0, 0);
          },
          play() {
            const a = this.$refs.aud;
            if (a.getAttribute("src") !== AUDIO[this.q.audio]) a.src = AUDIO[this.q.audio];
            a.currentTime = 0;
            a.play();
            this.heard = true;
          },
          rightOpt() {
            const q = this.q;
            if (q.type === "yesno") return YES_NO[q.answer ? 0 : 1];
            return q.answer;
          },
          pick(o) {
            if (this.answered) return;
            this.chosen = o;
            this.finish(o === this.rightOpt());
          },
          tapOrder(o) {
            if (this.answered) return;
            const want = this.q.items[this.placed.length];
            if (o === want) {
              this.placed.push(o);
              if (this.placed.length === this.q.items.length) this.finish(this.mistakes === 0);
            } else {
              this.mistakes++;
              this.shaking = null;
              this.$nextTick(() => {
                this.shaking = o;
                setTimeout(() => {
                  if (this.shaking === o) this.shaking = null;
                }, 450);
              });
            }
          },
          finish(ok) {
            this.lastRight = ok;
            this.cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
            this.results[this.i] = ok;
            this.picked[this.i] = this.q.type === "order" ? this.mistakes : this.chosen;
            this.answered = true;
          },
          next() {
            if (this.i + 1 < this.qs.length) {
              this.i++;
              this.load();
            } else {
              this.done = true;
              window.scrollTo(0, 0);
            }
          },
          startRound(list, isPractice) {
            this.qs = list;
            this.practice = isPractice;
            this.results = list.map(() => null);
            this.picked = [];
            this.i = 0;
            this.done = false;
            this.load();
          },
          optState(o) {
            if (!this.answered) return "";
            if (o === this.rightOpt()) return "right";
            if (o === this.chosen) return "wrong";
            return "dim";
          },
          markFor(o) {
            if (!this.answered) return "";
            if (o === this.rightOpt()) return "✓";
            if (o === this.chosen) return "✗";
            return "";
          },
          optClass() {
            if (this.q.type === "yesno") return "two";
            if (this.q.type === "fill" || this.q.short) return "two";
            return "";
          },
          kindLabel() {
            return {
              choose: this.q.audio ? "Listen and choose" : "Choose the answer",
              fill: "Fill the gap",
              yesno: "True or false?",
              pics: "Tap the picture",
              order: "Build the sentence",
            }[this.q.type];
          },
          answerText() {
            const q = this.q;
            if (q.type === "yesno") return YES_NO[q.answer ? 0 : 1];
            if (q.type === "pics") return "the green picture";
            return q.answer;
          },
          score() {
            return this.results.filter((r) => r === true).length;
          },
          stars() {
            const p = this.score() / this.qs.length;
            return p >= 0.9 ? 3 : p >= 0.6 ? 2 : 1;
          },
          message() {
            if (this.practice) return this.redo().length ? "Keep going. Practice the ones below once more." : "You got them all this time!";
            const s = this.stars();
            return s === 3 ? "Excellent ! You know this conversation very well." : s === 2 ? "Good work. Listen to the conversation again and try once more." : "Good try. Go through the conversation again, then come back.";
          },
          pct() {
            return Math.round((100 * this.score()) / this.qs.length);
          },
          /* the questions answered wrong in this round, for "Practice these" */
          redo() {
            return this.qs.filter((q, k) => this.results[k] === false);
          },
          /* rows for the results page: review(false) = wrong answers, review(true) = right answers */
          review(ok) {
            return this.qs
              .map((q, k) => ({ q, r: this.results[k], mine: this.picked[k] }))
              .filter((x) => x.r === ok)
              .map(({ q, mine }) => {
                const isPic = q.type === "pics";
                const isOrder = q.type === "order";
                return {
                  ask:
                    q.type === "fill" ? q.before + " ___" + (/^[.,!?]/.test(q.after) ? "" : " ") + q.after
                    : q.type === "yesno" ? q.statement
                    : (q.q || "") + (q.say || q.said ? " “" + (q.say || q.said) + "”" : ""),
                  lbl: isOrder ? "Your try" : "You chose",
                  strike: !isOrder && !isPic,
                  yours: isPic ? "" : isOrder ? mine + (mine === 1 ? " mistake" : " mistakes") + " on the way" : mine,
                  yoursPic: isPic && !ok ? PICS[mine] : null,
                  answer:
                    q.type === "yesno" ? YES_NO[q.answer ? 0 : 1]
                    : isOrder ? q.items.join(" → ")
                    : isPic ? q.review || ""
                    : q.answer,
                  answerPic: isPic ? PICS[q.answer] : null,
                };
              });
          },
        };
      }
