<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Dictation - 10 Levels</title>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-CHXHM9CZKM");
    </script>
    <link href="/img/favicon.png" rel="icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .dictation-card {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        max-width: 600px;
        width: 100%;
      }
      h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 10px;
      }
      .level-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
      }
      .level-btn {
        background: white;
        border: 1px solid #dcdcdc;
        padding: 5px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        color: #7f8c8d;
        transition: all 0.2s;
      }
      .level-btn:hover {
        background: #ecf0f1;
        color: #2c3e50;
      }
      .level-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .level-indicator {
        font-weight: bold;
        color: #3498db;
        text-transform: uppercase;
        font-size: 0.9rem;
      }
      .audio-controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
      }
      .btn-audio {
        background: #e1f5fe;
        color: #0288d1;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-audio:hover {
        background: #b3e5fc;
        transform: scale(1.05);
      }
      .btn-slow {
        background: #fff3e0;
        color: #f57c00;
      }
      .btn-slow:hover {
        background: #ffe0b2;
      }
      .btn-hint {
        background: #f3e5f5;
        color: #8e24aa;
      }
      .btn-hint:hover {
        background: #e1bee7;
      }
      #player {
        display: none;
      }
      .hint-box {
        display: none;
        margin: -10px 0 20px;
        padding: 12px 15px;
        border-radius: 8px;
        background: #f3e5f5;
        color: #6a1b9a;
        font-style: italic;
        text-align: center;
      }
      .hint-box.visible {
        display: block;
      }
      textarea {
        width: 100%;
        height: 80px;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1.1rem;
        font-family: "Segoe UI", sans-serif;
        resize: none;
        box-sizing: border-box;
        transition: border-color 0.3s;
      }
      textarea:focus {
        outline: none;
        border-color: #3498db;
      }
      .feedback-area {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        background: #fafafa;
        border: 1px dashed #ccc;
        min-height: 40px;
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .diff-correct {
        color: #27ae60;
        font-weight: bold;
      }
      .diff-missing {
        color: #c0392b;
        text-decoration: line-through;
        opacity: 0.6;
        margin-right: 5px;
      }
      .diff-added {
        color: #2980b9;
        text-decoration: underline;
        font-weight: bold;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      button.action-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-check {
        background: #2ecc71;
        color: white;
      }
      .btn-check:hover {
        background: #27ae60;
      }
      .btn-reveal {
        background: #f39c12;
        color: white;
      }
      .btn-reset {
        background: #95a5a6;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="dictation-card">
      <h2>🎧 Listening Lab</h2>
      <div class="level-bar">
        <button class="level-btn" id="prev-btn" onclick="changeLevel(-1)">
          ◀ Prev
        </button>
        <span class="level-indicator" id="level-display">Level 1 / 10</span>
        <button class="level-btn" id="next-btn" onclick="changeLevel(1)">
          Next ▶
        </button>
      </div>
      <div class="audio-controls">
        <button class="btn-audio" onclick="playAudio('m')">
          <span>👨</span> Male
        </button>
        <button class="btn-audio btn-slow" onclick="playAudio('f')">
          <span>👩</span> Female
        </button>
        <button class="btn-audio btn-hint" onclick="toggleHint()">
          <span>💡</span> Hint
        </button>
      </div>
      <audio id="player"></audio>
      <div class="hint-box" id="hint-box"></div>
      <textarea id="user-input" placeholder="Type what you hear..."></textarea>
      <div id="feedback" class="feedback-area">
        <span style="color: #aaa; font-style: italic"
          >Feedback will appear here...</span
        >
      </div>
      <div class="controls">
        <button class="action-btn btn-check" onclick="checkDictation()">
          Check
        </button>
        <button class="action-btn btn-reset" onclick="resetDictation()">
          Reset
        </button>
        <button class="action-btn btn-reveal" onclick="revealAnswer()">
          Reveal
        </button>
      </div>
    </div>

    <script>
      const sentences = [
        "Qu'est-ce qu'il a dit ?",
        "Mais on aura toujours besoin de manipulateurs radio.",
        "De toute façon, y en a que tu pourras pas mettre à Penang.",
        "Elle te va pas.",
        "D'accord.",
        "Ok.",
        "Et puis 20 à 30 % les jours suivants.",
        "C'est trop tôt.",
        "Trop chaud.",
        "Peut-être lundi.",
        "Je pense t'acheter une douzaine de chemises hawaïennes.",
        "Pas les mêmes goûts.",
        "Débarrasse-t'en.",
        "Peut-être, mais ça te protégera des piqûres d'insectes.",
        "Qu'est-ce qu'elle a ?",
        "et sors tout ce que t'aimes pas.",
        "Les nuages arrivent.",
        "et tu es beau dedans.",
        "Non.",
        "C'est justement ce que j'allais te demander.",
        "Hé, regarde.",
        "On peut les donner.",
        "On va en Californie de toute façon avant de quitter le pays.",
        "Ça va mieux.",
        "Mon cou, je veux le faire soigner avant de quitter le pays.",
        "Faut les acheter en Californie.",
        "Le manipulateur radio disait que s'il était radiologue, il gagnerait beaucoup plus.",
        "Il a dit : \"Mais on aura toujours besoin d'une supervision humaine.",
        "Fais le tri dans mes chemises",
        "Je vais garder des vêtements chauds pour l'Europe.",
        "Il va pleuvoir ?",
        "Falls Lake pourra remonter son niveau d'eau.",
        "Le jean, ça sera trop chaud à Penang ?",
        "Elles te tiennent au frais",
        "On verra ce qu'il dit.",
        "Il faudra peut-être faire une IRM.",
        "Je lui ai dit qu'au train où vont les choses, le radiologue se fera peut-être remplacer par des IA dans quelques années.",
        "J'en ai tellement.",
        "Au lieu de dix radiologues, on en aura peut-être besoin d'un seul.\"",
        "Ouais, je remarque ça.",
        "On verra bien.",
        "Ah, ils ont pas encore mis mes résultats de radio en ligne.",
        "Mais il y a 90 % de chances de pluie dimanche.",
        "Bonne idée.",
        "T'as toujours la tête qui tourne ?",
        "C'est vrai.",
        "Toi, tu peux pas porter de trucs lourds à cause de ton dos.",
        "Ce serait super.",
        "La radio montrera pas les tissus mous.",
        "Ils en vendent pas ici.",
        "Notre médecin nous recommandera peut-être un bon chirurgien orthopédique.",
        "J'aime pas ta chemise.",
        "C'est couvert dehors.",
        "Faut qu'au moins l'un de nous soit en forme pour gérer les valises quand on voyage.",
        "Pourquoi ?",
      ];

      const translations = [
        "What did he say?",
        "But we'll always need radiology technicians.",
        "Anyway, there are some you won't be able to wear in Penang.",
        "It doesn't suit you.",
        "Okay.",
        "Okay.",
        "And then 20 to 30% over the following days.",
        "It's too early.",
        "Too hot.",
        "Maybe Monday.",
        "I'm thinking of buying you a dozen Hawaiian shirts.",
        "Different tastes.",
        "Get rid of it.",
        "Maybe, but it'll protect you from insect bites.",
        "What's wrong with it?",
        "and pull out everything you don't like.",
        "The clouds are coming in.",
        "and you look handsome in them.",
        "No.",
        "That's actually what I was going to ask you.",
        "Hey, look.",
        "We can donate them.",
        "We're going to California anyway before we leave the country.",
        "It's getting better.",
        "My neck, I want to get it treated before we leave the country.",
        "We have to buy them in California.",
        "The radiology technician was saying that if he were a radiologist, he'd earn a lot more.",
        "He said: \"We'll always need human supervision.",
        "Go through my shirts",
        "I'm going to keep some warm clothes for Europe.",
        "Is it going to rain?",
        "Falls Lake could get its water level back up.",
        "Will jeans be too hot in Penang?",
        "They keep you cool",
        "We'll see what he says.",
        "We might need to get an MRI.",
        "I told him that the way things are going, radiologists might get replaced by AIs in a few years.",
        "I have so many.",
        "Instead of ten radiologists, we might only need one.\"",
        "Yeah, I've noticed that.",
        "We'll see.",
        "Oh, they still haven't put my X-ray results online.",
        "But there's a 90% chance of rain on Sunday.",
        "Good idea.",
        "Is your head still spinning?",
        "True.",
        "As for you, you can't carry heavy things because of your back.",
        "That would be great.",
        "The X-ray won't show the soft tissue.",
        "They don't sell them here.",
        "Our doctor might recommend a good orthopedic surgeon.",
        "I don't like your shirt.",
        "It's overcast outside.",
        "At least one of us needs to be in shape to handle the suitcases when we travel.",
        "Why?",
      ];

      let currentIndex = 0;
      const audioBase =
        "https://languages.rmlives.com/lessons/everyday/conv40/listen/";

      function changeLevel(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= sentences.length)
          currentIndex = sentences.length - 1;
        updateUI();
        resetDictation();
      }

      function updateUI() {
        document.getElementById("level-display").innerText =
          `Level ${currentIndex + 1} / ${sentences.length}`;
        document.getElementById("prev-btn").disabled = currentIndex === 0;
        document.getElementById("next-btn").disabled =
          currentIndex === sentences.length - 1;
      }

      function playAudio(gender) {
        const num = String(currentIndex + 1).padStart(2, "0");
        const player = document.getElementById("player");
        player.src = `${audioBase}${num}-${gender}.mp3`;
        player.play();
      }

      function checkDictation() {
        const userText = document.getElementById("user-input").value.trim();
        const feedbackDiv = document.getElementById("feedback");
        if (!userText) {
          feedbackDiv.innerHTML =
            '<span style="color:#e74c3c">Please type something first!</span>';
          return;
        }
        feedbackDiv.innerHTML = compareStrings(
          sentences[currentIndex],
          userText,
        );
      }

      function revealAnswer() {
        document.getElementById("user-input").value = sentences[currentIndex];
        checkDictation();
      }

      function resetDictation() {
        document.getElementById("user-input").value = "";
        document.getElementById("feedback").innerHTML =
          '<span style="color:#aaa; font-style:italic;">Feedback will appear here...</span>';
        const hintBox = document.getElementById("hint-box");
        hintBox.classList.remove("visible");
        hintBox.innerText = "";
      }

      function toggleHint() {
        const hintBox = document.getElementById("hint-box");
        if (hintBox.classList.contains("visible")) {
          hintBox.classList.remove("visible");
        } else {
          hintBox.innerText = translations[currentIndex];
          hintBox.classList.add("visible");
        }
      }

      function compareStrings(correct, user) {
        let html = "";
        const correctWords = correct.split(" ");
        const userWords = user.split(" ");
        const maxLength = Math.max(correctWords.length, userWords.length);
        for (let i = 0; i < maxLength; i++) {
          const cWord = correctWords[i] || "";
          const uWord = userWords[i] || "";
          const cleanC = cWord.toLowerCase().replace(/[.,?!]/g, "");
          const cleanU = uWord.toLowerCase().replace(/[.,?!]/g, "");
          if (cleanC === cleanU) {
            html += `<span class="diff-correct">${cWord}</span> `;
          } else {
            if (cWord) html += `<span class="diff-added">${cWord}</span> `;
            if (uWord) html += `<span class="diff-missing">${uWord}</span> `;
          }
        }
        return html;
      }

      updateUI();
    </script>
    <script src="/assets/js/exercise-feedback.js"></script>
    <script type="module" src="../../../../assets/js/nav-utensils.js"></script>
  </body>
</html>
