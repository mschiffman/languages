<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonetic Practice — French /ʀ/ · R in the middle</title>

    <!-- Google tag (gtag.js) -->
    <script

      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CHXHM9CZKM");

    <!-- Favicons -->
    <link href="/img/favicon.png" rel="icon" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/pimsleur.css" />
    <style>
      [data-audio] {
        cursor: pointer;
      }
      .phonetic {
        font-size: 0.85rem;
      }
      .pair-vs {
        align-self: center;
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: #aaa;
        text-transform: uppercase;
      }
      .pager a {
        padding: 6px 18px;
        border-radius: 999px;
        border: 1px solid rgba(0, 200, 255, 0.4);
        color: rgba(255, 255, 255, 0.75);
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        transition: background 0.2s;
      }
      .pager a:hover {
        background: rgba(0, 200, 255, 0.12);
      }
      .pager a.active {
        background: linear-gradient(135deg, var(--blue-accent), var(--cyan));
        border-color: transparent;
        color: white;
      }
    </style>
  </head>
  <body class="min-h-screen bg-grid relative">
    <!-- Background decorative blobs -->
    <div
      class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0"
    >
      <div
        class="absolute top-[-80px] left-[-80px] w-96 h-96 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.18) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute bottom-[-60px] right-[-60px] w-80 h-80 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(0, 200, 255, 0.14) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute top-1/2 right-1/4 w-64 h-64 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.08) 0%,
            transparent 70%
          );
        "
      ></div>
    </div>

    <div class="relative z-10 w-full px-4 sm:px-6 py-12">
      <!-- Header -->
      <div class="text-center mb-14">
        <div class="flex items-center justify-center gap-4 mb-3">
          <span class="badge">PHONETICS</span>
          <span class="badge">CONSONANT</span>
        </div>
        <h1
          class="text-7xl font-bold tracking-tight mb-2 header-glow"
          style="
            font-family: &quot;Playfair Display&quot;, serif;
            font-style: italic;
            color: white;
            letter-spacing: -0.02em;
          "
        >
          /ʀ/
        </h1>
        <p
          class="text-2xl mb-4"
          style="
            color: var(--cyan);
            opacity: 0.85;
            font-family: &quot;Playfair Display&quot;, serif;
          "
        >
          merci, très, parler
        </p>
        <div class="header-line w-64 mx-auto"></div>
        <p
          class="mt-4 text-sm tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.4);
            font-family: &quot;Roboto&quot;, sans-serif;
          "
        >
          Tap a word to hear it
        </p>
        <nav class="pager mt-6 flex flex-wrap justify-center gap-3">
          <a href="index.html">R-Front</a>
          <a href="2.html" class="active" aria-current="page">R-Middle</a>
          <a href="3.html">R-End</a>
        </nav>
      </div>

      <!-- Cards are rendered from `groups` below -->
      <div id="cards"></div>

      <!-- Footer -->
      <div class="mt-14 text-center">
        <div class="header-line w-48 mx-auto mb-5"></div>
        <p
          class="text-xs tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.25);
            font-family: &quot;Space Mono&quot;, monospace;
          "
        >
          <span id="count">36</span> words · French /ʀ/ · Bonne chance&#8239;!
        </p>
      </div>
    </div>

    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : NN-<word>.m4a in AUD_DIR (01-absurde.m4a … 36-vrai.m4a),
             numbered in reading order across all groups
   groups -> words: [French, IPA, English, file?]
     file is the audio file name (no extension) when it isn't the usual
     one; numbering continues from its number, so it also covers gaps.
   groups -> pairs: [[French, IPA, English], [French, IPA, English]]
     two contrasting words side by side, each with its own audio.
   title is "" when the page has a single, self-explanatory group.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/phonetics/r/2/";
      const AUD_EXT = "m4a";
      const AUD_NAME = (n, word) => `${n}-${word}`;

      const groups = [
        {
          title: "R in the middle",
          words: [
            ["absurde", "/apsyʀd/", "absurd"],
            ["après", "/apʀɛ/", "after"],
            ["arrêter", "/aʀete/", "to stop"],
            ["arrivée", "/aʀive/", "arrival"],
            ["aujourd’hui", "/oʒuʀdɥi/", "today"],
            ["carré", "/kaʀe/", "square"],
            ["comprendre", "/kɔ̃pʀɑ̃dʀ/", "understand"],
            ["crois", "/kʀwa/", "to believe"],
            ["dernière", "/dɛʀnjɛʀ/", "last"],
            ["droit", "/dʀwa/", "right, straight"],
            ["drôle", "/dʀol/", "funny"],
            ["étranger", "/etʀɑ̃ʒe/", "foreign, strange"],
            ["fermer", "/fɛʀme/", "close"],
            ["frisson", "/fʀisɔ̃/", "shiver"],
            ["liberté", "/libɛʀte/", "freedom"],
            ["merci", "/mɛʀsi/", "thank you"],
            ["pardon", "/paʀdɔ̃/", "Sorry. / Excuse me."],
            ["parent", "/paʀɑ̃/", "parent"],
            ["parfois", "/paʀfwa/", "sometimes"],
            ["parler", "/paʀle/", "to speak, talk"],
            ["partiel", "/paʀsjɛl/", "partial"],
            ["partir", "/paʀtiʀ/", "to go, leave"],
            ["personne", "/pɛʀsɔn/", "person, nobody"],
            ["premier", "/pʀəmje/", "first"],
            ["prendre", "/pʀɑ̃dʀ/", "to take, get, pick up"],
            ["prêt", "/pʀɛ/", "ready"],
            ["prévoir", "/pʀevwaʀ/", "to plan, allow, foresee"],
            ["terme", "/tɛʀm/", "term"],
            ["travailler", "/tʀavaje/", "to work"],
            ["trente", "/tʀɑ̃t/", "thirty"],
            ["très", "/tʀɛ/", "very"],
            ["trois", "/tʀwɑ/", "three"],
            ["trouver", "/tʀuve/", "to find, think"],
            ["vérifier", "/veʀifje/", "verify"],
            ["vice versa", "/visevɛʀsa/", "vice versa", "35-vise versa"],
            ["vrai", "/vʀɛ/", "true"],
          ],
        },
      ];

      (function () {
        const SPEAKER = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const pad = (n) => String(n).padStart(2, "0");
        let audioNum = 0;
        let wordCount = 0;

        // Audio files are numbered in reading order across all groups.
        const audio = (fr, file) => {
          wordCount++;
          if (file) audioNum = parseInt(file, 10);
          const name = file || AUD_NAME(pad(++audioNum), fr);
          return `data-audio="${AUD_DIR}${name}.${AUD_EXT}"`;
        };

        const text = (fr, ipa, en) => `
              <div class="flex-1 min-w-0">
                <p class="phrase text-lg leading-tight" lang="fr">${fr}</p>
                <p class="phonetic">${ipa}</p>
                <p class="english">${en}</p>
              </div>`;

        const card = ([fr, ipa, en, file]) => `
          <div class="card p-3 sm:p-4 flex items-center gap-3 shadow-md" ${audio(fr, file)}>
            <button class="sound-btn" title="Play audio" aria-label="Play ${fr}">${SPEAKER}</button>${text(fr, ipa, en)}
          </div>`;

        const half = ([fr, ipa, en, file]) => `
            <div class="flex-1 min-w-0 flex items-center gap-3" ${audio(fr, file)}>
              <button class="sound-btn" title="Play audio" aria-label="Play ${fr}">${SPEAKER}</button>${text(fr, ipa, en)}
            </div>`;

        const pair = ([a, b]) => `
          <div class="card p-3 sm:p-4 flex gap-3 shadow-md">${half(a)}
            <span class="pair-vs">vs</span>${half(b)}
          </div>`;

        const section = (g, i) => `
          ${g.title ? `<div class="${i ? "mt-14 " : ""}mb-6">
            <h2 class="text-3xl font-bold" style="font-family: 'Playfair Display', serif; color: white">${g.title}</h2>
            ${g.desc ? `<p class="mt-1 text-sm" style="color: rgba(255, 255, 255, 0.55); font-family: 'Roboto', sans-serif">${g.desc}</p>` : ""}
            <div class="header-line w-48 mt-3"></div>
          </div>` : ""}
          ${g.pairs
            ? `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-5">${g.pairs.map(pair).join("")}`
            : `<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5">${g.words.map(card).join("")}`}
          </div>`;

        document.getElementById("cards").innerHTML = groups
          .map(section)
          .join("");

        // Tapping a card (or one side of a pair) plays it; one clip at a time.
        let playing = null;
        document.querySelectorAll("#cards [data-audio]").forEach((el) => {
          el.addEventListener("click", () => {
            if (playing) playing.pause();
            playing = new Audio(el.dataset.audio);
            playing.play();
          });
        });

        document.getElementById("count").textContent = wordCount;
      })();
    </script>
    <script src="../../../assets/js/nav-enun-flash.js"></script>
  </body>
</html>
