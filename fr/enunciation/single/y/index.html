    <link

    <style>
      :root {
        --blue-deep: #0a1628;
        --blue-mid: #0d3b7a;
        --blue-accent: #1a6ef5;
        --cyan: #00c8ff;
      }

      body {
        background-color: rgb(0, 43, 123);
        font-family: "Roboto", sans-serif;
      }

      .bg-grid {
        background-image:
          linear-gradient(rgba(26, 110, 245, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26, 110, 245, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .header-glow {
        text-shadow:
          0 0 40px rgba(0, 200, 255, 0.6),
          0 0 80px rgba(26, 110, 245, 0.4);
      }

      .card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 16px;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--blue-accent), var(--cyan));
        opacity: 0;
        transition: opacity 0.25s;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 20px 50px rgba(0, 200, 255, 0.18),
          0 8px 20px rgba(0, 0, 0, 0.3);
      }

      .card:hover::before {
        opacity: 1;
      }

      .phrase {
        font-family: "Roboto", sans-serif;
        font-weight: 500;
        color: #111;
      }

      .phonetic {
        font-family: "Roboto", sans-serif;
        font-weight: 430;
        color: #555;
      }

      .english {
        font-family: "Roboto", sans-serif;
        color: #888;
        font-size: 0.78rem;
      }

      .sound-btn {
        background: linear-gradient(135deg, #e8f4ff, #cce8ff);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--blue-accent);
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.15s;
        flex-shrink: 0;
      }

      .sound-btn:hover {
        background: linear-gradient(135deg, var(--blue-accent), var(--cyan));
        color: white;
        transform: scale(1.1);
      }

      .note-wrapper {
        position: relative;
        flex-shrink: 0;
      }

      .note-btn {
        background: linear-gradient(135deg, #e8f4ff, #cce8ff);
        border-radius: 8px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--blue-accent);
        cursor: pointer;
        transition: background 0.2s;
      }

      .note-btn:hover {
        background: linear-gradient(135deg, var(--cyan), var(--blue-accent));
        color: white;
      }

      .note-wrapper::after {
        content: attr(data-note);
        font-family: "Roboto", sans-serif;
        font-size: 0.72rem;
        line-height: 1.5;
        color: #444;
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        background: white;
        padding: 8px 10px;
        border-radius: 8px;
        width: 200px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 20;
        white-space: normal;
      }

      .note-wrapper:hover::after,
      .note-wrapper.show::after {
        opacity: 1;
      }

      /* Expression flashcards: note + example on separate lines */
      .note-wrapper.note-multiline::after {
        white-space: pre-line;
        width: 260px;
      }

      .badge {
        background: linear-gradient(135deg, var(--blue-accent), var(--cyan));
        border-radius: 6px;
        padding: 2px 10px;
        font-size: 0.7rem;
        color: white;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        animation: fadeUp 0.5s ease both;
      }

      .card:nth-child(1) {
        animation-delay: 0.05s;
      }
      .card:nth-child(2) {
        animation-delay: 0.1s;
      }
      .card:nth-child(3) {
        animation-delay: 0.15s;
      }
      .card:nth-child(4) {
        animation-delay: 0.2s;
      }
      .card:nth-child(5) {
        animation-delay: 0.25s;
      }
      .card:nth-child(6) {
        animation-delay: 0.3s;
      }
      .card:nth-child(7) {
        animation-delay: 0.35s;
      }
      .card:nth-child(8) {
        animation-delay: 0.4s;
      }
      .card:nth-child(9) {
        animation-delay: 0.45s;
      }
      .card:nth-child(10) {
        animation-delay: 0.5s;
      }

      .diagonal-accent {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 280px;
        height: 280px;
        background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
        opacity: 0.12;
        pointer-events: none;
      }

      .header-line {
        background: linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          transparent
        );
        height: 1px;
        opacity: 0.4;
      }

      /* ── Hamburger button ── */
      #hamburger {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 110;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        width: 42px;
        height: 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        transition: background 0.2s;
      }
      #hamburger:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      #hamburger span {
        display: block;
        width: 18px;
        height: 2px;
        background: white;
        border-radius: 2px;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }
      #hamburger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      #hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      #hamburger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      /* ── Overlay ── */
      #sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #sidebar-overlay.visible {
        opacity: 1;
        pointer-events: all;
      }

      /* ── Sidebar ── */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 270px;
        background: linear-gradient(180deg, #0b1f4d 0%, #060f28 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 105;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar.open {
        transform: translateX(0);
      }

      .sidebar-header {
        padding: 18px 16px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      .sidebar-title {
        font-family: "Playfair Display", serif;
        color: white;
        font-size: 1rem;
        font-weight: 700;
      }
      .sidebar-subtitle {
        font-family: "Roboto", sans-serif;
        color: rgba(0, 200, 255, 0.65);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 3px;
      }

      /* ── Scrollable content area ── */
      .sidebar-scroll {
        flex: 1;
        overflow-x: auto;
        overflow-y: auto;
        min-width: 0;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: rgba(0, 200, 255, 0.35);
        border-radius: 4px;
      }
      .sidebar-scroll::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* ── Level accordion ── */
      .level-section {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .level-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 16px;
        background: none;
        border: none;
        color: white;
        font-family: "Roboto", sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
        text-align: left;
      }
      .level-btn:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .level-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--blue-accent), var(--cyan));
        flex-shrink: 0;
      }
      .level-label {
        flex: 1;
      }

      .chevron {
        flex-shrink: 0;
        color: rgba(0, 200, 255, 0.6);
        transition: transform 0.25s;
      }
      .level-btn.open .chevron {
        transform: rotate(180deg);
      }

      /* ── Lessons list ── */
      .lessons-list {
        display: none;
        padding: 2px 0 8px;
        white-space: nowrap;
      }
      .lessons-list.open {
        display: block;
      }

      .lesson-link {
        display: block;
        padding: 7px 16px 7px 34px;
        font-family: "Roboto", sans-serif;
        font-size: 0.76rem;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
        text-decoration: none;
        white-space: nowrap;
      }
      .lesson-link:hover {
        color: rgba(0, 200, 255, 0.9);
        background: rgba(0, 200, 255, 0.06);
      }
      .lesson-link.active {
        color: var(--cyan);
        background: rgba(0, 200, 255, 0.1);
        font-weight: 600;
      }
</style>
    <style>
      [data-audio] {
        cursor: pointer;
      }
      .phonetic {
        font-size: 0.85rem;
      }
      .pair-vs {
        align-self: center;
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: #aaa;
        text-transform: uppercase;
      }
      .pager a {
        padding: 6px 18px;
        border-radius: 999px;
        border: 1px solid rgba(0, 200, 255, 0.4);
        color: rgba(255, 255, 255, 0.75);
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        transition: background 0.2s;
      }
      .pager a:hover {
        background: rgba(0, 200, 255, 0.12);
      }
      .pager a.active {
        background: linear-gradient(135deg, var(--blue-accent), var(--cyan));
        border-color: transparent;
        color: white;
      }
    </style>
  </head>
  <body class="min-h-screen bg-grid relative">
    <!-- Background decorative blobs -->
    <div
      class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0"
    >
      <div
        class="absolute top-[-80px] left-[-80px] w-96 h-96 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.18) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute bottom-[-60px] right-[-60px] w-80 h-80 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(0, 200, 255, 0.14) 0%,
            transparent 70%
          );
        "
      ></div>
      <div
        class="absolute top-1/2 right-1/4 w-64 h-64 rounded-full"
        style="
          background: radial-gradient(
            circle,
            rgba(26, 110, 245, 0.08) 0%,
            transparent 70%
          );
        "
      ></div>
    </div>

    <div class="relative z-10 w-full px-4 sm:px-6 py-12">
      <!-- Header -->
      <div class="text-center mb-14">
        <div class="flex items-center justify-center gap-4 mb-3">
          <span class="badge">PHONETICS</span>
          <span class="badge">ORAL VOWEL</span>
        </div>
        <h1
          class="text-7xl font-bold tracking-tight mb-2 header-glow"
          style="
            font-family: &quot;Playfair Display&quot;, serif;
            font-style: italic;
            color: white;
            letter-spacing: -0.02em;
          "
        >
          /y/
        </h1>
        <p
          class="text-2xl mb-4"
          style="
            color: var(--cyan);
            opacity: 0.85;
            font-family: &quot;Playfair Display&quot;, serif;
          "
        >
          tu, rue, voiture
        </p>
        <div class="header-line w-64 mx-auto"></div>
        <p
          class="mt-4 text-sm tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.4);
            font-family: &quot;Roboto&quot;, sans-serif;
          "
        >
          Tap a word to hear it
        </p>
      </div>

      <!-- Cards are rendered from `groups` below -->
      <div id="cards"></div>

      <!-- Footer -->
      <div class="mt-14 text-center">
        <div class="header-line w-48 mx-auto mb-5"></div>
        <p
          class="text-xs tracking-widest uppercase"
          style="
            color: rgba(255, 255, 255, 0.25);
            font-family: &quot;Space Mono&quot;, monospace;
          "
        >
          <span id="count">36</span> words · French /y/ · Bonne chance&#8239;!
        </p>
      </div>
    </div>

    <script>
      /* ---------------------------------------------------------------
   Media:
     audio : NN-<word>.m4a in AUD_DIR (01-bu.m4a … 36-voiture.m4a),
             numbered in reading order across all groups
   groups -> words: [French, IPA, English, file?]
     file is the audio file name (no extension) when it isn't the usual
     one; numbering continues from its number, so it also covers gaps.
   groups -> pairs: [[French, IPA, English], [French, IPA, English]]
     two contrasting words side by side, each with its own audio.
   title is "" when the page has a single, self-explanatory group.
--------------------------------------------------------------- */
      const AUD_DIR = "https://languages.rmlives.com/phonetics/y/";
      const AUD_EXT = "m4a";
      const AUD_NAME = (n, word) => `${n}-${word}`;

      const groups = [
        {
          title: "consonant + u",
          words: [
            ["bu", "/by/", "drunk - past participle of \"boire\""],
            ["du", "/dy/", "de + le"],
            ["nu", "/ny/", "naked"],
            ["ru", "/ʀy/", "stream / brook"],
            ["tu", "/ty/", "you"],
          ],
        },
        {
          title: "consonant + ue",
          words: [
            ["bue", "/by/", "drunk"],
            ["mue", "/my/", "molting"],
            ["rue", "/ʀy/", "street"],
            ["tue", "/ty/", "kill"],
            ["vue", "/vy/", "eyesight / view"],
          ],
        },
        {
          title: "consonant + u + consonant",
          words: [
            ["adulte", "/adylt/", "adult"],
            ["aventure", "/avɑ̃tyʀ/", "adventure"],
            ["bureau", "/byʀo/", "desk / office"],
            ["dessus", "/d(ə)sy/", "on top"],
            ["dur", "/dyʀ/", "hard"],
            ["durer", "/dyʀe/", "to last"],
            ["entendu", "/ɑ̃tɑ̃dy/", "heard"],
            ["humain", "/ymɛ̃/", "human"],
            ["lecture", "/lɛktyʀ/", "reading"],
            ["mesure", "/m(ə)zyʀ/", "measure / measurement"],
            ["mur", "/myʀ/", "wall"],
            ["naturel", "/natyʀɛl/", "natural"],
            ["perdu", "/pɛʀdy/", "lost"],
            ["plus", "/ply(s)/", "more"],
            ["plusieurs", "/plyzjœʀ/", "several"],
            ["plutôt", "/plyto/", "rather"],
            ["rue", "/ʀy/", "street"],
            ["sur", "/syʀ/", "on / in"],
            ["surface", "/syʀfas/", "surface"],
            ["surplomber", "/syʀplɔ̃be/", "to look down / overlook"],
            ["surprise", "/syʀpʀiz/", "surprise"],
            ["surtout", "/syʀtu/", "especially"],
            ["truc", "/tʀyk/", "thing / trick"],
            ["ultra", "/yltʀa/", "ultra"],
            ["univers", "/ynivɛʀ/", "universe"],
            ["voiture", "/vwatyʀ/", "car"],
          ],
        },
      ];

      (function () {
        const SPEAKER = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const pad = (n) => String(n).padStart(2, "0");
        let audioNum = 0;
        let wordCount = 0;

        // Audio files are numbered in reading order across all groups.
        const audio = (fr, file) => {
          wordCount++;
          if (file) audioNum = parseInt(file, 10);
          const name = file || AUD_NAME(pad(++audioNum), fr);
          return `data-audio="${AUD_DIR}${name}.${AUD_EXT}"`;
        };

        const text = (fr, ipa, en) => `
              <div class="flex-1 min-w-0">
                <p class="phrase text-lg leading-tight" lang="fr">${fr}</p>
                <p class="phonetic">${ipa}</p>
                <p class="english">${en}</p>
              </div>`;

        const card = ([fr, ipa, en, file]) => `
          <div class="card p-3 sm:p-4 flex items-center gap-3 shadow-md" ${audio(fr, file)}>
            <button class="sound-btn" title="Play audio" aria-label="Play ${fr}">${SPEAKER}</button>${text(fr, ipa, en)}
          </div>`;

        const half = ([fr, ipa, en, file]) => `
            <div class="flex-1 min-w-0 flex items-center gap-3" ${audio(fr, file)}>
              <button class="sound-btn" title="Play audio" aria-label="Play ${fr}">${SPEAKER}</button>${text(fr, ipa, en)}
            </div>`;

        const pair = ([a, b]) => `
          <div class="card p-3 sm:p-4 flex gap-3 shadow-md">${half(a)}
            <span class="pair-vs">vs</span>${half(b)}
          </div>`;

        const section = (g, i) => `
          ${g.title ? `<div class="${i ? "mt-14 " : ""}mb-6">
            <h2 class="text-3xl font-bold" style="font-family: 'Playfair Display', serif; color: white">${g.title}</h2>
            ${g.desc ? `<p class="mt-1 text-sm" style="color: rgba(255, 255, 255, 0.55); font-family: 'Roboto', sans-serif">${g.desc}</p>` : ""}
            <div class="header-line w-48 mt-3"></div>
          </div>` : ""}
          ${g.pairs
            ? `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-5">${g.pairs.map(pair).join("")}`
            : `<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5">${g.words.map(card).join("")}`}
          </div>`;

        document.getElementById("cards").innerHTML = groups
          .map(section)
          .join("");

        // Tapping a card (or one side of a pair) plays it; one clip at a time.
        let playing = null;
        document.querySelectorAll("#cards [data-audio]").forEach((el) => {
          el.addEventListener("click", () => {
            if (playing) playing.pause();
            playing = new Audio(el.dataset.audio);
            playing.play();
          });
        });

        document.getElementById("count").textContent = wordCount;
      })();
    </script>
    <script>/* ---------------------------------------------------------------
   Hamburger sidebar for the phonetic flashcard pages
   (fr/enunciation/<sound>/index.html). Same links as nav-enun.js,
   styled by pimsleur.css like the expression flashcard menu.
   Add new sounds by extending SECTIONS below; dir is the folder
   name under fr/enunciation/.
--------------------------------------------------------------- */
(function () {
  const __sfParts = location.pathname.split("/").filter(Boolean);
  const __sfSingle = __sfParts.lastIndexOf("single");
  const pathParts = __sfSingle > 0
    ? __sfParts.filter((_, i) => i !== __sfSingle)
    : __sfParts;
  const enunIndex = pathParts.indexOf("enunciation");
  const rootParts = enunIndex >= 2 ? pathParts.slice(0, enunIndex - 1) : [];
  const rootPrefix = `/${rootParts.join("/")}${rootParts.length ? "/" : ""}`;
  const enunPrefix =
    enunIndex >= 0 ? `/${pathParts.slice(0, enunIndex + 1).join("/")}/single/` : "/";

  const sound = (dir, label) => ({
    label,
    href: `${enunPrefix}${dir}/index.html`,
    dir,
  });

  const SECTIONS = [
    {
      name: "Phonetic Rules",
      links: [
        { label: "🗣️ Consonants", href: `${enunPrefix}consonant.html` },
        { label: "👄 Oral Vowels", href: `${enunPrefix}vowel.html` },
        { label: "👃 Nasal Vowels", href: `${enunPrefix}nasal.html` },
        { label: "🔗 Liaison", href: `${enunPrefix}liaison.html` },
      ],
    },
    {
      name: "Vowels",
      links: [
        sound("i", "/i/"),
        sound("e", "/e/"),
        sound("ε", "/ɛ/"),
        sound("a", "/a/"),
        sound("ɑ", "/ɑ/"),
        sound("ə", "/ə/"),
        sound("œ", "/œ/"),
        sound("ø", "/ø/"),
        sound("ɔ", "/ɔ/"),
        sound("o", "/o/"),
        sound("u", "/u/"),
        sound("y", "/y/"),
      ],
    },
    {
      name: "Nasal Vowels",
      links: [
        sound("ɛ̃", "/ɛ̃/"),
        sound("œ̃", "/œ̃/"),
        sound("ɑ̃", "/ɑ̃/"),
        sound("ɔ̃", "/ɔ̃/"),
      ],
    },
    {
      name: "Consonants",
      links: [sound("r", "/ʀ/"), sound("ɲ", "/ɲ/"), sound("ɥ", "/ɥ/")],
    },
  ];

  // ── Insert hamburger, overlay and sidebar ──
  document.body.insertAdjacentHTML(
    "afterbegin",
    `
    <button id="hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="sidebar-overlay"></div>
    <nav id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Phonetic Practice</div>
        <div class="sidebar-subtitle">French Sounds</div>
      </div>
      <div class="sidebar-scroll" id="sidebar-scroll"></div>
    </nav>`,
  );

  const hamburger = document.getElementById("hamburger");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebar-overlay");
  const scroll = document.getElementById("sidebar-scroll");

  function setOpen(open) {
    sidebar.classList.toggle("open", open);
    overlay.classList.toggle("visible", open);
    hamburger.classList.toggle("open", open);
  }
  hamburger.addEventListener("click", () =>
    setOpen(!sidebar.classList.contains("open")),
  );
  overlay.addEventListener("click", () => setOpen(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setOpen(false);
  });

  // ── Home link, then one accordion per section ──
  // Folder names are IPA, so compare the decoded, NFC-normalized folder.
  const nfc = (s) => {
    try {
      return decodeURIComponent(s).normalize("NFC");
    } catch {
      return s.normalize("NFC");
    }
  };
  const currentDir = enunIndex >= 0 ? nfc(pathParts[enunIndex + 1] || "") : "";

  SECTIONS.forEach((sec) => {
    const section = document.createElement("div");
    section.className = "level-section";

    const btn = document.createElement("button");
    btn.className = "level-btn";
    btn.innerHTML = `
      <span class="level-dot"></span>
      <span class="level-label">${sec.name}</span>
      <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>`;

    const list = document.createElement("div");
    list.className = "lessons-list";

    sec.links.forEach((link) => {
      const a = document.createElement("a");
      a.className = "lesson-link";
      a.textContent = link.label;
      a.href = link.href;
      if (link.dir && nfc(link.dir) === currentDir) {
        a.classList.add("active");
        a.setAttribute("aria-current", "page");
      }
      list.appendChild(a);
    });

    // Open the section holding the current sound.
    if (list.querySelector(".active")) {
      btn.classList.add("open");
      list.classList.add("open");
    }

    btn.addEventListener("click", () => {
      btn.classList.toggle("open");
      list.classList.toggle("open");
    });

    section.appendChild(btn);
    section.appendChild(list);
    scroll.appendChild(section);
  });
})();
</script>
  </body>
</html>
