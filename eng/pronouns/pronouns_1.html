<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>I, You, He, She 1</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-CHXHM9CZKM");
    </script>

    <link href="/img/favicon.png" rel="icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&family=Noto+Sans+Myanmar:wght@400&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Same colours and fonts as the story pages (ytstory.css). */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: "#f1f6ea",
              edge: "#e3edd6",
              forest: "#274b2f",
              moss: "#3c6b45",
              leaf: "#8fc07e",
              gold: "#f6b93b",
              golddeep: "#e39b12",
            },
            fontFamily: {
              display: ["Fredoka", "sans-serif"],
              body: ["Andika", "Segoe UI", "system-ui", "sans-serif"],
              my: ["Noto Sans Myanmar", "Padauk", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      [x-cloak] { display: none !important; }
      button { -webkit-tap-highlight-color: transparent; }
      .shake { animation: shake 0.4s; }
      @keyframes shake {
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }
      /* empty slot in a sentence */
      .slot { display: inline-block; min-width: 2.6em; border-bottom: 4px solid currentColor; text-align: center; line-height: 1.2; }
    </style>
  </head>

  <body class="bg-edge font-body text-forest antialiased">
    <div class="mx-auto flex min-h-screen max-w-xl flex-col bg-paper px-4 pb-5" x-data="lesson()" x-cloak>
      <a
        class="mt-2 inline-flex min-h-[2rem] items-center gap-1 self-start rounded-full py-0.5 pl-1.5 pr-3 font-display font-semibold text-moss hover:bg-edge hover:text-forest"
        href="/english.html"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        English
      </a>
      <!-- ---------- title ---------- -->
      <header class="flex items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-2 font-display text-xl font-semibold">
          <svg class="h-6 w-6 flex-none" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
            <path d="M8 16C11 12 14 9 18 7" stroke="#274B2F" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="leading-tight">I, You, He, She</span>
          <span class="whitespace-nowrap rounded-full bg-gold px-2.5 py-0.5 text-sm">Pronouns 1</span>
        </div>
        <button
          class="h-10 flex-none rounded-full border-2 px-3 font-my text-sm"
          :class="showMy ? 'border-forest bg-forest text-white' : 'border-edge bg-white text-moss'"
          @click="showMy = !showMy"
          :aria-pressed="showMy"
        >မြန်မာ</button>
      </header>

      <!-- ---------- the five steps ---------- -->
      <nav class="mt-3 flex gap-1.5" aria-label="Lesson steps">
        <template x-for="(s, k) in STEPS" :key="k">
          <button
            class="flex h-11 flex-1 items-center justify-center gap-1 rounded-full border-2 font-display text-base font-semibold"
            :class="k === step ? 'border-forest bg-forest text-white' : k < step ? 'border-leaf bg-leaf/40 text-forest' : 'border-edge bg-white text-moss'"
            @click="go(k)"
            :aria-label="'Step ' + (k + 1) + ': ' + s.en"
            :aria-current="k === step ? 'step' : false"
          >
            <span x-text="s.icon" aria-hidden="true"></span><span x-text="k + 1"></span>
          </button>
        </template>
      </nav>

      <div class="mt-3 flex items-baseline justify-between gap-3">
        <h1 class="font-display text-2xl font-semibold leading-tight" x-text="done ? 'Well done!' : STEPS[step].en"></h1>
        <span class="whitespace-nowrap font-display font-semibold text-moss" x-show="!done" x-text="(i + 1) + ' / ' + total()"></span>
      </div>
      <p class="font-my text-base leading-loose text-moss" x-show="showMy && !done" x-text="STEPS[step].my"></p>

      <div class="mb-4 mt-1 flex gap-1" x-show="!done" aria-hidden="true">
        <template x-for="k in total()" :key="k">
          <span class="h-2 flex-1 rounded" :class="k - 1 < i ? 'bg-leaf' : k - 1 === i ? 'bg-gold' : 'bg-edge'"></span>
        </template>
      </div>

      <p class="mb-3 rounded-xl bg-white px-3 py-1.5 text-sm text-moss" x-show="!AUDIO_READY && !done">
        🔇 The voices are not recorded yet. Read the words for now.
      </p>

      <main class="flex flex-1 flex-col">
        <!-- ========== 1 · Look and listen: picture, word, sentence ========== -->
        <template x-if="step === 0">
          <section class="flex flex-col gap-3">
            <div class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white" x-html="pic(sc)"></div>

            <div class="flex items-center gap-3 rounded-3xl border-2 border-edge bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY" @click="play(sc.pron.clip)" aria-label="Hear the word" x-html="SPK_ICON"></button>
              <div class="min-w-0 flex-1">
                <div class="font-display text-5xl font-bold text-sky-700" x-text="sc.pron.id"></div>
                <div class="font-my text-lg leading-loose text-moss" x-show="showMy" x-text="sc.pron.my"></div>
              </div>
              <!-- the helper word that goes with it: I am, you are, he is -->
              <div class="flex-none rounded-2xl bg-paper px-3 py-2 text-center text-xl font-bold">
                <span class="text-sky-700" x-text="sc.pron.id"></span> <span class="text-amber-700" x-text="sc.pron.be"></span>
              </div>
            </div>

            <div class="flex items-center gap-3 rounded-3xl border-2 border-edge bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY" @click="play(sc.clip)" aria-label="Hear the sentence" x-html="SPK_ICON"></button>
              <div>
                <p class="text-2xl font-bold leading-snug" x-html="sentence(sc)"></p>
                <p class="font-my text-base leading-loose text-moss" x-show="showMy" x-text="sc.my"></p>
              </div>
            </div>
          </section>
        </template>

        <!-- ========== 2 · Tap the picture: hear (or read) the word, find it ========== -->
        <template x-if="step === 1">
          <section class="flex flex-col gap-3">
            <div class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY" @click="play(sc.pron.clip)" aria-label="Hear the word again" x-html="SPK_ICON"></button>
              <div class="font-display text-4xl font-bold text-sky-700" x-text="sc.pron.id"></div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <template x-for="o in opts" :key="o.n">
                <button
                  class="relative aspect-[4/3] overflow-hidden rounded-2xl border-4 bg-white transition"
                  :class="[
                    solved && o.n === sc.n ? 'border-green-600 ring-4 ring-green-200'
                      : solved || wrong.includes(o.n) ? 'border-edge opacity-40'
                      : 'border-forest active:translate-y-0.5',
                    shaking === o.n ? 'shake' : '',
                  ]"
                  :disabled="solved || wrong.includes(o.n)"
                  @click="pickPic(o)"
                  :aria-label="'Picture ' + o.n"
                  x-html="pic(o, true)"
                ></button>
              </template>
            </div>

            <div class="rounded-2xl border-2 border-green-600 bg-green-50 px-4 py-2.5 text-lg" x-show="solved" aria-live="polite">
              <b class="font-display" x-text="cheer"></b> <span x-html="sentence(sc)"></span>
            </div>
          </section>
        </template>

        <!-- ========== 3 · Swap the name: The boy -> He ========== -->
        <template x-if="step === 2">
          <section class="flex flex-col gap-3">
            <div class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white" x-html="pic(sc)"></div>

            <div class="flex items-center gap-3 rounded-3xl border-2 border-edge bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY" @click="play(name.clip)" aria-label="Hear the sentence" x-html="SPK_ICON"></button>
              <p class="text-xl font-bold leading-snug">
                <span class="rounded-lg bg-sky-100 px-1.5 text-sky-700" x-text="name.text"></span>
                <span class="text-amber-700" x-text="sc.pron.be"></span>
                <span class="text-rose-600" x-text="sc.verb.ing"></span>.
              </p>
            </div>

            <div class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY || !solved" @click="play(sc.clip)" aria-label="Hear the short sentence" x-html="SPK_ICON"></button>
              <p class="text-2xl font-bold leading-relaxed">
                <span class="slot text-sky-700" x-text="solved ? sc.pron.cap : ' '"></span>
                <span class="text-amber-700" x-text="sc.pron.be"></span>
                <span class="text-rose-600" x-text="sc.verb.ing"></span>.
              </p>
            </div>

            <div class="grid grid-cols-5 gap-1.5">
              <template x-for="p in NAME_CHOICES" :key="p.id">
                <button
                  class="min-h-[56px] rounded-2xl border-[3px] text-lg font-bold transition"
                  :class="[
                    solved && p.id === sc.pron.id ? 'border-sky-700 bg-sky-700 text-white'
                      : solved || wrong.includes(p.id) ? 'border-edge bg-white text-sky-700 opacity-40'
                      : 'border-sky-700 bg-white text-sky-700 shadow-[0_4px_0_#e3edd6] active:translate-y-0.5',
                    shaking === p.id ? 'shake' : '',
                  ]"
                  :disabled="solved || wrong.includes(p.id)"
                  @click="pickName(p)"
                  x-text="p.cap"
                ></button>
              </template>
            </div>

            <div class="rounded-2xl border-2 border-green-600 bg-green-50 px-4 py-2.5 text-lg" x-show="solved" aria-live="polite">
              <b class="font-display" x-text="cheer"></b>
              <span class="font-bold"><span x-text="name.text"></span> → <span class="text-sky-700" x-text="sc.pron.cap"></span></span>
            </div>
          </section>
        </template>

        <!-- ========== 4 · Make the sentence: the word and its helper (I am, he is, they are) ========== -->
        <template x-if="step === 3">
          <section class="flex flex-col gap-3">
            <div class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white" x-html="pic(sc)"></div>

            <div class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY || !(gotS && gotB)" @click="play(sc.clip)" aria-label="Hear the sentence" x-html="SPK_ICON"></button>
              <p class="text-2xl font-bold leading-relaxed">
                <span class="slot text-sky-700" x-text="gotS ? sc.pron.cap : ' '"></span>
                <span class="slot text-amber-700" x-text="gotB ? sc.pron.be : ' '"></span>
                <span class="text-rose-600" x-text="sc.verb.ing"></span>.
              </p>
            </div>

            <div class="grid grid-cols-4 gap-2">
              <template x-for="p in PRONOUNS" :key="p.id">
                <button
                  class="min-h-[52px] rounded-2xl border-[3px] text-lg font-bold transition"
                  :class="[
                    gotS && p.id === sc.pron.id ? 'border-sky-700 bg-sky-700 text-white'
                      : gotS ? 'border-edge bg-white text-sky-700 opacity-40'
                      : 'border-sky-700 bg-white text-sky-700 shadow-[0_4px_0_#e3edd6] active:translate-y-0.5',
                    shaking === p.id ? 'shake' : '',
                  ]"
                  :disabled="gotS"
                  @click="pickPronoun(p)"
                  x-text="p.cap"
                ></button>
              </template>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <template x-for="b in BE" :key="b">
                <button
                  class="min-h-[52px] rounded-2xl border-[3px] text-xl font-bold transition"
                  :class="[
                    gotB && b === sc.pron.be ? 'border-amber-700 bg-amber-700 text-white'
                      : gotB ? 'border-edge bg-white text-amber-700 opacity-40'
                      : 'border-amber-700 bg-white text-amber-700 shadow-[0_4px_0_#e3edd6] active:translate-y-0.5',
                    shaking === b ? 'shake' : '',
                  ]"
                  :disabled="gotB"
                  @click="pickBe(b)"
                  x-text="b"
                ></button>
              </template>
            </div>

            <div class="rounded-2xl border-2 border-green-600 bg-green-50 px-4 py-2.5 text-lg" x-show="gotS && gotB" aria-live="polite">
              <b class="font-display" x-text="cheer"></b>
              <span class="font-my leading-loose text-moss" x-show="showMy" x-text="sc.my"></span>
            </div>
          </section>
        </template>

        <!-- ========== 5 · Yes or no?: does the sentence match the picture? ========== -->
        <template x-if="step === 4 && !done">
          <section class="flex flex-col gap-3">
            <div class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white" x-html="pic(sc)"></div>

            <div class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3">
              <button :class="SPK" :disabled="!AUDIO_READY" @click="play(said.clip)" aria-label="Hear the sentence" x-html="SPK_ICON"></button>
              <p class="text-2xl font-bold leading-snug" x-html="sentence(said)"></p>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <template x-for="val in [true, false]" :key="val">
                <button
                  class="min-h-[60px] rounded-2xl border-[3px] text-2xl font-bold transition"
                  :class="chosen === null ? 'border-forest bg-white shadow-[0_4px_0_#e3edd6] active:translate-y-0.5'
                    : val === truth ? 'border-green-600 bg-green-50 text-green-800'
                    : val === chosen ? 'border-orange-400 bg-orange-50 text-orange-800 line-through'
                    : 'border-edge bg-white opacity-40'"
                  :disabled="chosen !== null"
                  @click="answer(val)"
                  x-text="val ? '✓ Yes' : '✗ No'"
                ></button>
              </template>
            </div>

            <div
              class="rounded-2xl border-2 px-4 py-2.5 text-lg"
              :class="chosen === truth ? 'border-green-600 bg-green-50' : 'border-orange-400 bg-orange-50'"
              x-show="chosen !== null"
              aria-live="polite"
            >
              <b class="font-display" x-text="chosen === truth ? cheer : 'Not quite.'"></b>
              <span x-html="sentence(sc)"></span>
            </div>
          </section>
        </template>

        <!-- ========== the end: score, wrong answers next to the right ones ========== -->
        <template x-if="done">
          <section class="flex flex-col gap-4" aria-live="polite">
            <div class="rounded-3xl border-2 border-edge bg-white px-4 py-5 text-center">
              <div class="text-5xl tracking-widest" aria-hidden="true">
                <template x-for="s in 3" :key="s"><span :class="s <= stars() ? '' : 'opacity-30 grayscale'">⭐</span></template>
              </div>
              <p class="mt-1 font-display text-5xl font-bold" x-text="score() + ' / ' + yn.length"></p>
              <p class="mt-2 text-lg" x-text="message()"></p>
            </div>

            <div class="flex flex-col gap-2" x-show="missed().length">
              <h2 class="font-display text-xl font-semibold">
                Look again <span class="rounded-full bg-orange-400 px-2 text-base text-white" x-text="missed().length"></span>
              </h2>
              <template x-for="(m, k) in missed()" :key="k">
                <div class="flex items-center gap-3 rounded-xl border-l-[6px] border-orange-400 bg-white p-2.5">
                  <div class="aspect-[4/3] w-24 flex-none overflow-hidden rounded-lg border-2 border-forest" x-html="pic(m.scene, true)"></div>
                  <div class="min-w-0 leading-snug">
                    <p class="font-bold" x-html="sentence(m.said)"></p>
                    <p class="text-orange-800">You said <s x-text="m.truth ? 'No' : 'Yes'"></s></p>
                    <p class="font-bold text-green-800">
                      <span x-text="m.truth ? '✓ Yes' : '✓ No.'"></span> <span x-show="!m.truth" x-html="sentence(m.scene)"></span>
                    </p>
                  </div>
                </div>
              </template>
            </div>

            <div class="flex flex-col gap-2">
              <h2 class="font-display text-xl font-semibold">Your 7 words</h2>
              <div class="grid grid-cols-4 gap-2">
                <template x-for="p in PRONOUNS" :key="p.id">
                  <button
                    class="rounded-xl border-2 border-edge bg-white px-1 py-2 text-center text-lg font-bold leading-tight"
                    :disabled="!AUDIO_READY"
                    @click="play(p.clip)"
                  ><span class="text-sky-700" x-text="p.id"></span> <span class="text-amber-700" x-text="p.be"></span></button>
                </template>
              </div>
            </div>

            <div class="mt-2 flex flex-col items-center gap-3">
              <button
                class="h-14 min-w-[230px] rounded-full bg-gold px-6 font-display text-xl font-semibold shadow-[0_5px_0_#e39b12] active:translate-y-0.5"
                x-show="missed().length"
                @click="startPractice()"
                x-text="'Practice these (' + missed().length + ')'"
              ></button>
              <button
                class="h-14 min-w-[230px] rounded-full px-6 font-display text-xl font-semibold active:translate-y-0.5"
                :class="missed().length ? 'bg-leaf/30 shadow-[0_5px_0_#8fc07e]' : 'bg-gold shadow-[0_5px_0_#e39b12]'"
                @click="go(0)"
              >↻ Start the lesson again</button>
            </div>
          </section>
        </template>
      </main>

      <!-- ---------- back / next ---------- -->
      <footer class="mt-5 flex items-center gap-3" x-show="!done">
        <button
          class="h-14 w-14 flex-none rounded-full border-2 border-edge bg-white text-2xl text-moss disabled:opacity-30"
          :disabled="step === 0 && i === 0"
          @click="back()"
          aria-label="Back"
        >←</button>
        <button
          class="h-14 flex-1 rounded-full bg-gold font-display text-xl font-semibold shadow-[0_5px_0_#e39b12] transition active:translate-y-0.5 disabled:opacity-40 disabled:shadow-none"
          :disabled="!canGoOn()"
          @click="main()"
          x-text="mainLabel()"
        ></button>
      </footer>
    </div>

    <script>
      /* =====================================================================
         I, YOU, HE, SHE 1 — the seven subject pronouns with am / is / are,
         one sentence frame: "___ am/is/are ___ing." (the verbs of Action Words 1)

         The five steps:
           1 Look and listen    picture + word + sentence ("he" beside "he is")
           2 Tap the picture    hear the word, find it among four pictures
           3 Swap the name      "The boy is running." -> tap He -> "He is running."
           4 Make the sentence  tap the word and its helper: I am, he is, they are
                                (blue = who, amber = am / is / are, red = action)
           5 Yes or no?         does the sentence match the picture?  -> score page

         ---------------------------------------------------------------------
         PICTURES — 14 files, IMG_DIR/1.jpg … 14.jpg, 4:3 (e.g. 1200×900).
         The same boy and girl as in Action Words 1. What matters is WHO is
         meant, so the pointing must be clear:
           I    = the child who speaks has a hand on his / her own chest
           you  = the speaker points at the friend facing him / her
           we   = two children together, hands on their own chests
           they = two OTHER children, a little way off, nobody pointing at themselves
            1 girl reading, hand on her chest               (I am reading.)
            2 girl pointing at the boy, who is jumping      (You are jumping.)
            3 boy running                                   (He is running.)
            4 girl drinking                                 (She is drinking.)
            5 dog sleeping                                  (It is sleeping.)
            6 boy and girl walking, hands on their chests   (We are walking.)
            7 two other children eating, a little way off   (They are eating.)
            8 boy drinking, hand on his chest               (I am drinking.)
            9 boy pointing at the girl, who is reading      (You are reading.)
           10 boy sleeping                                  (He is sleeping.)
           11 girl jumping                                  (She is jumping.)
           12 dog running                                   (It is running.)
           13 boy and girl eating, hands on their chests    (We are eating.)
           14 two other children walking, a little way off  (They are walking.)
         Pictures 3, 4, 5, 10, 11 and 12 can be the Action Words 1 pictures
         (1, 6, 15, 7, 2, 9). Every action comes twice with a different
         person, so step 5 can ask "It is running." under the running boy.
         When the files are uploaded, set IMAGES_READY = true.

         AUDIO — 26 clips, AUD_DIR/01.mp3 … 26.mp3.
           01–07  the word alone:  I · you · he · she · it · we · they
           08–21  the sentence for picture 1–14 (clip number = picture number + 7):
                  08 I am reading.        09 You are jumping.     10 He is running.
                  11 She is drinking.     12 It is sleeping.      13 We are walking.
                  14 They are eating.     15 I am drinking.       16 You are reading.
                  17 He is sleeping.      18 She is jumping.      19 It is running.
                  20 We are eating.       21 They are walking.
           22–26  the sentences with the name, for step 3:
                  22 The boy is running.            23 The girl is drinking.
                  24 The dog is sleeping.           25 My friend and I are walking.
                  26 The children are eating.
         When the clips are uploaded, set AUDIO_READY = true.

         While a switch is false the page never asks the server for those
         files, so no "not found" answer gets cached (4 hours on Cloudflare).
         ===================================================================== */
      const IMAGES_READY = false;
      const AUDIO_READY = false;

      const IMG_DIR = "/img/lessons/pronouns-1/";
      const IMG_EXT = "jpg";
      const AUD_DIR = "https://languages.rmlives.com/eng/lessons/pronouns-1/";
      const AUD_EXT = "mp3";

      /* who: blue in every lesson. Audio clip = position in this list (1–7).
         be = the helper word that goes with it (amber). */
      const PRONOUNS = [
        { id: "I", cap: "I", be: "am", my: "ကျွန်တော် / ကျွန်မ" },
        { id: "you", cap: "You", be: "are", my: "မင်း / သင်" },
        { id: "he", cap: "He", be: "is", my: "သူ" },
        { id: "she", cap: "She", be: "is", my: "သူမ" },
        { id: "it", cap: "It", be: "is", my: "အဲဒါ" },
        { id: "we", cap: "We", be: "are", my: "ကျွန်တော်တို့ / ကျွန်မတို့" },
        { id: "they", cap: "They", be: "are", my: "သူတို့" },
      ];
      PRONOUNS.forEach((p, k) => (p.clip = k + 1));
      const BE = ["am", "is", "are"];

      /* the action words of Action Words 1 (red) */
      const VERBS = {
        read: { ing: "reading", myIng: "စာဖတ်နေတယ်" },
        jump: { ing: "jumping", myIng: "ခုန်နေတယ်" },
        run: { ing: "running", myIng: "ပြေးနေတယ်" },
        drink: { ing: "drinking", myIng: "ရေသောက်နေတယ်" },
        sleep: { ing: "sleeping", myIng: "အိပ်နေတယ်" },
        walk: { ing: "walking", myIng: "လမ်းလျှောက်နေတယ်" },
        eat: { ing: "eating", myIng: "စားနေတယ်" },
      };

      /* one line per picture, in picture order:
         [pronoun, action, who says it in Burmese, what the picture shows] */
      const SCENES = [
        ["I", "read", "ကျွန်မ", "girl reading, hand on her chest"],
        ["you", "jump", "မင်း", "girl points at the jumping boy"],
        ["he", "run", "သူ", "boy running"],
        ["she", "drink", "သူမ", "girl drinking"],
        ["it", "sleep", "အဲဒါ", "dog sleeping"],
        ["we", "walk", "ကျွန်မတို့", "boy and girl walking, hands on chests"],
        ["they", "eat", "သူတို့", "two other children eating"],
        ["I", "drink", "ကျွန်တော်", "boy drinking, hand on his chest"],
        ["you", "read", "မင်း", "boy points at the reading girl"],
        ["he", "sleep", "သူ", "boy sleeping"],
        ["she", "jump", "သူမ", "girl jumping"],
        ["it", "run", "အဲဒါ", "dog running"],
        ["we", "eat", "ကျွန်တော်တို့", "boy and girl eating, hands on chests"],
        ["they", "walk", "သူတို့", "two other children walking"],
      ].map(([p, v, myWho, desc], k) => {
        const pron = PRONOUNS.find((x) => x.id === p);
        const verb = Object.assign({ id: v }, VERBS[v]);
        return {
          n: k + 1, // picture number
          clip: k + 8, // sentence audio
          pron,
          verb,
          text: pron.cap + " " + pron.be + " " + verb.ing + ".",
          my: myWho + " " + verb.myIng + "။",
          desc,
        };
      });
      const LEARN = SCENES.slice(0, 7); // steps 1–3: one picture per word
      const SWAP = SCENES.slice(7); // step 4: the same words, other actions

      /* step 3: a name (or names) and the picture whose short word replaces it */
      const NAMES = [
        { text: "The boy", pic: 3, clip: 22 },
        { text: "The girl", pic: 4, clip: 23 },
        { text: "The dog", pic: 5, clip: 24 },
        { text: "My friend and I", pic: 6, clip: 25 },
        { text: "The children", pic: 7, clip: 26 },
      ];
      const NAME_CHOICES = PRONOUNS.filter((p) => ["he", "she", "it", "we", "they"].includes(p.id));

      const STEPS = [
        { icon: "👀", en: "Look and listen", my: "ကြည့်ပြီး နားထောင်ပါ" },
        { icon: "👆", en: "Tap the picture", my: "ပုံကို နှိပ်ပါ" },
        { icon: "🔁", en: "Swap the name", my: "နာမ်စား ရွေးပါ" },
        { icon: "🧩", en: "Make the sentence", my: "ဝါကျ တည်ဆောက်ပါ" },
        { icon: "✅", en: "Yes or no?", my: "မှန်သလား၊ မှားသလား" },
      ];
      const CHEERS = ["Great job!", "Well done!", "Yes!", "Super!", "You got it!"];

      function shuffle(a) {
        a = a.slice();
        for (let k = a.length - 1; k > 0; k--) {
          const j = Math.floor(Math.random() * (k + 1));
          [a[k], a[j]] = [a[j], a[k]];
        }
        return a;
      }

      /* ---------------- audio: one clip at a time, nothing fetched until AUDIO_READY ---------------- */
      let player = null;
      function play(n) {
        if (!AUDIO_READY) return;
        if (player) player.pause();
        player = new Audio(AUD_DIR + String(n).padStart(2, "0") + "." + AUD_EXT);
        player.play().catch(() => {});
      }

      const SPK_ICON =
        '<svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

      /* Alpine wraps the state in proxies: always compare by number (n) or word (id), never by object. */
      function lesson() {
        return {
          IMAGES_READY,
          AUDIO_READY,
          STEPS,
          PRONOUNS,
          NAME_CHOICES,
          BE,
          SPK_ICON,
          SPK: "flex h-14 w-14 flex-none items-center justify-center rounded-full bg-gold text-forest shadow-[0_4px_0_#e39b12] active:translate-y-0.5 disabled:opacity-35 disabled:shadow-none",

          showMy: true,
          step: 0,
          i: 0,
          rounds: LEARN,
          sc: LEARN[0], // the scene in the picture
          name: NAMES[0], // step 3: the name to swap
          cheer: "",
          shaking: null,
          /* steps 2 and 3 */
          opts: [],
          wrong: [],
          solved: false,
          /* step 4 */
          gotS: false,
          gotB: false,
          /* step 5 */
          yn: [],
          said: LEARN[0], // the sentence shown (may not match the picture)
          truth: true,
          chosen: null,
          results: [],
          practice: false,
          done: false,

          init() {
            this.go(0);
          },

          /* ---------- moving about ---------- */
          go(s) {
            this.step = s;
            this.i = 0;
            this.done = false;
            this.practice = false;
            if (s === 0) this.rounds = LEARN;
            if (s === 1) this.rounds = shuffle(LEARN);
            if (s === 2) this.rounds = shuffle(NAMES);
            if (s === 3) this.rounds = shuffle(SWAP);
            if (s === 4) {
              this.yn = this.makeYesNo();
              this.results = [];
            }
            this.load();
          },
          total() {
            return this.step === 4 ? this.yn.length : this.rounds.length;
          },
          load() {
            this.solved = false;
            this.wrong = [];
            this.shaking = null;
            this.gotS = this.gotB = false;
            this.chosen = null;
            this.cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];

            if (this.step === 4) {
              const q = this.yn[this.i];
              this.sc = q.scene;
              this.said = q.said;
              this.truth = q.truth;
              play(q.said.clip);
            } else if (this.step === 2) {
              this.name = this.rounds[this.i];
              this.sc = SCENES[this.name.pic - 1];
              play(this.name.clip);
            } else {
              const sc = (this.sc = this.rounds[this.i]);
              if (this.step === 1) this.opts = shuffle([sc, ...shuffle(LEARN.filter((x) => x.n !== sc.n)).slice(0, 3)]);
              if (this.step < 2) play(sc.pron.clip);
            }
            window.scrollTo(0, 0);
          },
          canGoOn() {
            if (this.step === 1 || this.step === 2) return this.solved;
            if (this.step === 3) return this.gotS && this.gotB;
            if (this.step === 4) return this.chosen !== null;
            return true;
          },
          mainLabel() {
            if (this.i + 1 < this.total()) return "Next →";
            if (this.step === 4) return this.practice ? "Finish" : "See my score";
            return "Next: " + STEPS[this.step + 1].en + " →";
          },
          main() {
            if (this.i + 1 < this.total()) {
              this.i++;
              this.load();
            } else if (this.step < 4) this.go(this.step + 1);
            else {
              this.done = true;
              window.scrollTo(0, 0);
            }
          },
          back() {
            if (this.i > 0) {
              this.i--;
              this.load();
            } else if (this.step > 0) this.go(this.step - 1);
          },
          wobble(id) {
            this.shaking = null;
            this.$nextTick(() => {
              this.shaking = id;
              setTimeout(() => {
                if (this.shaking === id) this.shaking = null;
              }, 450);
            });
          },

          /* ---------- step 2 ---------- */
          pickPic(o) {
            if (o.n === this.sc.n) {
              this.solved = true;
              play(this.sc.clip);
            } else {
              this.wobble(o.n);
              setTimeout(() => this.wrong.push(o.n), 400);
            }
          },

          /* ---------- step 3 ---------- */
          pickName(p) {
            if (p.id === this.sc.pron.id) {
              this.solved = true;
              play(this.sc.clip);
            } else {
              this.wobble(p.id);
              setTimeout(() => this.wrong.push(p.id), 400);
            }
          },

          /* ---------- step 4 ---------- */
          pickPronoun(p) {
            if (p.id === this.sc.pron.id) this.gotS = true;
            else this.wobble(p.id);
            this.checkBuilt();
          },
          pickBe(b) {
            if (b === this.sc.pron.be) this.gotB = true;
            else this.wobble(b);
            this.checkBuilt();
          },
          checkBuilt() {
            if (this.gotS && this.gotB) play(this.sc.clip);
          },

          /* ---------- step 5 ---------- */
          /* Eight pictures; four get their own sentence, four get the other
             sentence with the same action ("It is running." under the running
             boy), so every sentence has a clip. */
          makeYesNo() {
            const truths = shuffle([true, true, true, true, false, false, false, false]);
            return shuffle(SCENES)
              .slice(0, 8)
              .map((scene, k) => {
                const truth = truths[k];
                const liar = SCENES.find((x) => x.verb.id === scene.verb.id && x.n !== scene.n);
                return { scene, truth, said: truth ? scene : liar };
              });
          },
          answer(val) {
            this.chosen = val;
            this.results[this.i] = val === this.truth;
          },
          score() {
            return this.results.filter((r) => r === true).length;
          },
          missed() {
            return this.yn.filter((q, k) => this.results[k] === false);
          },
          startPractice() {
            this.yn = this.missed();
            this.results = [];
            this.practice = true;
            this.i = 0;
            this.done = false;
            this.load();
          },
          stars() {
            const p = this.score() / this.yn.length;
            return p >= 0.9 ? 3 : p >= 0.6 ? 2 : 1;
          },
          message() {
            if (this.practice) return this.missed().length ? "Keep going. Try these once more." : "You got them all this time!";
            const s = this.stars();
            return s === 3 ? "Excellent! You know I, you, he, she, it, we and they." : s === 2 ? "Good work! Do the lesson again tomorrow." : "Good try! Go back to step 1 and listen again.";
          },

          /* ---------- drawing ---------- */
          play,
          /* "He is running." with who in blue, the helper in amber and the action in red */
          sentence(sc) {
            return (
              '<span class="text-sky-700">' + sc.pron.cap + '</span> <span class="text-amber-700">' + sc.pron.be +
              '</span> <span class="text-rose-600">' + sc.verb.ing + "</span>."
            );
          },
          /* the picture, or a labelled box until the picture exists */
          pic(sc, small) {
            if (IMAGES_READY) return '<img src="' + IMG_DIR + sc.n + "." + IMG_EXT + '" alt="" class="block h-full w-full object-cover" />';
            return (
              '<div class="flex h-full w-full flex-col items-center justify-center gap-1 bg-[repeating-linear-gradient(45deg,#fff,#fff_12px,#f1f6ea_12px,#f1f6ea_24px)] p-1 text-center text-moss">' +
              (small ? "" : '<svg viewBox="0 0 24 24" class="h-10 w-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-5-5-8.5 9"/></svg>') +
              '<span class="font-display font-semibold ' + (small ? "text-sm" : "text-lg") + '">' + sc.n + "." + IMG_EXT + "</span>" +
              '<span class="' + (small ? "text-xs leading-tight" : "text-base") + ' font-bold text-forest">' + sc.desc + "</span>" +
              "</div>"
            );
          },
        };
      }
    </script>
    <script src="/assets/js/alpine.min.js"></script>
  </body>
</html>
