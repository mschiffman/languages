<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Storybook</title>
    <meta name="description" content="Tap any phrase to hear it read aloud." />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#274b2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Storybook" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <main class="library">
      <div class="library-head">
        <div>
          <h1>
            <svg class="leaf-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
              <path
                d="M8 16C11 12 14 9 18 7"
                stroke="#274B2F"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            Storybook
          </h1>
          <p>Pick a story. Tap any phrase to hear it read aloud.</p>
        </div>
        <div class="head-right">
          <span class="pill" id="netdot">Online</span>
        </div>
      </div>

      <ul class="shelf" id="shelf"></ul>

      <div class="library-foot">
        <span id="footnote">Stories you save stay on this tablet.</span>
        <button id="install" hidden>Add to home screen</button>
      </div>
    </main>

    <script src="js/stories.js"></script>
    <script src="js/covers.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
