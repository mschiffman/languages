<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Storybook</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#274b2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body class="reader">
    <div class="stage">
      <header>
        <a class="round home-btn" id="home" href="index.html" aria-label="Back to all stories">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3.6 11.2 12 4l8.4 7.2"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.8 10.2V19a1 1 0 0 0 1 1h3.4v-4.6h3.6V20h3.4a1 1 0 0 0 1-1v-8.8"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>

        <div class="brand">
          <svg class="leaf-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="currentColor" opacity=".5" />
            <path
              d="M8 16C11 12 14 9 18 7"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <span id="title">Story</span>
        </div>

        <div class="pill" id="counter">1 / 1</div>
      </header>

      <div class="viewport">
        <div class="track" id="track"></div>
      </div>

      <footer>
        <button class="round" id="prev" aria-label="Previous page">&#8592;</button>
        <button class="play-page" id="playPage" aria-label="Play this page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5v14l12-7z" fill="currentColor" />
          </svg>
          <span id="playLabel">Play page</span>
        </button>
        <button class="round" id="next" aria-label="Next page">&#8594;</button>
      </footer>
    </div>

    <script src="js/stories.js"></script>
    <script src="js/reader.js"></script>
  </body>
</html>
