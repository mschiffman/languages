  /* ---- palette drawn from the story's forest world ---- */
  :root{
    --paper:#F1F6EA;        /* pale leaf-paper */
    --paper-edge:#E3EDD6;
    --forest:#274B2F;       /* deep forest green – frame & text */
    --forest-soft:#3C6B45;
    --leaf:#8FC07E;         /* tappable affordance */
    --leaf-tint:#E4F0D8;    /* chunk resting background */
    --gold:#F6B93B;         /* the lion – active / playing */
    --gold-deep:#E39B12;
    --bark:#8A5A2B;
    --shadow: 20px 20px 0 rgba(39,75,47,.07);
    --reading: clamp(1.35rem, 5.6vw, 2.05rem);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Andika','Segoe UI',system-ui,sans-serif;
    color:var(--forest);
    background:
      radial-gradient(120% 80% at 50% 0%, #F7FBF0 0%, var(--paper) 55%, var(--paper-edge) 100%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  .stage{
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ---- top bar ---- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.6rem;
    padding:.7rem 1.1rem .5rem;
  }
  .brand{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(1rem,4.4vw,1.35rem);
    letter-spacing:.2px;
    line-height:1;
    display:flex;align-items:center;gap:.4rem;
  }
  .brand .lion{color:var(--gold-deep);}
  .brand .mouse{color:var(--bark);}
  .leaf-mark{width:1.1em;height:1.1em;flex:0 0 auto;}
  .counter{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:1rem;
    color:var(--forest-soft);
    background:var(--paper);
    border:2px solid var(--paper-edge);
    border-radius:999px;
    padding:.25rem .8rem;
    white-space:nowrap;
  }

  /* ---- swipe track ---- */
  .viewport{flex:1 1 auto;overflow:hidden;position:relative;}
  .track{
    display:flex;
    height:100%;
    transition:transform .42s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .leaf-page{
    flex:0 0 100%;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:0 1.1rem .4rem;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  /* ---- illustration ---- */
  .art{
    flex:0 0 auto;
    background:#fff;
    border:3px solid var(--forest);
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
    aspect-ratio:4 / 3;
    max-height:46dvh;
    display:flex;align-items:center;justify-content:center;
    margin-top:.2rem;
  }
  .art img{width:100%;height:100%;object-fit:contain;display:block;}
  .art .missing{
    color:var(--leaf);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    text-align:center;
    padding:1rem;
    line-height:1.4;
  }
  .art .missing b{display:block;font-size:2.4rem;color:var(--forest-soft);}

  /* ---- reading text ---- */
  .read{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:.55rem;
    padding:1.5rem .2rem .4rem;
  }
  .sentence{
    margin:0;
    font-size:var(--reading);
    line-height:1.5;
    display:flex;
    flex-wrap:wrap;
    gap:.35em .3em;
  }
  .chunk{
    display:inline-block;
    padding:.06em .34em;
    border-radius:.55em;
    background:var(--leaf-tint);
    box-shadow:inset 0 -2px 0 rgba(143,192,126,.55);
    cursor:pointer;
    color:var(--forest);
    transition:background .15s ease, transform .12s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .chunk:hover{background:#d7ebc5;}
  .chunk:focus-visible{outline:3px solid var(--forest-soft);outline-offset:2px;}
  .chunk:active{transform:translateY(1px) scale(.99);}
  .chunk.playing{
    background:var(--gold);
    box-shadow:inset 0 -3px 0 var(--gold-deep), 0 4px 12px rgba(227,155,18,.35);
    transform:translateY(-1px);
  }

  /* ---- bottom controls ---- */
  footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.7rem;
    padding:.55rem 1.1rem .3rem;
  }
  .nav{
    width:56px;height:56px;flex:0 0 auto;
    border:3px solid var(--forest);
    border-radius:50%;
    background:var(--paper);
    color:var(--forest);
    font-size:1.5rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, opacity .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .nav:hover{background:#fff;}
  .nav:active{transform:scale(.92);}
  .nav:disabled{opacity:.3;cursor:default;}
  .nav:focus-visible{outline:3px solid var(--forest-soft);outline-offset:3px;}

  .play-page{
    flex:1 1 auto;
    max-width:260px;
    height:56px;
    border:none;
    border-radius:999px;
    background:var(--gold);
    color:var(--forest);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:1.15rem;
    display:flex;align-items:center;justify-content:center;gap:.5rem;
    cursor:pointer;
    box-shadow:0 5px 0 var(--gold-deep);
    transition:transform .1s ease, box-shadow .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .play-page:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep);}
  .play-page:focus-visible{outline:3px solid var(--forest);outline-offset:3px;}
  .play-page svg{width:1.15em;height:1.15em;}
  .play-page.stopmode{background:#EBD9B6;box-shadow:0 5px 0 #cbb488;}

  @media (max-width:400px){
    .nav{width:50px;height:50px;font-size:1.35rem;}
    .play-page{height:50px;font-size:1.05rem;}
  }
  @media (prefers-reduced-motion:reduce){
    .track{transition:none;}
    .chunk,.nav,.play-page{transition:none;}
  }
</style>

/* pages -> sentences -> chunks. Audio numbers run 1..24 in order. */
const pages = [
  { img:1, sentences:[
      [["A lion was sleeping",1],["in the forest.",2]],
      [["A little mouse",3],["ran over his paw.",4]],
  ]},
  { img:2, sentences:[
      [["The lion woke up.",5]],
      [["He caught the mouse.",6]],
  ]},
  { img:3, sentences:[
      [['"Please let me go,"',7],["said the mouse.",8]],
      [['"One day,',9],['I can help you."',10]],
  ]},
  { img:4, sentences:[
      [["The lion laughed but",11],["he let the mouse go.",12]],
  ]},
  { img:5, sentences:[
      [["Later, the lion was caught",13],["in a hunter's net.",14]],
  ]},
  { img:6, sentences:[
      [["The mouse heard",15],["the lion roar.",16]],
      [["He ran to help.",17]],
  ]},
  { img:7, sentences:[
      [["The mouse bit the ropes",18],["with his sharp teeth.",19]],
      [["Soon the lion was free.",20]],
  ]},
  { img:8, sentences:[
      [["The lion said,",21],['"Thank you, little mouse."',22]],
      [["Even a small friend",23],["can help a big friend.",24]],
  ]},
];

const pad = n => String(n).padStart(2,"0");
const track   = document.getElementById("track");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const playBtn = document.getElementById("playPage");
const playLabel = document.getElementById("playLabel");

let current = 0;

/* ---- build the pages ---- */
pages.forEach((page, i) => {
  const el = document.createElement("section");
  el.className = "leaf-page";

  const art = document.createElement("div");
  art.className = "art";
  const img = new Image();
  const _imgf=`${page.img}.${IMG_EXT}`; img.src = EMBED[_imgf] || `${IMG_DIR}${_imgf}`;
  img.alt = `Illustration for page ${i+1}`;
  img.onerror = () => {
    art.innerHTML = `<div class="missing"><b>${page.img}.${IMG_EXT}</b>illustration goes here</div>`;
  };
  art.appendChild(img);
  el.appendChild(art);

  const read = document.createElement("div");
  read.className = "read";
  page.sentences.forEach(sentence => {
    const p = document.createElement("p");
    p.className = "sentence";
    sentence.forEach(([text, num]) => {
      const span = document.createElement("span");
      span.className = "chunk";
      span.textContent = text;
      span.dataset.audio = pad(num);
      span.setAttribute("role","button");
      span.setAttribute("tabindex","0");
      span.setAttribute("aria-label",`Play: ${text}`);
      span.addEventListener("click", () => playChunk(span));
      span.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playChunk(span); }
      });
      p.appendChild(span);
    });
    read.appendChild(p);
  });
  el.appendChild(read);
  track.appendChild(el);
});

/* ---- audio engine (single reusable element) ---- */
const player = new Audio();
let activeChunk = null;
let sequence = null;   // array of chunk elements when playing a whole page

function clearActive(){
  if (activeChunk){ activeChunk.classList.remove("playing"); activeChunk = null; }
}
function stopAll(){
  player.pause();
  player.onended = null;
  sequence = null;
  clearActive();
  setPlayButton(false);
}
function playFile(num){
  player.pause();
  player.currentTime = 0;
  const _audf=`${num}.${AUD_EXT}`;
  player.src = EMBED[_audf] || `${AUD_DIR}${_audf}`;
  const p = player.play();
  if (p && p.catch) p.catch(()=>{}); // ignore if file not present yet
}
function playChunk(span){
  if (sequence) stopAll();          // a single tap cancels page-playback
  else { player.onended = clearActive; }
  clearActive();
  activeChunk = span;
  span.classList.add("playing");
  playFile(span.dataset.audio);
}

/* ---- play the whole page in order ---- */
function setPlayButton(playing){
  playBtn.classList.toggle("stopmode", playing);
  playLabel.textContent = playing ? "Stop" : "Play page";
  playBtn.setAttribute("aria-label", playing ? "Stop" : "Play this page");
}
function playPage(){
  if (sequence){ stopAll(); return; }
  const chunks = [...track.children[current].querySelectorAll(".chunk")];
  if (!chunks.length) return;
  sequence = chunks;
  setPlayButton(true);
  let idx = 0;
  const step = () => {
    if (!sequence || idx >= sequence.length){ stopAll(); return; }
    clearActive();
    activeChunk = sequence[idx];
    activeChunk.classList.add("playing");
    activeChunk.scrollIntoView({block:"nearest", behavior:"smooth"});
    player.onended = () => { idx++; step(); };
    playFile(sequence[idx].dataset.audio);
  };
  step();
}
playBtn.addEventListener("click", playPage);

/* ---- navigation ---- */
function goTo(i){
  current = Math.max(0, Math.min(pages.length-1, i));
  track.style.transform = `translateX(-${current*100}%)`;
  counter.textContent = `${current+1} / ${pages.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length-1;
  stopAll();
}
prevBtn.addEventListener("click", ()=>goTo(current-1));
nextBtn.addEventListener("click", ()=>goTo(current+1));
document.addEventListener("keydown", e=>{
  if (e.key==="ArrowLeft")  goTo(current-1);
  if (e.key==="ArrowRight") goTo(current+1);
});

/* ---- touch swipe ---- */
let x0=null, y0=null;
track.addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
track.addEventListener("touchend", e=>{
  if (x0===null) return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if (Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4){ goTo(current - Math.sign(dx)); }
  x0=y0=null;
}, {passive:true});

goTo(0);
</script>
