      /* ---- palette drawn from the story's forest world ---- */
      :root {
        --paper: #f1f6ea; /* pale leaf-paper */
        --paper-edge: #e3edd6;
        --forest: #274b2f; /* deep forest green – frame & text */
        --forest-soft: #3c6b45;
        --leaf: #8fc07e; /* tappable affordance */
        --leaf-tint: #e4f0d8; /* chunk resting background */
        --gold: #f6b93b; /* the lion – active / playing */
        --gold-deep: #e39b12;
        --bark: #8a5a2b;
        --shadow: 20px 20px 0 rgba(39, 75, 47, 0.07);
        --reading: clamp(1.35rem, 5.6vw, 2.05rem);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Andika", "Segoe UI", system-ui, sans-serif;
        color: var(--forest);
        background: radial-gradient(
          120% 80% at 50% 0%,
          #f7fbf0 0%,
          var(--paper) 55%,
          var(--paper-edge) 100%
        );
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      .stage {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 720px;
        margin: 0 auto;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }

      /* ---- top bar ---- */
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.7rem 1.1rem 0.5rem;
      }
      .brand {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: clamp(1rem, 4.4vw, 1.35rem);
        letter-spacing: 0.2px;
        line-height: 1;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .brand .lion {
        color: var(--gold-deep);
      }
      .brand .mouse {
        color: var(--bark);
      }
      .leaf-mark {
        width: 1.1em;
        height: 1.1em;
        flex: 0 0 auto;
      }
      .counter {
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        color: var(--forest-soft);
        background: var(--paper);
        border: 2px solid var(--paper-edge);
        border-radius: 999px;
        padding: 0.25rem 0.8rem;
        white-space: nowrap;
      }

      /* ---- swipe track ---- */
      .viewport {
        flex: 1 1 auto;
        overflow: hidden;
        position: relative;
      }
      .track {
        display: flex;
        height: 100%;
        transition: transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: transform;
      }
      .leaf-page {
        flex: 0 0 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 1.1rem 0.4rem;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ---- illustration ---- */
      .art {
        flex: 0 0 auto;
        background: #fff;
        border: 3px solid var(--forest);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
        aspect-ratio: 4 / 3;
        max-height: 46dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 0.2rem;
      }
      .art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .art .missing {
        color: var(--leaf);
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        text-align: center;
        padding: 1rem;
        line-height: 1.4;
      }
      .art .missing b {
        display: block;
        font-size: 2.4rem;
        color: var(--forest-soft);
      }

      /* ---- reading text ---- */
      .read {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 0.55rem;
        padding: 1.5rem 0.2rem 0.4rem;
      }
      .sentence {
        margin: 0;
        font-size: var(--reading);
        line-height: 1.5;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35em 0.3em;
      }
      .chunk {
        display: inline-block;
        padding: 0.06em 0.34em;
        border-radius: 0.55em;
        background: var(--leaf-tint);
        box-shadow: inset 0 -2px 0 rgba(143, 192, 126, 0.55);
        cursor: pointer;
        color: var(--forest);
        transition:
          background 0.15s ease,
          transform 0.12s ease,
          box-shadow 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .chunk:hover {
        background: #d7ebc5;
      }
      .chunk:focus-visible {
        outline: 3px solid var(--forest-soft);
        outline-offset: 2px;
      }
      .chunk:active {
        transform: translateY(1px) scale(0.99);
      }
      .chunk.playing {
        background: var(--gold);
        box-shadow:
          inset 0 -3px 0 var(--gold-deep),
          0 4px 12px rgba(227, 155, 18, 0.35);
        transform: translateY(-1px);
      }

      /* ---- bottom controls ---- */
      footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.7rem;
        padding: 0.55rem 1.1rem 0.3rem;
      }
      .nav {
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
        border: 3px solid var(--forest);
        border-radius: 50%;
        background: var(--paper);
        color: var(--forest);
        font-size: 1.5rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.15s ease,
          opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .nav:hover {
        background: #fff;
      }
      .nav:active {
        transform: scale(0.92);
      }
      .nav:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .nav:focus-visible {
        outline: 3px solid var(--forest-soft);
        outline-offset: 3px;
      }

      .play-page {
        flex: 1 1 auto;
        max-width: 260px;
        height: 56px;
        border: none;
        border-radius: 999px;
        background: var(--gold);
        color: var(--forest);
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 1.15rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--gold-deep);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .play-page:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--gold-deep);
      }
      .play-page:focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: 3px;
      }
      .play-page svg {
        width: 1.15em;
        height: 1.15em;
      }
      .play-page.stopmode {
        background: #ebd9b6;
        box-shadow: 0 5px 0 #cbb488;
      }

      @media (max-width: 400px) {
        .nav {
          width: 50px;
          height: 50px;
          font-size: 1.35rem;
        }
        .play-page {
          height: 50px;
          font-size: 1.05rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .track {
          transition: none;
        }
        .chunk,
        .nav,
        .play-page {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <header>
        <div class="brand">
          <svg class="leaf-mark" viewBox="0 0 24 24" fill="none">
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
            <path
              d="M8 16C11 12 14 9 18 7"
              stroke="#274B2F"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <span>Where Are My Shoes?</span>
        </div>
        <div class="counter" id="counter">1 / 7</div>
      </header>

      <div class="viewport">
        <div class="track" id="track"></div>
      </div>

      <footer>
        <button class="nav" id="prev" aria-label="Previous page">
          &#8592;
        </button>
        <button class="play-page" id="playPage" aria-label="Play this page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5v14l12-7z" fill="currentColor" />
          </svg>
          <span id="playLabel">Play page</span>
        </button>
        <button class="nav" id="next" aria-label="Next page">&#8594;</button>
      </footer>
    </div>

    <script>
      /* ---------------------------------------------------------------
   Media lives next to this file:
     images : 1.jpg  … 7.jpg   (one per book page)
     audio  : 01.mp3 … 22.mp3  (one per phrase, in reading order)
   To use a subfolder, set IMG_DIR / AUD_DIR below (e.g. "media/").
--------------------------------------------------------------- */
      const IMG_DIR = "img/";
      const AUD_DIR = "audio/";
      const IMG_EXT = "jpg";
      const AUD_EXT = "mp3";
      const EMBED = {}; /*__INLINE_ASSETS__*/

      /* pages -> sentences -> chunks. Audio numbers run 1..22 in order. */
      const pages = [
        {
          img: 1,
          sentences: [
            [["I’m almost ready.", 1]],
            [["I have my bag.", 2]],
            [["But where are my shoes?", 3]],
          ],
        },
        {
          img: 2,
          sentences: [
            [["Where are my shoes?", 4]],
            [["I can’t find them.", 5]],
            [["I look everywhere.", 6]],
          ],
        },
        {
          img: 3,
          sentences: [
            [["Are they under the bed?", 7]],
            [["I look under the bed.", 8]],
            [["No, they’re not.", 9]],
          ],
        },
        {
          img: 4,
          sentences: [
            [["Are they in the closet?", 10]],
            [["I look in the closet.", 11]],
            [["No shoes!", 12]],
          ],
        },
        {
          img: 5,
          sentences: [
            [["Mom, I can’t find my shoes!", 13]],
            [["Let’s look together.", 14]],
            [["Are they by the door?", 15]],
          ],
        },
        {
          img: 6,
          sentences: [
            [["Look!", 16]],
            [["Here they are!", 17]],
            [["I found my shoes!", 18]],
          ],
        },
        {
          img: 7,
          sentences: [
            [["I put on my shoes.", 19]],
            [["Now I’m ready!", 20]],
            [["Let’s go!", 21]],
          ],
        },
      ];

      const pad = (n) => String(n).padStart(2, "0");
      const track = document.getElementById("track");
      const counter = document.getElementById("counter");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const playBtn = document.getElementById("playPage");
      const playLabel = document.getElementById("playLabel");

      let current = 0;

      /* ---- build the pages ---- */
      pages.forEach((page, i) => {
        const el = document.createElement("section");
        el.className = "leaf-page";

        const art = document.createElement("div");
        art.className = "art";
        const img = new Image();
        const _imgf = `${page.img}.${IMG_EXT}`;
        img.src = EMBED[_imgf] || `${IMG_DIR}${_imgf}`;
        img.alt = `Illustration for page ${i + 1}`;
        img.onerror = () => {
          art.innerHTML = `<div class="missing"><b>${page.img}.${IMG_EXT}</b>illustration goes here</div>`;
        };
        art.appendChild(img);
        el.appendChild(art);

        const read = document.createElement("div");
        read.className = "read";
        page.sentences.forEach((sentence) => {
          const p = document.createElement("p");
          p.className = "sentence";
          sentence.forEach(([text, num]) => {
            const span = document.createElement("span");
            span.className = "chunk";
            span.textContent = text;
            span.dataset.audio = pad(num);
            span.setAttribute("role", "button");
            span.setAttribute("tabindex", "0");
            span.setAttribute("aria-label", `Play: ${text}`);
            span.addEventListener("click", () => playChunk(span));
            span.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                playChunk(span);
              }
            });
            p.appendChild(span);
          });
          read.appendChild(p);
        });
        el.appendChild(read);
        track.appendChild(el);
      });

      /* ---- audio engine (single reusable element) ---- */
      const player = new Audio();
      let activeChunk = null;
      let sequence = null; // array of chunk elements when playing a whole page

      function clearActive() {
        if (activeChunk) {
          activeChunk.classList.remove("playing");
          activeChunk = null;
        }
      }
      function stopAll() {
        player.pause();
        player.onended = null;
        sequence = null;
        clearActive();
        setPlayButton(false);
      }
      function playFile(num) {
        player.pause();
        player.currentTime = 0;
        const _audf = `${num}.${AUD_EXT}`;
        player.src = EMBED[_audf] || `${AUD_DIR}${_audf}`;
        const p = player.play();
        if (p && p.catch) p.catch(() => {}); // ignore if file not present yet
      }
      function playChunk(span) {
        if (sequence)
          stopAll(); // a single tap cancels page-playback
        else {
          player.onended = clearActive;
        }
        clearActive();
        activeChunk = span;
        span.classList.add("playing");
        playFile(span.dataset.audio);
      }

      /* ---- play the whole page in order ---- */
      function setPlayButton(playing) {
        playBtn.classList.toggle("stopmode", playing);
        playLabel.textContent = playing ? "Stop" : "Play page";
        playBtn.setAttribute("aria-label", playing ? "Stop" : "Play this page");
      }
      function playPage() {
        if (sequence) {
          stopAll();
          return;
        }
        const chunks = [...track.children[current].querySelectorAll(".chunk")];
        if (!chunks.length) return;
        sequence = chunks;
        setPlayButton(true);
        let idx = 0;
        const step = () => {
          if (!sequence || idx >= sequence.length) {
            stopAll();
            return;
          }
          clearActive();
          activeChunk = sequence[idx];
          activeChunk.classList.add("playing");
          activeChunk.scrollIntoView({ block: "nearest", behavior: "smooth" });
          player.onended = () => {
            idx++;
            step();
          };
          playFile(sequence[idx].dataset.audio);
        };
        step();
      }
      playBtn.addEventListener("click", playPage);

      /* ---- navigation ---- */
      function goTo(i) {
        current = Math.max(0, Math.min(pages.length - 1, i));
        track.style.transform = `translateX(-${current * 100}%)`;
        counter.textContent = `${current + 1} / ${pages.length}`;
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === pages.length - 1;
        stopAll();
      }
      prevBtn.addEventListener("click", () => goTo(current - 1));
      nextBtn.addEventListener("click", () => goTo(current + 1));
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") goTo(current - 1);
        if (e.key === "ArrowRight") goTo(current + 1);
      });

      /* ---- touch swipe ---- */
      let x0 = null,
        y0 = null;
      track.addEventListener(
        "touchstart",
        (e) => {
          x0 = e.touches[0].clientX;
          y0 = e.touches[0].clientY;
        },
        { passive: true },
      );
      track.addEventListener(
        "touchend",
        (e) => {
          if (x0 === null) return;
          const dx = e.changedTouches[0].clientX - x0,
            dy = e.changedTouches[0].clientY - y0;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            goTo(current - Math.sign(dx));
          }
          x0 = y0 = null;
        },
        { passive: true },
      );

      goTo(0);
    </script>
  </body>
</html>
