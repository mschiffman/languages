<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Good, Better, Best</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>

      function gtag() {

      }
      gtag("js", new Date());
      gtag("config", "G-CHXHM9CZKM");
    </script>

    <link href="/img/favicon.png" rel="icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&family=Noto+Sans+Myanmar:wght@400&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Same colours and fonts as the story pages (ytstory.css). */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: "#f1f6ea",
              edge: "#e3edd6",
              forest: "#274b2f",
              moss: "#3c6b45",
              leaf: "#8fc07e",
              gold: "#f6b93b",
              golddeep: "#e39b12",
            },
            fontFamily: {
              display: ["Fredoka", "sans-serif"],
              body: ["Andika", "Segoe UI", "system-ui", "sans-serif"],
              my: ["Noto Sans Myanmar", "Padauk", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      .shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-6px);
        }
        40%,
        80% {
          transform: translateX(6px);
        }
      }
      /* empty slot in "Make the sentence" */
      .slot {
        display: inline-block;
        min-width: 3.2em;
        border-bottom: 4px solid currentColor;
        text-align: center;
        line-height: 1.2;
      }
    </style>
  </head>

  <body class="bg-edge font-body text-forest antialiased">
    <div
      class="mx-auto flex min-h-screen max-w-xl flex-col bg-paper px-4 pb-5"
      x-data="lesson()"
      x-cloak
    >
      <!-- ---------- title ---------- -->
      <a
        class="mt-2 inline-flex min-h-[2rem] items-center gap-1 self-start rounded-full py-0.5 pl-1.5 pr-3 font-display font-semibold text-moss hover:bg-edge hover:text-forest"
        href="/english.html"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 5l-7 7 7 7" />
        </svg>
        English
      </a>
      <header class="flex items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-2 font-display text-xl font-semibold">
          <svg
            class="h-6 w-6 flex-none"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
            <path
              d="M8 16C11 12 14 9 18 7"
              stroke="#274B2F"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <span>Good, Better, Best</span>
          <span class="rounded-full bg-gold px-2.5 py-0.5 text-sm"
            >Adjectives 11</span
          >
        </div>
        <button
          class="h-10 rounded-full border-2 px-3 font-my text-sm"
          :class="showMy ? 'border-forest bg-forest text-white' : 'border-edge bg-white text-moss'"
          @click="showMy = !showMy"
          :aria-pressed="showMy"
        >
          မြန်မာ
        </button>
      </header>

      <!-- ---------- the four steps ---------- -->
      <nav class="mt-3 flex gap-1.5" aria-label="Lesson steps">
        <template x-for="(s, k) in STEPS" :key="k">
          <button
            class="flex h-11 flex-1 items-center justify-center gap-1 rounded-full border-2 font-display text-base font-semibold"
            :class="k === step ? 'border-forest bg-forest text-white' : k < step ? 'border-leaf bg-leaf/40 text-forest' : 'border-edge bg-white text-moss'"
            @click="go(k)"
            :aria-label="'Step ' + (k + 1) + ': ' + s.en"
            :aria-current="k === step ? 'step' : false"
          >
            <span x-text="s.icon" aria-hidden="true"></span
            ><span x-text="k + 1"></span>
          </button>
        </template>
      </nav>

      <div class="mt-3 flex items-baseline justify-between gap-3">
        <h1
          class="font-display text-2xl font-semibold leading-tight"
          x-text="done ? 'Well done!' : STEPS[step].en"
        ></h1>
        <span
          class="whitespace-nowrap font-display font-semibold text-moss"
          x-show="!done"
          x-text="(i + 1) + ' / ' + total()"
        ></span>
      </div>
      <p
        class="font-my text-base leading-loose text-moss"
        x-show="showMy && !done"
        x-text="STEPS[step].my"
      ></p>

      <div class="mb-4 mt-1 flex gap-1" x-show="!done" aria-hidden="true">
        <template x-for="k in total()" :key="k">
          <span
            class="h-2 flex-1 rounded"
            :class="k - 1 < i ? 'bg-leaf' : k - 1 === i ? 'bg-gold' : 'bg-edge'"
          ></span>
        </template>
      </div>

      <p
        class="mb-3 rounded-xl bg-white px-3 py-1.5 text-sm text-moss"
        x-show="!AUDIO_READY && !done"
      >
        🔇 The voices are not recorded yet. Read the words for now.
      </p>

      <main class="flex flex-1 flex-col">
        <!-- ========== 1 · Look and listen: picture, word, sentence ========== -->
        <template x-if="step === 0">
          <section class="flex flex-col gap-3">
            <div
              class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white"
              x-html="pic(sc)"
            ></div>

            <div
              class="flex items-center gap-3 rounded-3xl border-2 border-edge bg-white p-3"
            >
              <button
                :class="SPK"
                :disabled="!AUDIO_READY"
                @click="play(sc.wclip)"
                aria-label="Hear the words"
                x-html="SPK_ICON"
              ></button>
              <div>
                <div
                  class="font-display text-4xl font-bold"
                  x-html="wordHtml(sc)"
                ></div>
                <div
                  class="text-lg font-bold text-moss"
                  x-show="sc.note"
                  x-html="sc.note"
                ></div>
                <div
                  class="font-my text-lg leading-loose text-moss"
                  x-show="showMy"
                  x-text="sc.wmy"
                ></div>
              </div>
            </div>

            <div
              class="flex items-center gap-3 rounded-3xl border-2 border-edge bg-white p-3"
            >
              <button
                :class="SPK"
                :disabled="!AUDIO_READY"
                @click="play(sc.clip)"
                aria-label="Hear the sentence"
                x-html="SPK_ICON"
              ></button>
              <div>
                <p
                  class="text-2xl font-bold leading-snug"
                  x-html="sentence(sc)"
                ></p>
                <p
                  class="font-my text-base leading-loose text-moss"
                  x-show="showMy"
                  x-text="sc.my"
                ></p>
              </div>
            </div>
          </section>
        </template>

        <!-- ========== 2 · Tap the picture: hear (or read) the word, find it ========== -->
        <template x-if="step === 1">
          <section class="flex flex-col gap-3">
            <div
              class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3"
            >
              <button
                :class="SPK"
                :disabled="!AUDIO_READY"
                @click="play(sc.tclip)"
                aria-label="Hear it again"
                x-html="SPK_ICON"
              ></button>
              <div
                class="font-bold"
                :class="sc.tbig ? 'font-display text-4xl' : 'text-2xl leading-snug'"
                x-html="sc.thtml"
              ></div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <template x-for="o in opts" :key="o.n">
                <button
                  class="relative aspect-[4/3] overflow-hidden rounded-2xl border-4 bg-white transition"
                  :class="[
                    solved && o.n === sc.n ? 'border-green-600 ring-4 ring-green-200'
                      : solved || wrong.includes(o.n) ? 'border-edge opacity-40'
                      : 'border-forest active:translate-y-0.5',
                    shaking === o.n ? 'shake' : '',
                  ]"
                  :disabled="solved || wrong.includes(o.n)"
                  @click="pickPic(o)"
                  :aria-label="'Picture ' + o.n"
                  x-html="pic(o, true)"
                ></button>
              </template>
            </div>

            <div
              class="rounded-2xl border-2 border-green-600 bg-green-50 px-4 py-2.5 text-lg"
              x-show="solved"
              aria-live="polite"
            >
              <b class="font-display" x-text="cheer"></b>
              <span x-html="sentence(sc)"></span>
            </div>
          </section>
        </template>

        <!-- ========== 3 · Make the sentence: one row of buttons for each gap ========== -->
        <template x-if="step === 2">
          <section class="flex flex-col gap-3">
            <div
              class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white"
              x-html="pic(sc)"
            ></div>

            <div
              class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3"
            >
              <button
                :class="SPK"
                :disabled="!AUDIO_READY || !built()"
                @click="play(sc.clip)"
                aria-label="Hear the sentence"
                x-html="SPK_ICON"
              ></button>
              <p class="text-2xl font-bold leading-relaxed">
                <template x-for="g in GROUPS" :key="g.id"
                  ><span>
                    <span x-text="sc.pre[g.id]"></span>
                    <span
                      class="slot"
                      :class="g.text"
                      x-text="got[g.id] ? sc.parts[g.id] : ' '"
                    ></span></span></template
                ><span x-text="sc.rest"></span>
              </p>
            </div>

            <template x-for="g in GROUPS" :key="g.id">
              <div class="grid gap-2" :class="g.cols">
                <template x-for="o in sopts[g.id]" :key="o">
                  <button
                    class="min-h-[56px] rounded-2xl border-[3px] text-xl font-bold transition"
                    :class="[
                      got[g.id] && o === sc.parts[g.id] ? g.on
                        : got[g.id] ? 'border-edge bg-white opacity-40 ' + g.text
                        : g.off + ' bg-white shadow-[0_4px_0_#e3edd6] active:translate-y-0.5',
                      shaking === g.id + o ? 'shake' : '',
                    ]"
                    :disabled="!!got[g.id]"
                    @click="pick(g, o)"
                    x-text="o"
                  ></button>
                </template>
              </div>
            </template>

            <div
              class="rounded-2xl border-2 border-green-600 bg-green-50 px-4 py-2.5 text-lg"
              x-show="built()"
              aria-live="polite"
            >
              <b class="font-display" x-text="cheer"></b>
              <span
                class="font-my leading-loose text-moss"
                x-show="showMy"
                x-text="sc.my"
              ></span>
            </div>
          </section>
        </template>

        <!-- ========== 4 · Yes or no?: does the sentence match the picture? ========== -->
        <template x-if="step === 3 && !done">
          <section class="flex flex-col gap-3">
            <div
              class="aspect-[4/3] overflow-hidden rounded-3xl border-4 border-forest bg-white"
              x-html="pic(sc)"
            ></div>

            <div
              class="flex items-center gap-3 rounded-3xl border-[3px] border-dashed border-leaf bg-white p-3"
            >
              <button
                :class="SPK"
                :disabled="!AUDIO_READY"
                @click="play(said.clip)"
                aria-label="Hear the sentence"
                x-html="SPK_ICON"
              ></button>
              <p
                class="text-2xl font-bold leading-snug"
                x-html="sentence(said)"
              ></p>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <template x-for="val in [true, false]" :key="val">
                <button
                  class="min-h-[60px] rounded-2xl border-[3px] text-2xl font-bold transition"
                  :class="chosen === null ? 'border-forest bg-white shadow-[0_4px_0_#e3edd6] active:translate-y-0.5'
                    : val === truth ? 'border-green-600 bg-green-50 text-green-800'
                    : val === chosen ? 'border-orange-400 bg-orange-50 text-orange-800 line-through'
                    : 'border-edge bg-white opacity-40'"
                  :disabled="chosen !== null"
                  @click="answer(val)"
                  x-text="val ? '✓ Yes' : '✗ No'"
                ></button>
              </template>
            </div>

            <div
              class="rounded-2xl border-2 px-4 py-2.5 text-lg"
              :class="chosen === truth ? 'border-green-600 bg-green-50' : 'border-orange-400 bg-orange-50'"
              x-show="chosen !== null"
              aria-live="polite"
            >
              <b
                class="font-display"
                x-text="chosen === truth ? cheer : 'Not quite.'"
              ></b>
              <span x-html="sentence(sc)"></span>
            </div>
          </section>
        </template>

        <!-- ========== the end: score, wrong answers next to the right ones ========== -->
        <template x-if="done">
          <section class="flex flex-col gap-4" aria-live="polite">
            <div
              class="rounded-3xl border-2 border-edge bg-white px-4 py-5 text-center"
            >
              <div class="text-5xl tracking-widest" aria-hidden="true">
                <template x-for="s in 3" :key="s"
                  ><span :class="s <= stars() ? '' : 'opacity-30 grayscale'"
                    >⭐</span
                  ></template
                >
              </div>
              <p
                class="mt-1 font-display text-5xl font-bold"
                x-text="score() + ' / ' + yn.length"
              ></p>
              <p class="mt-2 text-lg" x-text="message()"></p>
            </div>

            <div class="flex flex-col gap-2" x-show="missed().length">
              <h2 class="font-display text-xl font-semibold">
                Look again
                <span
                  class="rounded-full bg-orange-400 px-2 text-base text-white"
                  x-text="missed().length"
                ></span>
              </h2>
              <template x-for="(m, k) in missed()" :key="k">
                <div
                  class="flex items-center gap-3 rounded-xl border-l-[6px] border-orange-400 bg-white p-2.5"
                >
                  <div
                    class="aspect-[4/3] w-24 flex-none overflow-hidden rounded-lg border-2 border-forest"
                    x-html="pic(m.scene, true)"
                  ></div>
                  <div class="min-w-0 leading-snug">
                    <p class="font-bold" x-html="sentence(m.said)"></p>
                    <p class="text-orange-800">
                      You said <s x-text="m.truth ? 'No' : 'Yes'"></s>
                    </p>
                    <p class="font-bold text-green-800">
                      <span x-text="m.truth ? '✓ Yes' : '✓ No.'"></span>
                      <span x-show="!m.truth" x-html="sentence(m.scene)"></span>
                    </p>
                  </div>
                </div>
              </template>
            </div>

            <div class="flex flex-col gap-2">
              <h2 class="font-display text-xl font-semibold">
                Your 8 word cards
              </h2>
              <div class="grid grid-cols-2 gap-2">
                <template x-for="w in SCENES" :key="w.n">
                  <button
                    class="rounded-xl border-2 border-edge bg-white px-1 py-2 text-center text-lg font-bold"
                    :disabled="!AUDIO_READY"
                    @click="play(w.wclip)"
                    x-html="wordHtml(w)"
                  ></button>
                </template>
              </div>
            </div>

            <div class="mt-2 flex flex-col items-center gap-3">
              <button
                class="h-14 min-w-[230px] rounded-full bg-gold px-6 font-display text-xl font-semibold shadow-[0_5px_0_#e39b12] active:translate-y-0.5"
                x-show="missed().length"
                @click="startPractice()"
                x-text="'Practice these (' + missed().length + ')'"
              ></button>
              <button
                class="h-14 min-w-[230px] rounded-full px-6 font-display text-xl font-semibold active:translate-y-0.5"
                :class="missed().length ? 'bg-leaf/30 shadow-[0_5px_0_#8fc07e]' : 'bg-gold shadow-[0_5px_0_#e39b12]'"
                @click="go(0)"
              >
                ↻ Start the lesson again
              </button>
            </div>
          </section>
        </template>
      </main>

      <!-- ---------- back / next ---------- -->
      <footer class="mt-5 flex items-center gap-3" x-show="!done">
        <button
          class="h-14 w-14 flex-none rounded-full border-2 border-edge bg-white text-2xl text-moss disabled:opacity-30"
          :disabled="step === 0 && i === 0"
          @click="back()"
          aria-label="Back"
        >
          ←
        </button>
        <button
          class="h-14 flex-1 rounded-full bg-gold font-display text-xl font-semibold shadow-[0_5px_0_#e39b12] transition active:translate-y-0.5 disabled:opacity-40 disabled:shadow-none"
          :disabled="!canGoOn()"
          @click="main()"
          x-text="mainLabel()"
        ></button>
      </footer>
    </div>

    <script>
      /* =====================================================================
         GOOD, BETTER, BEST (Adjectives 11) — the words that change completely
         (good → better → the best, bad → worse → the worst), and "more" /
         "the most" for long words. One sentence frame: "The ___ is ___."

         The four steps on this page:
           1 Look and listen    picture + words + sentence, with the whole ladder under the words
           2 Tap the picture    hear the SENTENCE, find it among four pictures
           3 Make the sentence  tap what it is about, then the word from the ladder
                                (blue = the thing, green = the describing words)
           4 Yes or no?         the picture's own sentence, or an untrue one about the same thing

         ---------------------------------------------------------------------
         PICTURES — 8 files, IMG_DIR/1.jpg … 8.jpg, shown 4:3.
         Three things in a row. The one the sentence is ABOUT is marked the
         same way in every picture (the mark of Adjectives 9 and 10); the
         pictures of one set are the same drawing with the mark moved.
            1–3  three children's drawings with one, two and three stars:
                 1 FIRST marked     2 SECOND marked     3 THIRD marked
            4–6  three windows: grey clouds, rain, a storm with lightning:
                 4 CLOUDS marked    5 RAIN marked       6 STORM marked
            7–8  three flowers: a small white one, a bigger red one, a big pink one in full bloom:
                 7 RED marked       8 PINK marked
         When the files are uploaded, set IMAGES_READY = true.

         AUDIO — 22 clips, AUD_DIR/01.mp3 … 22.mp3.
           01–16  in pairs, one pair per picture: the words alone (odd), then the sentence (even):
                  01 Good.                 02 The first drawing is good.
                  03 Better.               04 The second drawing is better.
                  05 The best.             06 The third drawing is the best.
                  07 Bad.                  08 The weather is bad.
                  09 Worse.                10 The weather is worse.
                  11 The worst.            12 The weather is the worst.
                  13 More beautiful.       14 The red flower is more beautiful.
                  15 The most beautiful.   16 The pink flower is the most beautiful.
           17–22  untrue sentences for step 4 (pictures 4 and 5 use clip 12):
                  17 The first drawing is the best.          18 The second drawing is the best.
                  19 The third drawing is bad.               20 The weather is good.
                  21 The red flower is the most beautiful.   22 The pink flower is the worst.
         When the clips are uploaded, set AUDIO_READY = true.

         While a switch is false the page never asks the server for those
         files, so no "not found" answer gets cached (4 hours on Cloudflare).

         The Burmese on this page has not been checked by a Burmese speaker.
         Compare scenes by number (n) and choices by their text, never by
         object: Alpine wraps the state in proxies.
         ===================================================================== */
      const IMAGES_READY = false;
      const AUDIO_READY = false;

      const IMG_DIR = "/img/ytstory/adjectives_11/";
      const IMG_EXT = "jpg";
      const AUD_DIR = "https://languages.rmlives.com/eng/yt/adjectives_11/";
      const AUD_EXT = "mp3";

      /* the kinds of word and their colours: things blue, describing words green.
         Step 3 shows one gap and one row of buttons for each group. */
      const BLUE = { text: "text-sky-700", on: "border-sky-700 bg-sky-700 text-white", off: "border-sky-700 text-sky-700" };
      const GREEN = { text: "text-emerald-700", on: "border-emerald-700 bg-emerald-700 text-white", off: "border-emerald-700 text-emerald-700" };
      const green = (w) => '<span class="text-emerald-700">' + w + "</span>";
      const blue = (w) => '<span class="text-sky-700">' + w + "</span>";

      /* a sentence from its parts: for each group, the fixed words in front
         of the gap (pre) and the word that fills it (parts) */
      function build(pre, parts, rest) {
        let text = "";
        let html = "";
        GROUPS.forEach((g) => {
          const p = pre[g.id] ? pre[g.id] + " " : "";
          text += (text ? " " : "") + p + parts[g.id];
          html += (html ? " " : "") + p + '<span class="' + g.text + '">' + parts[g.id] + "</span>";
        });
        return { text: text + rest, html: html + rest };
      }
      /* picture k (0 = first): clips in pairs, the words alone (odd) then the sentence (even).
         tapSentence: step 2 gives the whole sentence instead of the word card. */
      function scene(k, o) {
        const b = build(o.pre, o.parts, ".");
        return Object.assign(
          { n: k + 1, wclip: 2 * k + 1, clip: 2 * k + 2, rest: ".", text: b.text, html: b.html, note: "" },
          o,
          { thtml: o.tapSentence ? b.html : o.whtml, tclip: o.tapSentence ? 2 * k + 2 : 2 * k + 1, tbig: !o.tapSentence },
        );
      }
      /* an untrue sentence for step 4, with its own clip */
      function lie(clip, pre, parts) {
        return Object.assign({ n: 0, clip }, build(pre, parts, "."));
      }
      /* the right choice and three others from a list, mixed */
      function four(right, list, must) {
        const keep = must && must !== right ? [must] : [];
        const more = shuffle(list.filter((x) => x !== right && !keep.includes(x))).slice(0, 3 - keep.length);
        return shuffle([right, ...keep, ...more]);
      }
      /* step 2: the right picture and three others */
      const anyThree = (sc) => shuffle([SCENES[sc.n - 1], ...shuffle(SCENES.filter((x) => x.n !== sc.n)).slice(0, 3)]);

      /* the three sets: what the sentence can be about, and the ladder of words */
      const SETS = {
        A: { whats: ["first drawing", "second drawing", "third drawing"], ladder: ["good", "better", "the best"] },
        B: { whats: ["weather", "drawing", "flower"], ladder: ["bad", "worse", "the worst"] },
        C: { whats: ["white flower", "red flower", "pink flower"], ladder: ["beautiful", "more beautiful", "the most beautiful"] },
      };

      /* step 3: the gaps, in sentence order, and the buttons offered for each.
         The ladder stays in its order, so the child sees good → better → the best. */
      const GROUPS = [
        { id: "what", cols: "grid-cols-3", ...BLUE, options: (sc) => SETS[sc.set].whats },
        { id: "word", cols: "grid-cols-3", ...GREEN, options: (sc) => SETS[sc.set].ladder },
      ];

      /* one line per picture, in picture order:
         [set, what it is about, the word, Burmese word, Burmese sentence, what the picture shows,
          the untrue sentence for step 4: its word and its clip] */
      const SCENES = [
        ["A", "first drawing", "good", "ကောင်း", "ပထမပုံက ကောင်းတယ်။", "3 drawings (1, 2, 3 stars): FIRST", "the best", 17],
        ["A", "second drawing", "better", "ပိုကောင်း", "ဒုတိယပုံက ပိုကောင်းတယ်။", "3 drawings (1, 2, 3 stars): SECOND", "the best", 18],
        ["A", "third drawing", "the best", "အကောင်းဆုံး", "တတိယပုံက အကောင်းဆုံးပါ။", "3 drawings (1, 2, 3 stars): THIRD", "bad", 19],
        ["B", "weather", "bad", "ဆိုး", "ရာသီဥတုက ဆိုးတယ်။", "clouds, rain, storm: CLOUDS", "the worst", 12],
        ["B", "weather", "worse", "ပိုဆိုး", "ရာသီဥတုက ပိုဆိုးတယ်။", "clouds, rain, storm: RAIN", "the worst", 12],
        ["B", "weather", "the worst", "အဆိုးဆုံး", "ရာသီဥတုက အဆိုးဆုံးပါ။", "clouds, rain, storm: STORM", "good", 20],
        ["C", "red flower", "more beautiful", "ပိုလှ", "ပန်းအနီက ပိုလှတယ်။", "white, red, pink flower: RED", "the most beautiful", 21],
        ["C", "pink flower", "the most beautiful", "အလှဆုံး", "ပန်းရောင်ပန်းက အလှဆုံးပါ။", "white, red, pink flower: PINK", "the worst", 22],
      ].map(([set, what, word, wmy, my, desc, lieWord, lieClip], k) =>
        scene(k, {
          pre: { what: "The", word: "is" },
          parts: { what, word },
          whtml: green(word),
          note: SETS[set].ladder.map((w) => (w === word ? green(w) : w)).join(" → "),
          tapSentence: true,
          set,
          wmy,
          my,
          desc,
          lieWord,
          lieClip,
        }),
      );

      const tapOptions = anyThree;
      /* step 4: an untrue sentence about the same thing */
      const LIES = SCENES.map((sc) => lie(sc.lieClip, sc.pre, { what: sc.parts.what, word: sc.lieWord }));
      const liar = (sc) => LIES[sc.n - 1];

      const STEPS = [
        { icon: "👀", en: "Look and listen", my: "ကြည့်ပြီး နားထောင်ပါ" },
        { icon: "👆", en: "Tap the picture", my: "ပုံကို နှိပ်ပါ" },
        { icon: "🧩", en: "Make the sentence", my: "ဝါကျ တည်ဆောက်ပါ" },
        { icon: "✅", en: "Yes or no?", my: "မှန်သလား၊ မှားသလား" },
      ];
      const CHEERS = [
        "Great job!",
        "Well done!",
        "Yes!",
        "Super!",
        "You got it!",
      ];

      function shuffle(a) {
        a = a.slice();
        for (let k = a.length - 1; k > 0; k--) {
          const j = Math.floor(Math.random() * (k + 1));
          [a[k], a[j]] = [a[j], a[k]];
        }
        return a;
      }

      /* ---------------- audio: one clip at a time, nothing fetched until AUDIO_READY ---------------- */
      let player = null;
      function play(n) {
        if (!AUDIO_READY) return;
        if (player) player.pause();
        player = new Audio(
          AUD_DIR + String(n).padStart(2, "0") + "." + AUD_EXT,
        );
        player.play().catch(() => {});
      }

      const SPK_ICON =
        '<svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

      function lesson() {
        return {
          IMAGES_READY,
          AUDIO_READY,
          STEPS,
          GROUPS,
          SCENES,
          SPK_ICON,
          SPK: "flex h-14 w-14 flex-none items-center justify-center rounded-full bg-gold text-forest shadow-[0_4px_0_#e39b12] active:translate-y-0.5 disabled:opacity-35 disabled:shadow-none",

          showMy: true,
          step: 0,
          i: 0,
          rounds: SCENES,
          sc: SCENES[0], // the scene in the picture
          cheer: "",
          shaking: null,
          /* step 2 */
          opts: [],
          wrong: [],
          solved: false,
          /* step 3 */
          sopts: {}, // the buttons offered for each gap
          got: {}, // the gaps already filled
          /* step 4 */
          yn: [],
          said: SCENES[0], // the sentence shown (may not match the picture)
          truth: true,
          chosen: null,
          results: [],
          practice: false,
          done: false,

          init() {
            this.go(0);
          },

          /* ---------- moving about ---------- */
          go(s) {
            this.step = s;
            this.i = 0;
            this.done = false;
            this.practice = false;
            if (s === 0) this.rounds = SCENES;
            if (s === 1 || s === 2) this.rounds = shuffle(SCENES);
            if (s === 3) {
              this.yn = this.makeYesNo();
              this.results = [];
            }
            this.load();
          },
          total() {
            return this.step === 3 ? this.yn.length : this.rounds.length;
          },
          load() {
            this.solved = false;
            this.wrong = [];
            this.shaking = null;
            this.got = {};
            this.chosen = null;
            this.cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];

            if (this.step === 3) {
              const q = this.yn[this.i];
              this.sc = q.scene;
              this.said = q.said;
              this.truth = q.truth;
              play(q.said.clip);
            } else {
              const sc = (this.sc = this.rounds[this.i]);
              if (this.step === 1) {
                this.opts = tapOptions(sc);
              }
              if (this.step === 2) {
                const o = {};
                GROUPS.forEach((g) => (o[g.id] = g.options(sc)));
                this.sopts = o;
              } else play(this.step === 1 ? sc.tclip : sc.wclip);
            }
            window.scrollTo(0, 0);
          },
          canGoOn() {
            if (this.step === 1) return this.solved;
            if (this.step === 2) return this.built();
            if (this.step === 3) return this.chosen !== null;
            return true;
          },
          mainLabel() {
            if (this.i + 1 < this.total()) return "Next →";
            if (this.step === 3)
              return this.practice ? "Finish" : "See my score";
            return "Next: " + STEPS[this.step + 1].en + " →";
          },
          main() {
            if (this.i + 1 < this.total()) {
              this.i++;
              this.load();
            } else if (this.step < 3) this.go(this.step + 1);
            else {
              this.done = true;
              window.scrollTo(0, 0);
            }
          },
          back() {
            if (this.i > 0) {
              this.i--;
              this.load();
            } else if (this.step > 0) this.go(this.step - 1);
          },
          wobble(id) {
            this.shaking = null;
            this.$nextTick(() => {
              this.shaking = id;
              setTimeout(() => {
                if (this.shaking === id) this.shaking = null;
              }, 450);
            });
          },

          /* ---------- step 2 ---------- */
          pickPic(o) {
            if (o.n === this.sc.n) {
              this.solved = true;
              play(this.sc.clip);
            } else {
              this.wobble(o.n);
              setTimeout(() => this.wrong.push(o.n), 400);
            }
          },

          /* ---------- step 3 ---------- */
          pick(g, o) {
            if (o === this.sc.parts[g.id]) this.got[g.id] = true;
            else this.wobble(g.id + o);
            if (this.built()) play(this.sc.clip);
          },
          built() {
            return GROUPS.every((g) => this.got[g.id]);
          },

          /* ---------- step 4 ---------- */
          /* Eight pictures; four get their own sentence, four get the
             untrue one from liar() above (every sentence has a clip). */
          makeYesNo() {
            const truths = shuffle([
              true,
              true,
              true,
              true,
              false,
              false,
              false,
              false,
            ]);
            return shuffle(SCENES)
              .slice(0, 8)
              .map((scene, k) => {
                const truth = truths[k];
                return { scene, truth, said: truth ? scene : liar(scene) };
              });
          },
          answer(val) {
            this.chosen = val;
            this.results[this.i] = val === this.truth;
          },
          score() {
            return this.results.filter((r) => r === true).length;
          },
          missed() {
            return this.yn.filter((q, k) => this.results[k] === false);
          },
          startPractice() {
            this.yn = this.missed();
            this.results = [];
            this.practice = true;
            this.i = 0;
            this.done = false;
            this.load();
          },
          stars() {
            const p = this.score() / this.yn.length;
            return p >= 0.9 ? 3 : p >= 0.6 ? 2 : 1;
          },
          message() {
            if (this.practice)
              return this.missed().length
                ? "Keep going. Try these once more."
                : "You got them all this time!";
            const s = this.stars();
            return s === 3
              ? "Excellent! You know good, better and best."
              : s === 2
                ? "Good work! Do the lesson again tomorrow."
                : "Good try! Go back to step 1 and listen again.";
          },

          /* ---------- drawing ---------- */
          play,
          /* the coloured sentence and the coloured word card: made with the scenes above */
          sentence(sc) {
            return sc.html;
          },
          wordHtml(sc) {
            return sc.whtml;
          },
          /* the picture, or a labelled box until the picture exists */
          pic(sc, small) {
            if (IMAGES_READY)
              return (
                '<img src="' +
                IMG_DIR +
                sc.n +
                "." +
                IMG_EXT +
                '" alt="" class="block h-full w-full object-cover" />'
              );
            return (
              '<div class="flex h-full w-full flex-col items-center justify-center gap-1 bg-[repeating-linear-gradient(45deg,#fff,#fff_12px,#f1f6ea_12px,#f1f6ea_24px)] p-2 text-center text-moss">' +
              '<svg viewBox="0 0 24 24" class="' +
              (small ? "h-6 w-6" : "h-10 w-10") +
              '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-5-5-8.5 9"/></svg>' +
              '<span class="font-display font-semibold ' +
              (small ? "text-sm" : "text-lg") +
              '">' +
              sc.n +
              "." +
              IMG_EXT +
              "</span>" +
              '<span class="' +
              (small ? "text-sm" : "text-base") +
              ' font-bold text-forest">' +
              sc.desc +
              "</span>" +
              "</div>"
            );
          },
        };
      }
    </script>
    <script src="/assets/js/alpine.min.js"></script>
  </body>
</html>
