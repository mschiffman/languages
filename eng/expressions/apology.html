const categories = [
        {
          en: "Surprise",
          my: "အံ့ဩတဲ့အခါ",
          desc: "When something surprises you, good or bad.",
          cards: [
            ["Wow!", "ဝိုး။", "Big surprise or admiration. Say it long and high: Woooow! Also: Wow, that's amazing!",
              "Wow! Your garden is beautiful.", "ဝိုး။ ပန်းခြံလေး အရမ်းလှတယ်။"],
            ["Really?", "တကယ်လား။", "Surprise or interest. Let your voice go up at the end. Said flat, it can sound like you don't believe them.",
              "— I got a job in Thailand. — Really? When do you start?", "— ထိုင်းမှာ အလုပ်ရပြီ။ — တကယ်လား။ ဘယ်တော့ စမှာလဲ။"],
            ["No way!", "မယုံနိုင်ဘူး။", "Two meanings. With a happy, surprised face: I can't believe it! As an answer to a request: Absolutely not!",
              "— I won the prize! — No way! Congratulations!", "— ဆုရသွားပြီ။ — မယုံနိုင်ဘူး။ ဂုဏ်ယူပါတယ်။"],

            ["You're kidding!", "နောက်နေတာလား။", "Kidding means joking. It means: That's so surprising, is it true? Also: Are you serious?",

          ],
        },
        {
          en: "Good news",
          my: "သတင်းကောင်း ကြားတဲ့အခါ",
          desc: "Happy reactions, from a calm great to a joyful yay.",
          cards: [
            ["Great!", "ကောင်းလိုက်တာ။", "The all-purpose happy answer. Stronger: That's wonderful! or Fantastic!",
              "— I passed the test! — Great! Well done!", "— စာမေးပွဲ အောင်ပြီ။ — ကောင်းလိုက်တာ။ တော်လိုက်တာ။"],
            ["Cool!", "မိုက်တယ်။", "Casual: I like it, that's interesting. Very common with young people.",

          en: "Oops and ouch",

            ["Oops!", "အိုး၊ မှားသွားပြီ။", "A small accident or mistake: you drop something or press the wrong button. Also: Whoops!",

            ["Ouch!", "အား၊ နာလိုက်တာ။", "Sudden pain. Shorter: Ow! Also for news that hurts: The ticket is $200? Ouch!",

          ],
        },
        {
          en: "Bad news and annoyance",
          my: "သတင်းဆိုး၊ စိတ်ညစ်တဲ့အခါ",
          desc: "When things go wrong, big or small.",
          cards: [
            ["Oh no!", "ဟာ၊ သွားပြီ။", "Something bad just happened, or you just remembered something. Very common.",

            ["What a shame!", "နှမြောစရာပဲ။", "Means: That's sad, that's disappointing. It is not about feeling ashamed (ရှက်တယ်). Also: What a pity!",
              "— I can't come to your party. — Oh, what a shame!", "— မင်းပါတီကို မလာနိုင်ဘူး။ — ဟာ၊ နှမြောစရာပဲ။"],
            ["Oh well.", "ထားလိုက်ပါတော့။", "Accepting something bad that you can't change. Calm, with a small shrug.",
              "It's raining. Oh well, we can stay home and cook.", "မိုးရွာနေတယ်။ ထားလိုက်ပါတော့၊ အိမ်မှာပဲ ချက်ပြုတ်စားကြမယ်။"],
            ["Ugh!", "ဟာကွာ။", "Annoyed or disgusted. Casual: with friends, or to yourself.",
              "Ugh! The internet is down again.", "ဟာကွာ။ အင်တာနက် ထပ်ပြတ်ပြန်ပြီ။"],
            ["Come on!", "ကဲပါကွာ။", "Two uses. Annoyed: Oh, come on! means That's not fair or Hurry up! Encouraging: Come on, you can do it!",
              "Come on! We'll be late!", "ကဲပါကွာ။ နောက်ကျတော့မယ်။"],
          ],
        },
        {
          en: "Relief",
          my: "စိတ်သက်သာရာ ရတဲ့အခါ",
          desc: "When the danger or worry is over.",
          cards: [
            ["Phew!", "ဟူး။", "The sound of breathing out after a worry. Say it like a long breath.",
              "Phew! I found my passport.", "ဟူး။ ပတ်စပို့ တွေ့ပြီ။"],
            ["Thank goodness!", "တော်ပါသေးရဲ့။", "Something bad didn't happen. You'll also hear Thank God!",
              "Thank goodness you're safe!", "မင်း ဘေးကင်းတာ တော်ပါသေးရဲ့။"],
            ["What a relief!", "စိတ်အေးသွားပြီ။", "When a long worry ends: good test results, a safe arrival.",
              "— The doctor says it's nothing serious. — What a relief!", "— ဆရာဝန်က ဘာမှ မဖြစ်ဘူးတဲ့။ — စိတ်အေးသွားပြီ။"],
          ],
        },
        {
          en: "Warnings",
          my: "သတိပေးခြင်း",
          desc: "Short and loud: when someone is in danger.",
          cards: [
            ["Look out!", "သတိ!", "Danger right now: a car, something falling. Also: Watch out!",
              "Look out! There's a car coming!", "သတိ! ကား လာနေတယ်။"],
            ["Careful!", "သတိထားနော်။", "Less urgent: take care, go slowly. Also: Be careful!",
              "Careful! The floor is wet.", "သတိထားနော်။ ကြမ်းပြင် စိုနေတယ်။"],
            ["Help!", "ကယ်ကြပါဦး။", "Shout it when you are in real danger. To ask for everyday help, say Can you help me, please?",
              "Help! Someone fell in the river!", "ကယ်ကြပါဦး။ မြစ်ထဲ လူကျသွားတယ်။"],
            ["Stop!", "ရပ်!", "To stop someone right now: danger, or something that must not happen.",
              "Stop! Don't touch that, it's hot!", "ရပ်! မကိုင်နဲ့၊ ပူတယ်။"],
          ],
        },
        {
          en: "For other people",
          my: "တခြားသူတွေအတွက်",
          desc: "Quick words for other people's big moments and small ones.",
          cards: [
            ["Congratulations!", "ဂုဏ်ယူပါတယ်။", "For good news: a new job, a wedding, a baby, passing an exam. Casual: Congrats!",
              "— We're getting married! — Congratulations!", "— ကျွန်တော်တို့ လက်ထပ်တော့မယ်။ — ဂုဏ်ယူပါတယ်။"],
            ["Well done!", "တော်လိုက်တာ။", "Praise for something someone did well. Americans often say Good job!, especially to children and students.",
              "You finished the race? Well done!", "ပြိုင်ပွဲ ပြီးအောင် ပြေးနိုင်ခဲ့တယ်ဆို။ တော်လိုက်တာ။"],
            ["Good luck!", "ကံကောင်းပါစေ။", "Before an exam, an interview, a game. Answer: Thanks! Also: Best of luck!",
              "Good luck with your interview tomorrow!", "မနက်ဖြန် အင်တာဗျူးမှာ ကံကောင်းပါစေ။"],
            ["Bless you!", "(နှာချေသူကို ပြောတဲ့ စကား)", "Say it when someone sneezes. English speakers expect it, and the answer is Thank you.",
              "— Achoo! — Bless you! — Thank you.", "— ဟတ်ချိုး။ — (Bless you!) — ကျေးဇူးပါ။"],
            ["Cheers!", "ချီးယားစ်။", "When you lift your glasses together before drinking. In British English it also means thanks or bye.",
              "To our new home. Cheers!", "အိမ်သစ်အတွက်။ ချီးယားစ်။"],
          ],
        },
      ];
