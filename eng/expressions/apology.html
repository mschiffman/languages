          en: "Sorry to hear that",

          cards: [

              "— I lost my job. — Oh, I'm sorry to hear that.", "— အလုပ်ပြုတ်သွားတယ်။ — အို၊ ကြားရတာ စိတ်မကောင်းပါဘူး။"],
            ["That's too bad.", "ကံမကောင်းလိုက်တာ။", "For small disappointments: rain on your day off, a trip you can't take. For serious news, say I'm sorry to hear that.",
              "— It's raining. We can't go to the beach. — Oh, that's too bad.", "— မိုးရွာနေတယ်။ ကမ်းခြေ မသွားရတော့ဘူး။ — အို၊ ကံမကောင်းလိုက်တာ။"],
            ["I'm sorry for your loss.", "မင်းရဲ့ဆုံးရှုံးမှုအတွက် ဝမ်းနည်းပါတယ်။", "When someone has died. Short, kind and always safe. You can add: If you need anything, please call me.",

          ],

          desc: "Letting someone off the hook, kindly.",
          cards: [
            ["That's OK.", "ရပါတယ်။", "The everyday answer. Also: That's all right.",

            ["No harm done.", "ဘာမှ မဖြစ်ပါဘူး။", "Nothing was hurt or broken, so there's no problem.",

            ["It happens.", "ဖြစ်တတ်ပါတယ်။", "Puts the mistake down to bad luck. Also: It happens to everyone.",
