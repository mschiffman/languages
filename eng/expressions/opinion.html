          ],
        },

          en: "When you're not sure",
          my: "မသေချာတဲ့အခါ",
          desc: "Honest answers when you don't know, or can't decide.",
          cards: [
            ["I'm not sure.", "မသေချာဘူး။", "Honest and polite. Better than guessing when it matters.",

            ["Maybe.", "ဖြစ်ချင် ဖြစ်မယ်။", "Fifty-fifty. Careful: as an answer to an invitation, Maybe can sound like a soft no.",

            ["I don't know much about <span class=gray>football</span>.", "ဘောလုံးအကြောင်း သိပ်မသိဘူး။", "Says politely that you can't give a good opinion.",

          ],
        },
        {

          desc: "Asking what other people think.",
          cards: [
            ["What do you think?", "ဘယ်လို ထင်လဲ။", "Asks for someone's opinion. Not: How do you think? In Burmese we say ဘယ်လို, but in English it's What.",
              "I want to paint the room green. What do you think?", "အခန်းကို အစိမ်းရောင် ဆေးသုတ်ချင်တယ်။ ဘယ်လို ထင်လဲ။"],
            ["What do you think of <span class=gray>this song</span>?", "ဒီသီချင်းကို ဘယ်လို ထင်လဲ။", "Asks about one thing. Of and about both work: What do you think about my idea?",

            ["Do you think <span class=gray>it's too late</span>?", "နောက်ကျလွန်းပြီလို့ ထင်လား။", "After Do you think, use normal word order: Do you think it will rain? Not: Do you think will it rain?",
              "Do you think the shop is still open?", "ဆိုင် ဖွင့်တုန်းပဲ ထင်လား။"],
            ["How was <span class=gray>the movie</span>?", "ရုပ်ရှင်က ဘယ်လိုလဲ။", "Asks about an experience in the past: a trip, a movie, a meal. Here How is right.",

          ],
        },
        {
          en: "Simple judgments",
