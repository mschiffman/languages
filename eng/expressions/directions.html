      const AUD_DIR = "https://languages.rmlives.com/eng/expressions/directions/";
      const AUD_EXT = "mp3?v=2611090823";

const categories = [
        {

          my: "လမ်း မေးခြင်း",
          desc: "Start with Excuse me, then ask your question.",
          cards: [
            ["Excuse me, where's <span class=gray>the bank</span>?", "တဆိတ်လောက်၊ ဘဏ် ဘယ်မှာလဲ။", "Excuse me first gets a stranger's attention politely. Where's = where is.",
              "Excuse me, where's the bus station?", "တဆိတ်လောက်၊ ဘတ်စ်ကားဂိတ် ဘယ်မှာလဲ။"],

              "Excuse me, how do I get to the hospital?", "တဆိတ်လောက်၊ ဆေးရုံကို ဘယ်လို သွားရမလဲ။"],
            ["Is there <span class=gray>a pharmacy</span> near here?", "ဒီနားမှာ ဆေးဆိုင် ရှိလား။", "When you need any shop of that kind, not one in particular.",

          ],
        },
        {
          en: "Giving directions",
          my: "လမ်း ညွှန်ခြင်း",

            ["Go straight on.", "တည့်တည့် သွားပါ။", "Keep going forward. American English: Go straight ahead.",

            ["Turn left.", "ဘယ်ဘက် ကွေ့ပါ။", "Left and right are from the walker's side, not yours. Point to help.",

            ["It's at the end of the street.", "လမ်းအဆုံးမှာ ရှိတယ်။", "Where the street stops.",

            ["You can't miss it.", "သေချာပေါက် တွေ့မှာပါ။", "It's very easy to see. Friendly, at the end of directions.",
              "It's a big yellow building. You can't miss it.", "အဝါရောင် အဆောက်အအုံ ကြီးပါ။ သေချာပေါက် တွေ့မှာပါ။"],
          ],
        },
        {
          en: "How far",
          my: "ဘယ်လောက် ဝေးလဲ",
          desc: "Saying how near or far, and how long it takes.",
          cards: [
            ["It's just around the corner.", "ဒီနားလေးတင်ပါ။", "Very close, maybe just after the next turn.",
              "— Is the shop far? — No, it's just around the corner.", "— ဆိုင်က ဝေးလား။ — မဝေးပါဘူး၊ ဒီနားလေးတင်ပါ။"],
            ["It's about five minutes on foot.", "လမ်းလျှောက်ရင် ငါးမိနစ်လောက်ပဲ။", "On foot = walking. By car, by bus, by bike for other ways.",
              "The beach is about ten minutes by bike.", "ကမ်းခြေက စက်ဘီးနဲ့ဆို ဆယ်မိနစ်လောက်ပဲ။"],
            ["It's a long way.", "တော်တော် ဝေးတယ်။", "Too far to walk easily.",
              "It's a long way. You should take a bus.", "တော်တော် ဝေးတယ်။ ဘတ်စ်ကား စီးသင့်တယ်။"],
            ["You can walk there.", "လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။", "It's close enough to walk.",
              "The museum is near. You can walk there.", "ပြတိုက်က နီးပါတယ်။ လမ်းလျှောက်ပြီး သွားလို့ ရတယ်။"],
          ],
        },
        {
          en: "Lost or not sure",
          my: "လမ်းပျောက်ခြင်း",
          desc: "When you are lost, or when you can't help.",
          cards: [
            ["I'm lost.", "လမ်း ပျောက်နေတယ်။", "You don't know where you are. Ask for help: I'm lost. Can you help me?",
              "Excuse me, I'm lost. Where is the main road?", "တဆိတ်လောက်၊ လမ်း ပျောက်နေလို့။ လမ်းမကြီး ဘယ်မှာလဲ။"],
            ["I'm not from around here.", "ကျွန်တော်/ကျွန်မ ဒီနားက မဟုတ်ဘူး။", "Explains why you don't know the way, or why you're asking.",
              "Sorry, I'm not from around here. Try asking at the shop.", "ဆောရီး၊ ဒီနားက မဟုတ်ဘူး။ ဆိုင်မှာ မေးကြည့်ပါ။"],
            ["Sorry, I don't know.", "ဆောရီး၊ မသိဘူး။", "Honest and polite when someone asks you the way and you can't help.",
              "— Where's the post office? — Sorry, I don't know.", "— စာတိုက် ဘယ်မှာလဲ။ — ဆောရီး၊ မသိဘူး။"],
          ],
        },
