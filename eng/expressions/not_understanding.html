          cards: [
            ["Sorry?", "ဗျာ။ / ရှင်။", "The quickest polite way to ask someone to repeat. Let your voice go up. Just What? can sound rude.",
              "— The meeting is at three. — Sorry? — The meeting is at three o'clock.", "— အစည်းအဝေးက သုံးနာရီမှာ။ — ဗျာ။ — အစည်းအဝေးက သုံးနာရီထိုးမှာပါ။"],

        {

          cards: [

            ["Did you say <span class=gray>Tuesday</span> or <span class=gray>Thursday</span>?", "အင်္ဂါနေ့လား၊ ကြာသပတေးနေ့ကိုပြောတာလား။", "For numbers and words that sound almost the same. Fifteen or fifty? is the classic one.",

            ["Let me check I understand.", "နားလည်တာ မှန်မမှန် စစ်ကြည့်ပါရစေ။", "Before you repeat longer instructions back: at the doctor, at work, at the bank.",

          ],
        },
        {
          en: "Asking for words",
          my: "စကားလုံး မေးခြင်း",

          cards: [
            ["How do you say <span class=gray>လ</span> in English?", "လကို အင်္ဂလိပ်လို ဘယ်လိုပြောလဲ။", "The most useful question for learners. Ask the full question. Not: How to say ___?",

            ["What's <span class=gray>this</span> called?", "ဒါကို ဘာခေါ်လဲ။", "Point at something when you don't know its name. For more than one: What are these called?",
              "— What's this called? — It's a ladle.", "— ဒါကို ဘာခေါ်လဲ။ — ဟင်းခပ်ယောက်မပါ။"],
            ["How do you spell <span class=gray>rainbow</span>?", "သက်တံ့ ကို ဘယ်လို စာလုံးပေါင်းလဲ။", "For writing a word you heard. English spelling is hard for everyone, even native speakers!",
              "How do you spell Wednesday?", "Wednesday ကို ဘယ်လို စာလုံးပေါင်းလဲ။"],

          my: "အချိန်ယူခြင်း",
          desc: "When you need a moment, or can't find the word.",
          cards: [

            ["What's the word…?", "ဘယ်လို ပြောရမလဲ…", "Saying this out loud when you can't find a word is normal. Describe the thing, and the other person will often help you.",

            ["I'm still learning English.", "အင်္ဂလိပ်စကား သင်နေတုန်းပါ။", "Asks people to be patient and speak simply. No need to say Sorry for my bad English: people are usually kind.",

          ],
