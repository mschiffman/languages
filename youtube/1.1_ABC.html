<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Alphabet</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CHXHM9CZKM"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CHXHM9CZKM");
    </script>

    <!-- Favicons -->
    <link href="/img/favicon.png" rel="icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/ytalphabet.css" />
  </head>
  <body>
    <div class="stage">
      <header>
        <button class="menu" id="menuBtn" aria-label="All letters">
          <span></span>
        </button>
        <div class="brand">
          <svg class="leaf-mark" viewBox="0 0 24 24" fill="none">
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
            <path
              d="M8 16C11 12 14 9 18 7"
              stroke="#274B2F"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <span><span class="a">A</span> to <span class="z">Z</span></span>
        </div>
        <div class="counter" id="counter">1 / 26</div>
      </header>

      <main>
        <div
          class="letter"
          id="letter"
          role="button"
          tabindex="0"
          aria-label="Tap to hear the letter name"
        >
          <div class="glyph" id="glyph">Aa</div>
          <div class="hint">tap the letter</div>
        </div>
        <div class="keyword">
          <div class="art"><img id="kwimg" alt="" /></div>
          <div
            class="word"
            id="word"
            role="button"
            tabindex="0"
            aria-label="Tap to hear the word"
          >
            apple
          </div>
        </div>
      </main>

      <footer>
        <button class="nav" id="prev" aria-label="Previous letter">
          &#8592;
        </button>
        <button class="play" id="play" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5v14l12-7z" fill="currentColor" /></svg
          ><span id="playLabel">Play</span>
        </button>
        <button class="nav" id="next" aria-label="Next letter">&#8594;</button>
      </footer>
    </div>

    <!-- letter grid (hamburger) -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <div class="brand">
          <svg class="leaf-mark" viewBox="0 0 24 24" fill="none">
            <path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z" fill="#8FC07E" />
            <path
              d="M8 16C11 12 14 9 18 7"
              stroke="#274B2F"
              stroke-width="1.6"
              stroke-linecap="round"
            /></svg
          ><span>All letters</span>
        </div>
        <button class="close" id="closeBtn" aria-label="Close">&#10005;</button>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>

    <script>
      /* ---------------------------------------------------------------
   Media:
     images : /img/ytstory/1.1_alphabet/01.jpg … 26.jpg   (one per letter)
     audio  : 01.mp3 … 52.mp3 (letter name, then word, for each letter)
--------------------------------------------------------------- */
      const IMG_DIR = "/img/ytstory/1.1_alphabet/";
      const AUD_DIR = "https://languages.rmlives.com/eng/yt/1.1_alphabet/";

      /* ---- the whole alphabet: one line per letter ---- */
      const LETTERS = [
        { L: "A", w: "apple" },
        { L: "B", w: "ball" },
        { L: "C", w: "cat" },
        { L: "D", w: "dog" },
        { L: "E", w: "egg" },
        { L: "F", w: "fish" },
        { L: "G", w: "grape" },
        { L: "H", w: "house" },
        { L: "I", w: "igloo" },
        { L: "J", w: "jug" },
        { L: "K", w: "king" },
        { L: "L", w: "log" },
        { L: "M", w: "mat" },
        { L: "N", w: "nose" },
        { L: "O", w: "owl" },
        { L: "P", w: "pen" },
        { L: "Q", w: "queen" },
        { L: "R", w: "rat" },
        { L: "S", w: "sun" },
        { L: "T", w: "tree" },
        { L: "U", w: "umbrella" },
        { L: "V", w: "vase" },
        { L: "W", w: "water" },
        { L: "X", w: "xylophone" },
        { L: "Y", w: "yolk" },
        { L: "Z", w: "zebra" },
      ];
    </script>
    <script src="/assets/js/ytalphabet.js"></script>
  </body>
</html>
